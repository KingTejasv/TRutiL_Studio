<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRutiL Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Ole&display=swap" rel="stylesheet">
<script src="nav-data.js"></script>
<style>
    :root {
        --bg-main: #000000;
        --bg-sidebar: #0a0a0a;
        --border-color: #1a1a1a;
        --text-main: #ffffff;
        --text-muted: #a1a1aa;
        --accent: #00FF25;
        --accent-hover: #33FF51;
        --titlebar-bg: #000000;
    }

    * { box-sizing: border-box; }
    body {
        margin: 0; padding: 0;
        background: var(--bg-main);
        color: var(--text-main);
        font-family: 'Inter', sans-serif;
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
    }

    /* Windows 11 Native Title Bar Region */
    #titlebar {
        height: 40px;
        -webkit-app-region: drag;
        background: var(--titlebar-bg);
        display: flex;
        align-items: center;
        padding-left: 1rem;
        flex-shrink: 0;
        z-index: 9999;
    }
    .titlebar-logo {
        font-family: 'Ole', cursive;
        font-size: 1.25rem;
        color: var(--text-main);
        display: flex;
        align-items: center;
        gap: 0.5rem;
    }
    .titlebar-logo span { color: var(--accent); }

    /* Layout Wrapper */
    .app-wrapper {
        display: flex;
        flex-grow: 1;
        height: calc(100vh - 40px);
    }

    /* Fixed Sidebar */
    .app-sidebar {
        width: 280px;
        background: var(--bg-sidebar);
        border-right: 1px solid var(--border-color);
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
        overflow-y: auto;
    }
    
    .app-sidebar::-webkit-scrollbar { width: 6px; }
    .app-sidebar::-webkit-scrollbar-track { background: transparent; }
    .app-sidebar::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }

    .sidebar-section {
        padding: 1rem 0;
        border-bottom: 1px solid var(--border-color);
    }
    .sidebar-section:last-child { border-bottom: none; }

    .cat-title {
        padding: 0 1rem;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--text-muted);
        font-weight: 600;
        margin-bottom: 0.5rem;
    }

    .tool-link {
        display: block;
        padding: 0.5rem 1rem 0.5rem 1.5rem;
        color: var(--text-main);
        text-decoration: none;
        font-size: 0.85rem;
        transition: background 0.2s, color 0.2s;
        cursor: pointer;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .tool-link:hover {
        background: rgba(255, 255, 255, 0.05);
        color: var(--accent-hover);
    }
    .tool-link.active {
        background: rgba(0, 255, 37, 0.1);
        color: var(--accent);
        border-right: 2px solid var(--accent);
    }

    /* Accordion Toggle */
    .acc-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.75rem 1rem;
        cursor: pointer;
        font-weight: 500;
        font-size: 0.9rem;
        transition: background 0.2s;
    }
    .acc-header:hover { background: rgba(255,255,255,0.05); }
    .acc-header svg { transition: transform 0.2s; width: 16px; height: 16px; }
    .acc-content { display: none; }
    .acc-group.open .acc-content { display: block; }
    .acc-group.open .acc-header svg { transform: rotate(90deg); color: var(--accent); }

    /* Webview Container */
    .app-content {
        flex-grow: 1;
        background: var(--bg-main);
        display: flex;
        flex-direction: column;
    }
    
    webview {
        flex-grow: 1;
        width: 100%;
        height: 100%;
        border: none;
        background: transparent;
    }

    .hub-link {
        padding: 1rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-weight: 600;
        color: var(--text-main);
        text-decoration: none;
        border-bottom: 1px solid var(--border-color);
        cursor: pointer;
    }
    .hub-link:hover { color: var(--accent); }

</style>
</head>
<body>

    <!-- Native Draggable Title Bar -->
    <div id="titlebar">
        <div class="titlebar-logo"><span>✨</span> TRutiL Studio</div>
    </div>

    <!-- App Layout -->
    <div class="app-wrapper">
        <!-- Sidebar Navigation -->
        <div class="app-sidebar" id="sidebar-nav">
            <a class="hub-link" onclick="loadTool('index.html', this)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                Home Hub
            </a>
            <!-- Injected dynamically -->
        </div>

        <!-- Main Workspace (WebView) -->
        <div class="app-content">
            <webview id="workspace" src="index.html" nodeintegration></webview>
        </div>
    </div>

    <script>
        const sidebarNav = document.getElementById('sidebar-nav');
        const workspace = document.getElementById('workspace');
        
        function loadTool(path, element) {
            // Update webview src
            workspace.src = path;
            
            // Update active state in sidebar
            document.querySelectorAll('.tool-link, .hub-link').forEach(el => el.classList.remove('active'));
            if(element) {
                element.classList.add('active');
            }
        }

        // Build Sidebar from navData
        if (window.navData) {
            for (const [mainCat, subCats] of Object.entries(window.navData)) {
                const group = document.createElement('div');
                group.className = 'acc-group';
                
                // Header
                const header = document.createElement('div');
                header.className = 'acc-header';
                header.innerHTML = `
                    <span>${mainCat}</span>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
                `;
                header.onclick = () => {
                    const isOpen = group.classList.contains('open');
                    document.querySelectorAll('.acc-group').forEach(g => g.classList.remove('open'));
                    if(!isOpen) group.classList.add('open');
                };

                // Content
                const content = document.createElement('div');
                content.className = 'acc-content';

                for (const [subCat, tools] of Object.entries(subCats)) {
                    const catTitle = document.createElement('div');
                    catTitle.className = 'cat-title';
                    catTitle.style.marginTop = '0.5rem';
                    catTitle.textContent = subCat;
                    content.appendChild(catTitle);

                    tools.forEach(tool => {
                        const link = document.createElement('a');
                        link.className = 'tool-link';
                        link.textContent = tool.name;
                        link.onclick = (e) => loadTool('tools/' + tool.path, e.target);
                        content.appendChild(link);
                    });
                }

                group.appendChild(header);
                group.appendChild(content);
                sidebarNav.appendChild(group);
            }
        }

        // Intercept navigation inside webview to keep sidebar in sync if needed
        workspace.addEventListener('did-navigate', (e) => {
            // Optional: highlight the correct sidebar item based on URL
        });
    </script>
</body>
</html>
