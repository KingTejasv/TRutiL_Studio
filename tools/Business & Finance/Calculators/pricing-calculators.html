<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Pricing & Margin Calculators - TRutiL Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<link href="../../../style.css" rel="stylesheet"/>
<link href="../../../custom-tools.css" rel="stylesheet"/>
<script src="../../../theme.js"></script>
<style>
    .panel { display: flex; flex-direction: column; gap: 1rem; }
    .metrics-bar {
        display: flex; justify-content: space-between; padding: 1rem;
        background: linear-gradient(to right, rgba(0,0,0,0.02), transparent);
        border: 1px solid var(--border); border-radius: var(--radius-sm);
        margin-top: 1rem; align-items: center;
    }
    [data-theme="dark"] .metrics-bar {
        background: linear-gradient(to right, rgba(255,255,255,0.02), transparent);
    }
</style>
</head>
<body>
<div class="app-layout" id="app-layout">
<div class="main-content">
<div class="page-content">
<div class="tool-layout-container">
    <div class="app-header">
        <h1>💰 Pricing & Margin Calculators</h1>
        <p>Calculate profit margins and optimal freelance rates.</p>
    </div>
    
    <div class="split-pane">
        <div class="panel">
            <div class="pane-header"><div class="pane-title">Profit Margin Calculator</div></div>
            <div class="form-group"><label class="form-label">Cost ($)</label><input type="number" class="form-input" id="pm-cost"></div>
            <div class="form-group"><label class="form-label">Revenue / Price ($)</label><input type="number" class="form-input" id="pm-rev"></div>
            <button class="btn btn-primary" onclick="calcPM()">Calculate Margin</button>
            <div class="metrics-bar" style="flex-direction:column; gap:0.5rem; align-items:flex-start;">
                <div style="width:100%; display:flex; justify-content:space-between;"><span>Gross Profit:</span><strong id="pm-gp">$0.00</strong></div>
                <div style="width:100%; display:flex; justify-content:space-between;"><span>Margin:</span><strong id="pm-m">0%</strong></div>
            </div>
        </div>
        <div class="panel">
            <div class="pane-header"><div class="pane-title">Freelance Rate Calculator</div></div>
            <div class="form-group"><label class="form-label">Target Annual Salary ($)</label><input type="number" class="form-input" id="fr-sal"></div>
            <div class="form-group"><label class="form-label">Billable Hours / Week</label><input type="number" class="form-input" id="fr-hrs" value="30"></div>
            <div class="form-group"><label class="form-label">Weeks Worked / Year</label><input type="number" class="form-input" id="fr-wks" value="48"></div>
            <button class="btn btn-primary" onclick="calcFR()">Calculate Hourly Rate</button>
            <div class="metrics-bar"><span style="font-weight:500;">Minimum Hourly Rate:</span><strong id="fr-res" style="font-size:1.25rem;">$0.00/hr</strong></div>
        </div>
    </div>

</div>
</div>
</div>
</div>

<script>
    function calcPM() {
        const c = parseFloat(document.getElementById('pm-cost').value)||0;
        const r = parseFloat(document.getElementById('pm-rev').value)||0;
        const gp = r - c;
        document.getElementById('pm-gp').textContent = "$" + gp.toFixed(2);
        if(r > 0) {
            document.getElementById('pm-m').textContent = ((gp/r)*100).toFixed(2) + "%";
        }
    }
    function calcFR() {
        const s = parseFloat(document.getElementById('fr-sal').value)||0;
        const h = parseFloat(document.getElementById('fr-hrs').value)||0;
        const w = parseFloat(document.getElementById('fr-wks').value)||0;
        const totalHrs = h * w;
        if(totalHrs > 0) {
            const rate = s / totalHrs;
            document.getElementById('fr-res').textContent = "$" + rate.toFixed(2) + "/hr";
        }
    }
</script>

</body>
</html>
