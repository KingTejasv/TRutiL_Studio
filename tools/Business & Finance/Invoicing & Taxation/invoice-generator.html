<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Professional Invoice Generator — TRutiL Studio</title>
<link href="../../../style.css?v=3" rel="stylesheet"/>
<link href="../../../custom-tools.css?v=3" rel="stylesheet"/>
<script src="../../../theme.js?v=3"></script>
<style>
    .layout-wrapper { display: flex; gap: 20px; flex-direction: column; @media (min-width: 1000px) { flex-direction: row; } }
    
    .editor-section { flex: 1.2; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 25px; }
    .preview-section { flex: 1.5; display: flex; flex-direction: column; gap: 15px; }
    
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; font-size: 0.9rem; font-weight: 500; color: var(--text-secondary); }
    .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 10px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--bg-input); color: var(--text-primary); font-family: inherit; }
    
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    
    .items-table { width: 100%; border-collapse: collapse; margin-bottom: 15px; }
    .items-table th, .items-table td { padding: 10px; text-align: left; border-bottom: 1px solid var(--border); }
    .items-table input { width: 100%; padding: 8px; border-radius: 4px; border: 1px solid var(--border); background: var(--bg-input); color: var(--text-primary); }
    
    .btn-sm { padding: 5px 10px; font-size: 0.8rem; }
    .del-btn { color: #ef4444; background: transparent; border: none; cursor: pointer; font-weight: bold; }
    
    /* -------------------------------------
       A4 Printable Invoice Container 
       ------------------------------------- */
    .invoice-container {
        background: #ffffff; /* Always white for printing */
        color: #000000;
        padding: 40px;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        min-height: 800px;
        position: relative;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    
    .inv-header { display: flex; justify-content: space-between; border-bottom: 2px solid #e5e7eb; padding-bottom: 20px; margin-bottom: 20px; }
    .inv-logo-wrapper { max-width: 150px; max-height: 80px; }
    .inv-logo-wrapper img { max-width: 100%; max-height: 80px; object-fit: contain; }
    .inv-title { font-size: 2.5rem; font-weight: 300; color: #374151; margin: 0; text-transform: uppercase; letter-spacing: 2px; text-align: right; }
    
    .inv-details { display: flex; justify-content: space-between; margin-bottom: 40px; }
    .inv-address h4 { margin: 0 0 5px 0; color: #111827; font-size: 1.1rem; }
    .inv-address p { margin: 0; color: #4b5563; font-size: 0.95rem; white-space: pre-wrap; line-height: 1.5; }
    
    .inv-meta { text-align: right; }
    .inv-meta-row { display: flex; justify-content: flex-end; gap: 20px; margin-bottom: 5px; }
    .inv-meta-label { color: #6b7280; font-weight: 500; }
    .inv-meta-value { color: #111827; font-weight: 600; min-width: 120px; }
    
    .inv-table { width: 100%; border-collapse: collapse; margin-bottom: 30px; }
    .inv-table th { background: #f3f4f6; color: #374151; padding: 12px; text-align: left; font-weight: 600; border-bottom: 2px solid #d1d5db; }
    .inv-table td { padding: 12px; border-bottom: 1px solid #e5e7eb; color: #1f2937; }
    .inv-table th.text-right, .inv-table td.text-right { text-align: right; }
    
    .inv-totals { display: flex; justify-content: flex-end; }
    .inv-totals-box { width: 300px; }
    .inv-totals-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #e5e7eb; }
    .inv-totals-row.grand-total { font-size: 1.25rem; font-weight: 700; color: #111827; border-bottom: none; border-top: 2px solid #111827; padding-top: 12px; margin-top: 4px; }
    
    /* Print Styles */
    @media print {
        body * { visibility: hidden; }
        .invoice-container, .invoice-container * { visibility: visible; }
        .invoice-container { position: absolute; left: 0; top: 0; width: 100%; padding: 0; box-shadow: none; border: none; min-height: auto; }
        .app-layout, .app-header, .editor-section { display: none !important; }
        @page { size: A4; margin: 20mm; }
    }
</style>
</head>
<body>
<div class="app-layout" id="app-layout">
<div class="main-content">
<div class="page-content">
    <div class="app-header">
        <div class="app-icon" style="background:linear-gradient(135deg,#6366f1,#4f46e5);color:white;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:24px;">🧾</div>
        <div>
            <h1>Professional Invoice Generator</h1>
            <p>Create beautiful, print-ready invoices with itemized billing and dynamic taxes.</p>
        </div>
    </div>
    
    <div class="layout-wrapper">
        <!-- Editor Section -->
        <div class="editor-section">
            <h3 style="margin-top:0; border-bottom: 1px solid var(--border); padding-bottom: 10px;">Invoice Details</h3>
            
            <div class="grid-2">
                <div class="form-group">
                    <label>Invoice Number</label>
                    <input type="text" id="in-num" value="INV-2026-001" oninput="updateInvoice()">
                </div>
                <div class="form-group">
                    <label>Date</label>
                    <input type="date" id="in-date" oninput="updateInvoice()">
                </div>
            </div>
            
            <div class="grid-2">
                <div class="form-group">
                    <label>From (Your Details)</label>
                    <textarea id="in-from" rows="4" oninput="updateInvoice()">Acme Corp
123 Business Rd.
New York, NY 10001
contact@acme.com</textarea>
                </div>
                <div class="form-group">
                    <label>To (Client Details)</label>
                    <textarea id="in-to" rows="4" oninput="updateInvoice()">John Doe
456 Client Avenue
San Francisco, CA 94107
johndoe@example.com</textarea>
                </div>
            </div>
            
            <h3 style="border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-top: 10px;">Line Items</h3>
            <table class="items-table" id="items-table">
                <thead>
                    <tr>
                        <th style="width: 50%;">Description</th>
                        <th style="width: 15%;">Qty</th>
                        <th style="width: 25%;">Rate</th>
                        <th style="width: 10%;"></th>
                    </tr>
                </thead>
                <tbody id="items-body">
                    <!-- Dynamic items -->
                </tbody>
            </table>
            <button class="btn btn-secondary btn-sm" onclick="addItem()">+ Add Item</button>
            
            <h3 style="border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-top: 30px;">Configuration</h3>
            <div class="grid-2">
                <div class="form-group">
                    <label>Currency Symbol</label>
                    <input type="text" id="in-currency" value="$" oninput="updateInvoice()">
                </div>
                <div class="form-group">
                    <label>Tax %</label>
                    <input type="number" id="in-tax" value="10" min="0" oninput="updateInvoice()">
                </div>
            </div>
            <div class="form-group">
                <label>Company Logo (Optional)</label>
                <input type="file" id="in-logo" accept="image/*">
            </div>
        </div>
        
        <!-- Preview Section -->
        <div class="preview-section">
            <button class="btn btn-primary" onclick="window.print()" style="align-self: flex-end; margin-bottom: 10px;">🖨️ Download PDF / Print</button>
            
            <!-- Actual Printable Invoice -->
            <div class="invoice-container" id="invoice-preview">
                <div class="inv-header">
                    <div class="inv-logo-wrapper">
                        <img id="out-logo" src="" style="display:none;">
                    </div>
                    <div>
                        <h1 class="inv-title">INVOICE</h1>
                    </div>
                </div>
                
                <div class="inv-details">
                    <div class="inv-address">
                        <h4>From</h4>
                        <p id="out-from"></p>
                    </div>
                    <div class="inv-meta">
                        <div class="inv-meta-row">
                            <span class="inv-meta-label">Invoice #:</span>
                            <span class="inv-meta-value" id="out-num"></span>
                        </div>
                        <div class="inv-meta-row">
                            <span class="inv-meta-label">Date:</span>
                            <span class="inv-meta-value" id="out-date"></span>
                        </div>
                    </div>
                </div>
                
                <div class="inv-details">
                    <div class="inv-address">
                        <h4>Bill To</h4>
                        <p id="out-to"></p>
                    </div>
                </div>
                
                <table class="inv-table">
                    <thead>
                        <tr>
                            <th>Description</th>
                            <th class="text-right">Qty</th>
                            <th class="text-right">Rate</th>
                            <th class="text-right">Amount</th>
                        </tr>
                    </thead>
                    <tbody id="out-items">
                        <!-- Items rendered here -->
                    </tbody>
                </table>
                
                <div class="inv-totals">
                    <div class="inv-totals-box">
                        <div class="inv-totals-row">
                            <span class="inv-meta-label">Subtotal</span>
                            <span class="inv-meta-value text-right" id="out-subtotal"></span>
                        </div>
                        <div class="inv-totals-row">
                            <span class="inv-meta-label">Tax (<span id="out-tax-pct">0</span>%)</span>
                            <span class="inv-meta-value text-right" id="out-tax-amt"></span>
                        </div>
                        <div class="inv-totals-row grand-total">
                            <span>Total</span>
                            <span class="text-right" id="out-total"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</div>
</div>

<script>
    // Set default date
    document.getElementById('in-date').valueAsDate = new Date();
    
    let items = [
        { desc: "Web Development Services", qty: 1, rate: 1500.00 },
        { desc: "Server Hosting (1 Year)", qty: 1, rate: 250.00 }
    ];
    
    // Handle logo upload
    document.getElementById('in-logo').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(evt) {
                const img = document.getElementById('out-logo');
                img.src = evt.target.result;
                img.style.display = 'block';
            }
            reader.readAsDataURL(file);
        }
    });

    function renderEditorItems() {
        const tbody = document.getElementById('items-body');
        tbody.innerHTML = '';
        items.forEach((item, index) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><input type="text" value="${item.desc}" oninput="updateItem(${index}, 'desc', this.value)"></td>
                <td><input type="number" value="${item.qty}" min="1" oninput="updateItem(${index}, 'qty', this.value)"></td>
                <td><input type="number" value="${item.rate}" min="0" step="0.01" oninput="updateItem(${index}, 'rate', this.value)"></td>
                <td><button class="del-btn" onclick="removeItem(${index})">✕</button></td>
            `;
            tbody.appendChild(tr);
        });
        updateInvoice();
    }
    
    function addItem() {
        items.push({ desc: "", qty: 1, rate: 0 });
        renderEditorItems();
    }
    
    function removeItem(index) {
        items.splice(index, 1);
        renderEditorItems();
    }
    
    function updateItem(index, field, value) {
        if (field === 'desc') items[index].desc = value;
        else items[index][field] = parseFloat(value) || 0;
        updateInvoice();
    }
    
    function updateInvoice() {
        const cur = document.getElementById('in-currency').value;
        
        // Update texts
        document.getElementById('out-num').textContent = document.getElementById('in-num').value;
        document.getElementById('out-date').textContent = document.getElementById('in-date').value;
        document.getElementById('out-from').textContent = document.getElementById('in-from').value;
        document.getElementById('out-to').textContent = document.getElementById('in-to').value;
        
        // Update table
        const outItems = document.getElementById('out-items');
        outItems.innerHTML = '';
        
        let subtotal = 0;
        items.forEach(item => {
            const amount = item.qty * item.rate;
            subtotal += amount;
            
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${item.desc}</td>
                <td class="text-right">${item.qty}</td>
                <td class="text-right">${cur}${item.rate.toFixed(2)}</td>
                <td class="text-right">${cur}${amount.toFixed(2)}</td>
            `;
            outItems.appendChild(tr);
        });
        
        // Calculate Totals
        const taxPct = parseFloat(document.getElementById('in-tax').value) || 0;
        const taxAmt = subtotal * (taxPct / 100);
        const total = subtotal + taxAmt;
        
        document.getElementById('out-subtotal').textContent = `${cur}${subtotal.toFixed(2)}`;
        document.getElementById('out-tax-pct').textContent = taxPct;
        document.getElementById('out-tax-amt').textContent = `${cur}${taxAmt.toFixed(2)}`;
        document.getElementById('out-total').textContent = `${cur}${total.toFixed(2)}`;
    }
    
    // Init
    renderEditorItems();
</script>
</body>
</html>
