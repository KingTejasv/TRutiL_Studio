<body><div class="app-layout" id="app-layout"><div class="main-content"><div class="page-content"><div id="tool-cypher-htpasswd-generator">
<div class="app-header">
<h1>🔐 .htpasswd Generator</h1>
<p>Generate secure passwords for Apache basic authentication.</p>
</div>
<div class="tool-layout-container">
<div class="panel">
<h2>👤 Credentials</h2>
<div class="form-group">
<label for="username">Username</label>
<input class="form-input" id="username" oninput="generate()" placeholder="e.g. admin" type="text"/>
</div>
<div class="form-group">
<label for="password">Password</label>
<input class="form-input" id="password" oninput="generate()" placeholder="Enter secure password" type="password"/>
</div>
<div class="form-group">
<label for="algo">Hashing Algorithm</label>
<select class="form-input" id="algo" onchange="generate()">
<option value="bcrypt">Bcrypt (Recommended, Most Secure)</option>
<option value="sha1">SHA-1 (Legacy, widely supported)</option>
</select>
</div>
</div>
<div class="panel">
<h2>📄 Generated .htpasswd Entry</h2>
<textarea class="form-input" id="output" placeholder="username:hash" readonly=""></textarea>
<button class="btn" onclick="copyCode()">📋 Copy to Clipboard</button>
</div>
</div>
<script>
    async function generate() {
        const user = document.getElementById('username').value.trim();
        const pass = document.getElementById('password').value;
        const algo = document.getElementById('algo').value;
        const out = document.getElementById('output');
        
        if (!user || !pass) {
            out.value = '';
            return;
        }
        
        try {
            let hash = '';
            if (algo === 'bcrypt') {
                if (typeof dcodeIO !== 'undefined' && dcodeIO.bcrypt) {
                    const salt = dcodeIO.bcrypt.genSaltSync(10);
                    hash = dcodeIO.bcrypt.hashSync(pass, salt);
                } else {
                    hash = "Error: Bcrypt library failed to load.";
                }
            } else if (algo === 'sha1') {
                const encoder = new TextEncoder();
                const data = encoder.encode(pass);
                const buf = await crypto.subtle.digest("SHA-1", data);
                const b64 = btoa(String.fromCharCode(...new Uint8Array(buf)));
                hash = '{SHA}' + b64;
            }
            
            out.value = `${user}:${hash}`;
        } catch (err) {
            out.value = `Error generating hash: ${err.message}`;
        }
    }

    function copyCode() {
        const out = document.getElementById('output');
        if(!out.value) return;
        out.select();
        document.execCommand('copy');
        const btn = document.querySelector('.panel:last-child .btn');
        const originalText = btn.innerHTML;
        btn.innerHTML = '✅ Copied!';
        setTimeout(() => btn.innerHTML = originalText, 2000);
    }
</script>
