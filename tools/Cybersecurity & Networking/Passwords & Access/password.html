<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Password Generator – TRutiL Studio</title>
<link href="../../../style.css?v=3" rel="stylesheet"/>

<link href="../../../custom-tools.css?v=3" rel="stylesheet"/>
    <script src="../../../theme.js?v=3"></script>
</head>
<body>
<div class="app-layout" id="app-layout">
<div class="main-content">
<div class="page-content"><div id="tool-password">
<div class="pg-wrapper">
<!-- Page Header -->
<div class="pg-page-header">
<h1>🔐 Password Generator</h1>
<p>Create secure, random passwords in seconds</p>
</div>
<!-- Display Card -->
<div class="pg-display-card">
<div class="pg-display-label">Generated Password</div>
<div class="pg-passwords-list" id="passwordsList"></div>
<div class="pg-error-msg" id="errorMsg">⚠ Please select at least one character type.</div>
<!-- Strength bar -->
<div class="pg-strength-row">
<div class="pg-strength-track">
<div class="pg-strength-fill" id="strengthFill"></div>
</div>
<div class="pg-strength-label" id="strengthLabel">—</div>
</div>
<!-- Action buttons -->
<div class="pg-actions">
<button class="pg-btn-generate btn btn-primary" id="generateBtn">
<svg fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" viewbox="0 0 24 24" width="16">
<path d="M23 4v6h-6"></path><path d="M1 20v-6h6"></path>
<path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
</svg>
                Regenerate
              </button>
<button class="pg-btn-copy btn btn-primary" id="copyAllBtn">
<svg fill="none" height="15" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewbox="0 0 24 24" width="15">
<rect height="13" rx="2" ry="2" width="13" x="9" y="9"></rect>
<path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
</svg>
<span id="copyAllText">Copy All</span>
</button>
</div>
</div>
<!-- Settings Card -->
<div class="pg-settings-card">
<div class="pg-section-title">Settings</div>
<!-- Length slider -->
<div class="pg-slider-row">
<div class="pg-slider-header">
<span class="pg-slider-label">Password Length</span>
<span class="pg-slider-value" id="lengthValue">16</span>
</div>
<input class="pg-range" id="lengthSlider" max="128" min="8" type="range" value="16"/>
</div>
<!-- Quantity slider -->
<div class="pg-qty-row">
<div class="pg-slider-header">
<span class="pg-slider-label">Quantity</span>
<span class="pg-slider-value" id="quantityValue">1</span>
</div>
<input class="pg-range" id="quantitySlider" max="10" min="1" type="range" value="1"/>
</div>
<!-- Character types -->
<div>
<div class="pg-section-title" style="margin-bottom: 12px;">Character Types</div>
<div class="pg-checkbox-grid">
<label class="pg-checkbox-item checked" id="chk-upper">
<input checked="" id="useUpper" type="checkbox"/>
<div class="pg-checkbox-box">
<svg fill="none" height="11" stroke="white" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.5" viewbox="0 0 24 24" width="11"><polyline points="20 6 9 17 4 12"></polyline></svg>
</div>
<div class="pg-checkbox-text">
<span class="pg-checkbox-name">Uppercase</span>
<span class="pg-checkbox-desc">A B C … Z</span>
</div>
</label>
<label class="pg-checkbox-item checked" id="chk-lower">
<input checked="" id="useLower" type="checkbox"/>
<div class="pg-checkbox-box">
<svg fill="none" height="11" stroke="white" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.5" viewbox="0 0 24 24" width="11"><polyline points="20 6 9 17 4 12"></polyline></svg>
</div>
<div class="pg-checkbox-text">
<span class="pg-checkbox-name">Lowercase</span>
<span class="pg-checkbox-desc">a b c … z</span>
</div>
</label>
<label class="pg-checkbox-item checked" id="chk-numbers">
<input checked="" id="useNumbers" type="checkbox"/>
<div class="pg-checkbox-box">
<svg fill="none" height="11" stroke="white" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.5" viewbox="0 0 24 24" width="11"><polyline points="20 6 9 17 4 12"></polyline></svg>
</div>
<div class="pg-checkbox-text">
<span class="pg-checkbox-name">Numbers</span>
<span class="pg-checkbox-desc">0 1 2 … 9</span>
</div>
</label>
<label class="pg-checkbox-item" id="chk-symbols">
<input id="useSymbols" type="checkbox"/>
<div class="pg-checkbox-box">
<svg fill="none" height="11" stroke="white" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.5" viewbox="0 0 24 24" width="11"><polyline points="20 6 9 17 4 12"></polyline></svg>
</div>
<div class="pg-checkbox-text">
<span class="pg-checkbox-name">Symbols</span>
<span class="pg-checkbox-desc">! @ # $ % …</span>
</div>
</label>
<label class="pg-checkbox-item" id="chk-ambiguous" style="grid-column: 1 / -1;">
<input id="excludeAmbiguous" type="checkbox"/>
<div class="pg-checkbox-box">
<svg fill="none" height="11" stroke="white" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.5" viewbox="0 0 24 24" width="11"><polyline points="20 6 9 17 4 12"></polyline></svg>
</div>
<div class="pg-checkbox-text">
<span class="pg-checkbox-name">Exclude Ambiguous Characters</span>
<span class="pg-checkbox-desc">Removes: 0 O o l 1 I i | ` ' " ; : , . ~</span>
</div>
</label>
</div>
</div>
</div>
<!-- History Card -->
<div class="pg-history-card">
<div class="pg-history-header">
<div class="pg-history-title">Recent Passwords</div>
<button class="pg-history-clear btn btn-primary" id="clearHistoryBtn">Clear</button>
</div>
<div class="pg-history-list" id="historyList">
<div class="pg-history-empty">No history yet — generate your first password!</div>
</div>
</div>
</div>
</div></div>
</div>
</div>
<script>
    (() => {
      // ── Character sets ──────────────────────────────────────────
      const CHARS = {
        upper:   'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
        lower:   'abcdefghijklmnopqrstuvwxyz',
        numbers: '0123456789',
        symbols: '!@#$%^&*()_+-=[]{}|;:,.<>?/~`'
      };
      const AMBIGUOUS = /[0OolI1i|`'"';:,.~]/g;

      // ── DOM refs ─────────────────────────────────────────────────
      const passwordsList   = document.getElementById('passwordsList');
      const errorMsg        = document.getElementById('errorMsg');
      const strengthFill    = document.getElementById('strengthFill');
      const strengthLabel   = document.getElementById('strengthLabel');
      const generateBtn     = document.getElementById('generateBtn');
      const copyAllBtn      = document.getElementById('copyAllBtn');
      const copyAllText     = document.getElementById('copyAllText');
      const lengthSlider    = document.getElementById('lengthSlider');
      const lengthValue     = document.getElementById('lengthValue');
      const quantitySlider  = document.getElementById('quantitySlider');
      const quantityValue   = document.getElementById('quantityValue');
      const useUpper        = document.getElementById('useUpper');
      const useLower        = document.getElementById('useLower');
      const useNumbers      = document.getElementById('useNumbers');
      const useSymbols      = document.getElementById('useSymbols');
      const excludeAmbiguous = document.getElementById('excludeAmbiguous');
      const historyList     = document.getElementById('historyList');
      const clearHistoryBtn = document.getElementById('clearHistoryBtn');

      // ── State ────────────────────────────────────────────────────
      let history = [];
      let currentPasswords = [];
      const MAX_HISTORY = 5;

      // ── Strength config ──────────────────────────────────────────
      const STRENGTH_LEVELS = [
        { max: 20,  label: 'Weak',      color: '#f87171', pct: 15 },
        { max: 35,  label: 'Fair',      color: '#fb923c', pct: 35 },
        { max: 55,  label: 'Good',      color: '#facc15', pct: 55 },
        { max: 75,  label: 'Strong',    color: '#4ade80', pct: 78 },
        { max: Infinity, label: 'Very Strong', color: '#34d399', pct: 100 }
      ];

      function calcScore(password) {
        const len = password.length;
        let variety = 0;
        if (/[A-Z]/.test(password)) variety++;
        if (/[a-z]/.test(password)) variety++;
        if (/[0-9]/.test(password)) variety++;
        if (/[^A-Za-z0-9]/.test(password)) variety++;
        return len * 0.55 + variety * 6;
      }

      function updateStrength(password) {
        if (!password) {
          strengthFill.style.width = '0%';
          strengthLabel.textContent = '—';
          strengthLabel.style.color = 'rgba(255,255,255,0.3)';
          return;
        }
        const score = calcScore(password);
        const lvl = STRENGTH_LEVELS.find(l => score <= l.max) || STRENGTH_LEVELS[STRENGTH_LEVELS.length - 1];
        strengthFill.style.width  = lvl.pct + '%';
        strengthFill.style.background = lvl.color;
        strengthLabel.textContent = lvl.label;
        strengthLabel.style.color = lvl.color;
      }

      // ── Core generator ───────────────────────────────────────────
      function buildCharset() {
        let charset = '';
        if (useUpper.checked)   charset += CHARS.upper;
        if (useLower.checked)   charset += CHARS.lower;
        if (useNumbers.checked) charset += CHARS.numbers;
        if (useSymbols.checked) charset += CHARS.symbols;
        if (excludeAmbiguous.checked) charset = charset.replace(AMBIGUOUS, '');
        return charset;
      }

      function generateOne(length, charset) {
        // Guarantee at least one char from each selected type
        let mandatory = [];
        const applyAmbiguous = (s) => excludeAmbiguous.checked ? s.replace(AMBIGUOUS, '') : s;
        if (useUpper.checked)   mandatory.push(randomChar(applyAmbiguous(CHARS.upper)));
        if (useLower.checked)   mandatory.push(randomChar(applyAmbiguous(CHARS.lower)));
        if (useNumbers.checked) mandatory.push(randomChar(applyAmbiguous(CHARS.numbers)));
        if (useSymbols.checked) mandatory.push(randomChar(applyAmbiguous(CHARS.symbols)));

        // Fill remaining
        let pw = mandatory.join('');
        for (let i = pw.length; i < length; i++) {
          pw += randomChar(charset);
        }
        // Shuffle
        return pw.split('').sort(() => Math.random() - 0.5).join('');
      }

      function randomChar(str) {
        if (!str) return '';
        return str[Math.floor(Math.random() * str.length)];
      }

      // ── Render password rows ─────────────────────────────────────
      function renderPasswords(passwords) {
        passwordsList.innerHTML = '';
        const single = passwords.length === 1;
        passwords.forEach((pw, idx) => {
          const row = document.createElement('div');
          row.className = 'pg-password-row';

          const span = document.createElement('div');
          span.className = 'pg-password-text' + (single ? ' single' : '');
          span.textContent = pw;

          if (!single) {
            const copyBtn = document.createElement('button');
            copyBtn.className = 'pg-copy-row-btn';
            copyBtn.textContent = 'Copy';
            copyBtn.addEventListener('click', () => copyText(pw, copyBtn, 'Copied!'));
            row.appendChild(span);
            row.appendChild(copyBtn);
          } else {
            row.appendChild(span);
          }

          passwordsList.appendChild(row);
        });
      }

      // ── Main generate function ───────────────────────────────────
      function generate() {
        const charset = buildCharset();
        if (!charset || charset.length < 2) {
          errorMsg.classList.add('visible');
          passwordsList.innerHTML = '';
          strengthFill.style.width = '0%';
          strengthLabel.textContent = '—';
          return;
        }
        errorMsg.classList.remove('visible');

        const length   = parseInt(lengthSlider.value);
        const quantity = parseInt(quantitySlider.value);

        currentPasswords = Array.from({ length: quantity }, () => generateOne(length, charset));
        renderPasswords(currentPasswords);
        updateStrength(currentPasswords[0]);

        // Add first password of batch to history
        addToHistory(currentPasswords[0], length);

        // Update copy-all label
        copyAllText.textContent = quantity > 1 ? 'Copy All' : 'Copy';
      }

      // ── History management ───────────────────────────────────────
      function addToHistory(pw, len) {
        // Avoid exact duplicate at the top
        if (history.length && history[0].pw === pw) return;
        history.unshift({ pw, len, time: new Date() });
        if (history.length > MAX_HISTORY) history.pop();
        renderHistory();
      }

      function renderHistory() {
        if (!history.length) {
          historyList.innerHTML = '<div class="pg-history-empty">No history yet — generate your first password!</div>';
          return;
        }
        historyList.innerHTML = '';
        history.forEach(item => {
          const el = document.createElement('div');
          el.className = 'pg-history-item';

          const pw = document.createElement('div');
          pw.className = 'pg-history-pw';
          pw.textContent = item.pw;

          const meta = document.createElement('div');
          meta.className = 'pg-history-meta';
          meta.textContent = `${item.len} chars`;

          const copyBtn = document.createElement('button');
          copyBtn.className = 'pg-history-copy';
          copyBtn.title = 'Copy';
          copyBtn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`;
          copyBtn.addEventListener('click', () => {
            copyText(item.pw, copyBtn, null);
          });

          el.appendChild(pw);
          el.appendChild(meta);
          el.appendChild(copyBtn);
          historyList.appendChild(el);
        });
      }

      // ── Copy helper ──────────────────────────────────────────────
      function copyText(text, btn, label) {
        navigator.clipboard.writeText(text).then(() => {
          if (label && btn) {
            const prev = btn.textContent;
            btn.textContent = label;
            btn.classList.add('copied');
            setTimeout(() => {
              btn.textContent = prev;
              btn.classList.remove('copied');
            }, 1800);
          } else if (btn) {
            btn.style.color = '#34d399';
            setTimeout(() => { btn.style.color = ''; }, 1600);
          }
        }).catch(() => {
          // Fallback
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
        });
      }

      // ── Copy All / Copy button ───────────────────────────────────
      copyAllBtn.addEventListener('click', () => {
        if (!currentPasswords.length) return;
        const text = currentPasswords.join('\n');
        copyText(text, null, null);
        const prev = copyAllText.textContent;
        copyAllText.textContent = 'Copied!';
        copyAllBtn.classList.add('copied');
        setTimeout(() => {
          copyAllText.textContent = prev;
          copyAllBtn.classList.remove('copied');
        }, 1800);
      });

      generateBtn.addEventListener('click', generate);

      // ── Slider sync ──────────────────────────────────────────────
      lengthSlider.addEventListener('input', () => {
        lengthValue.textContent = lengthSlider.value;
        updateRangeBackground(lengthSlider, 8, 128);
        generate();
      });
      quantitySlider.addEventListener('input', () => {
        quantityValue.textContent = quantitySlider.value;
        updateRangeBackground(quantitySlider, 1, 10);
        generate();
      });

      function updateRangeBackground(slider, min, max) {
        const pct = ((slider.value - min) / (max - min)) * 100;
        slider.style.background = `linear-gradient(to right, #7c3aed ${pct}%, rgba(255,255,255,0.1) ${pct}%)`;
      }

      // ── Checkbox toggle ──────────────────────────────────────────
      function setupCheckbox(checkboxId, labelId) {
        const cb  = document.getElementById(checkboxId);
        const lbl = document.getElementById(labelId);
        lbl.addEventListener('click', () => {
          cb.checked = !cb.checked;
          lbl.classList.toggle('checked', cb.checked);
          generate();
        });
      }

      setupCheckbox('useUpper',         'chk-upper');
      setupCheckbox('useLower',         'chk-lower');
      setupCheckbox('useNumbers',       'chk-numbers');
      setupCheckbox('useSymbols',       'chk-symbols');
      setupCheckbox('excludeAmbiguous', 'chk-ambiguous');

      // ── Clear history ────────────────────────────────────────────
      clearHistoryBtn.addEventListener('click', () => {
        history = [];
        renderHistory();
      });

      // ── Init ─────────────────────────────────────────────────────
      updateRangeBackground(lengthSlider, 8, 128);
      updateRangeBackground(quantitySlider, 1, 10);
      generate();
    })();
  </script>
</body>
</html>
