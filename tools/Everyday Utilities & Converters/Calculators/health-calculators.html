<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Health & Fitness Calculators – TRutiL Studio</title>
    <meta content="Estimate running pace and calories burned." name="description"/>
    <link href="../../../style.css?v=3" rel="stylesheet"/>
    <link href="../../../custom-tools.css?v=3" rel="stylesheet"/>
    <script src="../../../theme.js?v=3"></script>
</head>
<body>
    <div class="app-layout" id="app-layout">
        <div class="main-content">
            <div class="page-content">
                <div class="app-header">
                    <div class="app-icon">🏃‍♂️</div>
                    <div>
                        <h1>Health & Fitness Calculators</h1>
                        <p>Estimate running pace and calories burned.</p>
                    </div>
                </div>
                <div class="tool-workspace">
                    
<div class="grid-2">
    <!-- Pace -->
    <div class="panel">
        <div class="panel-title">Running Pace Calculator</div>
        <div class="form-group">
            <label class="form-label">Distance (km or miles)</label>
            <input type="number" step="0.01" class="form-input" id="pace-dist" placeholder="e.g. 5" value="5">
        </div>
        <div style="display:flex; gap:10px;">
            <div class="form-group" style="flex:1;">
                <label class="form-label">Hours</label>
                <input type="number" class="form-input" id="pace-h" value="0">
            </div>
            <div class="form-group" style="flex:1;">
                <label class="form-label">Minutes</label>
                <input type="number" class="form-input" id="pace-m" value="25">
            </div>
            <div class="form-group" style="flex:1;">
                <label class="form-label">Seconds</label>
                <input type="number" class="form-input" id="pace-s" value="0">
            </div>
        </div>
        <button class="btn btn-primary w-full" id="btn-calc-pace">Calculate Pace</button>
        
        <div class="result-card" style="margin-top:20px; background: var(--accent-orange); text-align:center;">
            <div style="font-size: 14px; opacity: 0.9;">Your Pace</div>
            <div id="res-pace" class="result-big" style="-webkit-text-fill-color:#fff;">0:00 / unit</div>
        </div>
    </div>

    <!-- Calories -->
    <div class="panel">
        <div class="panel-title">Calories Burned Estimator</div>
        <div class="form-group">
            <label class="form-label">Body Weight (kg)</label>
            <input type="number" class="form-input" id="cal-weight" placeholder="e.g. 70" value="70">
        </div>
        <div class="form-group">
            <label class="form-label">Activity Duration (minutes)</label>
            <input type="number" class="form-input" id="cal-time" placeholder="e.g. 45" value="45">
        </div>
        <div class="form-group">
            <label class="form-label">Activity Type (MET value)</label>
            <select class="form-select" id="cal-met">
                <option value="3.5">Walking (moderate)</option>
                <option value="7.0" selected>Jogging</option>
                <option value="8.0">Cycling (moderate)</option>
                <option value="6.0">Weight Training</option>
                <option value="10.0">Swimming</option>
            </select>
        </div>
        <button class="btn btn-primary w-full" id="btn-calc-cal">Calculate Calories</button>

        <div class="result-card" style="margin-top:20px; text-align:center;">
            <div style="font-size: 14px; opacity: 0.9;">Estimated Calories Burned</div>
            <div id="res-cal" style="font-size: 2.5rem; font-weight:bold; color: var(--accent-orange);">0 kcal</div>
        </div>
    </div>
</div>

                </div>
            </div>
        </div>
    </div>
    <script>

document.getElementById('btn-calc-pace').addEventListener('click', () => {
    let dist = parseFloat(document.getElementById('pace-dist').value) || 0;
    let h = parseInt(document.getElementById('pace-h').value) || 0;
    let m = parseInt(document.getElementById('pace-m').value) || 0;
    let s = parseInt(document.getElementById('pace-s').value) || 0;
    
    let totalMin = (h * 60) + m + (s / 60);
    if(dist > 0 && totalMin > 0) {
        let paceDec = totalMin / dist;
        let pM = Math.floor(paceDec);
        let pS = Math.round((paceDec - pM) * 60);
        document.getElementById('res-pace').textContent = pM + ":" + String(pS).padStart(2,'0') + " / unit";
    }
});

document.getElementById('btn-calc-cal').addEventListener('click', () => {
    let w = parseFloat(document.getElementById('cal-weight').value) || 0;
    let t = parseFloat(document.getElementById('cal-time').value) || 0;
    let met = parseFloat(document.getElementById('cal-met').value) || 0;
    
    // Formula: Calories = MET * Weight(kg) * Time(hrs)
    let cals = met * w * (t/60);
    document.getElementById('res-cal').textContent = Math.round(cals) + " kcal";
});

    </script>



</body>
</html>
