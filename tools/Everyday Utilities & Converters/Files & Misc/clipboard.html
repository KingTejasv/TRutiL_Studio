<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Clipboard History — TRutiL Studio</title>
<link href="../../../style.css?v=3" rel="stylesheet"/>

<link href="../../../custom-tools.css?v=3" rel="stylesheet"/>
    <script src="../../../theme.js?v=3"></script>
</head>
<body>
<div class="app-layout" id="app-layout">
<div class="main-content">
<div class="page-content"><div id="tool-clipboard">
<div class="app-header">
<div class="app-icon" style="background:linear-gradient(135deg, #8B5CF6, #6D28D9)">📋</div>
<div>
<h1>Clipboard History</h1>
<p>An in-app scratchpad to save, copy, and manage text snippets.</p>
</div>
</div>
<div class="form-group">
<label class="form-label" for="clipboard-input">New Snippet</label>
<textarea class="form-input" id="clipboard-input" placeholder="Type or paste text here... (Press Ctrl+Enter to save)" rows="5"></textarea>
</div>
<button class="btn btn-primary" id="save-btn">Save to History</button>
<div class="header-actions">
<h2 style="font-size: 1.25rem; color: var(--text-primary); margin: 0;">History</h2>
<button class="btn btn-ghost" id="clear-all-btn" style="color: #ef4444; border-color: #ef4444;" title="Clear all history">Clear All</button>
</div>
<div class="history-list" id="history-list">
<!-- History items will be rendered here -->
</div>
</div></div>
</div>
</div>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const input = document.getElementById('clipboard-input');
    const saveBtn = document.getElementById('save-btn');
    const historyList = document.getElementById('history-list');
    const clearAllBtn = document.getElementById('clear-all-btn');

    const STORAGE_KEY = 'TRutiL Studio_clipboard_history';
    let history = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');

    function renderHistory() {
      historyList.innerHTML = '';
      
      if (history.length === 0) {
        historyList.innerHTML = '<div class="empty-state">No saved snippets yet. Start typing above!</div>';
        clearAllBtn.style.display = 'none';
        return;
      }
      
      clearAllBtn.style.display = 'inline-flex';

      history.forEach((item, index) => {
        const itemEl = document.createElement('div');
        itemEl.className = 'history-item';
        
        const date = new Date(item.timestamp).toLocaleString();
        
        const contentDiv = document.createElement('div');
        contentDiv.className = 'history-content';
        contentDiv.textContent = item.text;
        
        const actionsDiv = document.createElement('div');
        actionsDiv.className = 'history-actions';
        actionsDiv.innerHTML = `
            <div class="history-meta">Saved: ${date}</div>
            <div class="action-buttons">
              <button class="btn btn-ghost copy-btn" data-index="${index}">Copy</button>
              <button class="btn btn-ghost delete-btn" data-index="${index}">Delete</button>
            </div>
        `;
        
        itemEl.appendChild(contentDiv);
        itemEl.appendChild(actionsDiv);
        historyList.appendChild(itemEl);
      });
    }

    // Single delegated event listener
    historyList.addEventListener('click', (e) => {
      const target = e.target;
      if (target.classList.contains('copy-btn')) {
        const idx = target.getAttribute('data-index');
        copyToClipboard(history[idx].text, target);
      } else if (target.classList.contains('delete-btn')) {
        const idx = target.getAttribute('data-index');
        deleteItem(idx);
      }
    });

    function saveItem() {
      const text = input.value.trim();
      if (!text) return;

      history.unshift({
        text: text,
        timestamp: Date.now()
      });

      localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
      input.value = '';
      input.focus();
      renderHistory();
    }

    function deleteItem(index) {
      if (confirm('Are you sure you want to delete this snippet?')) {
        history.splice(index, 1);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
        renderHistory();
      }
    }

    async function copyToClipboard(text, btn) {
      try {
        await navigator.clipboard.writeText(text);
        const originalText = btn.innerText;
        btn.innerText = 'Copied!';
        btn.style.color = '#10b981';
        btn.style.borderColor = '#10b981';
        setTimeout(() => {
          btn.innerText = originalText;
          btn.style.color = '';
          btn.style.borderColor = '';
        }, 2000);
      } catch (err) {
        console.error('Failed to copy', err);
        // Fallback for older browsers
        const textarea = document.createElement('textarea');
        textarea.value = text;
        document.body.appendChild(textarea);
        textarea.select();
        try {
          document.execCommand('copy');
          const originalText = btn.innerText;
          btn.innerText = 'Copied!';
          btn.style.color = '#10b981';
          btn.style.borderColor = '#10b981';
          setTimeout(() => {
            btn.innerText = originalText;
            btn.style.color = '';
            btn.style.borderColor = '';
          }, 2000);
        } catch (ex) {
          alert('Failed to copy to clipboard.');
        }
        document.body.removeChild(textarea);
      }
    }

    saveBtn.addEventListener('click', saveItem);

    clearAllBtn.addEventListener('click', () => {
      if (history.length > 0 && confirm('Are you sure you want to clear all history? This cannot be undone.')) {
        history = [];
        localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
        renderHistory();
      }
    });

    // Allow ctrl+enter or cmd+enter to save
    input.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        saveItem();
      }
    });

    // Initial render
    renderHistory();
  });
</script>



</body>
</html>
