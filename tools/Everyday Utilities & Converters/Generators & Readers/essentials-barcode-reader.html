<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Barcode Reader</title>
<link href="../../../style.css?v=3" rel="stylesheet"/>
<script src="https://unpkg.com/html5-qrcode"></script>

<link href="../../../custom-tools.css?v=3" rel="stylesheet"/>
    <script src="../../../theme.js?v=3"></script>
</head>
<body><div class="app-layout" id="app-layout"><div class="main-content"><div class="page-content"><div id="tool-essentials-barcode-reader">
<div class="tool-layout-container">
<header>
<h1>📷 Barcode Reader</h1>
<p>Scan barcodes via camera or image upload.</p>
</header>
<div class="grid">
<div class="card">
<div>
<label>Camera Scanner</label>
<div id="reader">Scanner will appear here...</div>
</div>
<div style="display: flex; gap: 1rem;">
<button class="btn-primary btn btn-primary" id="btn-start" onclick="startScanner()">▶️ Start Camera</button>
<button class="btn-danger btn btn-primary" disabled="" id="btn-stop" onclick="stopScanner()">⏹️ Stop Camera</button>
</div>
<hr style="border: 0; border-top: 1px solid var(--border); margin: 0.5rem 0;"/>
<div>
<label>Or Upload an Image</label>
<input accept="image/*" id="file-input" onchange="scanImage(event)" type="file"/>
</div>
</div>
<div class="card">
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 1rem;">
<label>Scanned Result</label>
<textarea class="form-input" id="result" placeholder="Decoded barcode value will appear here..." readonly=""></textarea>
<label>Format</label>
<input class="form-input" id="format" placeholder="Barcode format..." readonly="" style="background: var(--bg-card);" type="text"/>
<button class="btn-primary btn btn-primary" onclick="copyResult()" style="margin-top: auto;">📋 Copy to Clipboard</button>
</div>
</div>
</div>
<div class="stats-bar">
<div class="stat-item">
<span class="stat-label">Last Scan Length</span>
<span class="stat-num" id="stat-length">0</span>
</div>
<div class="stat-item">
<span class="stat-label">Total Scans</span>
<span class="stat-num" id="stat-total">0</span>
</div>
<div class="pill" id="stat-status">Waiting for input</div>
</div>
</div>
<script>
        let html5QrCode;
        let totalScans = 0;

        function initializeScanner() {
            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader");
            }
        }

        function onScanSuccess(decodedText, decodedResult) {
            document.getElementById('result').value = decodedText;
            document.getElementById('format').value = decodedResult.result.format?.formatName || 'Unknown';
            document.getElementById('stat-length').innerText = decodedText.length;
            totalScans++;
            document.getElementById('stat-total').innerText = totalScans;
            
            document.getElementById('stat-status').innerText = 'Scanned Successfully';
            document.getElementById('stat-status').className = 'pill';
            
            // Optional beep or visual feedback here
        }

        function onScanFailure(error) {
            // handle scan failure, usually better to ignore and keep scanning
        }

        async function startScanner() {
            initializeScanner();
            try {
                await html5QrCode.start(
                    { facingMode: "environment" },
                    { fps: 10, qrbox: { width: 250, height: 150 } },
                    onScanSuccess,
                    onScanFailure
                );
                document.getElementById('btn-start').disabled = true;
                document.getElementById('btn-stop').disabled = false;
                document.getElementById('stat-status').innerText = 'Camera Active';
                document.getElementById('stat-status').className = 'pill secondary';
            } catch (err) {
                console.error("Camera start failed", err);
                alert("Failed to start camera. Please ensure permissions are granted.");
            }
        }

        async function stopScanner() {
            if (html5QrCode) {
                try {
                    await html5QrCode.stop();
                    document.getElementById('btn-start').disabled = false;
                    document.getElementById('btn-stop').disabled = true;
                    document.getElementById('stat-status').innerText = 'Camera Stopped';
                    document.getElementById('stat-status').className = 'pill';
                } catch (err) {
                    console.error("Failed to stop scanner", err);
                }
            }
        }

        async function scanImage(event) {
            if (event.target.files.length == 0) return;
            const file = event.target.files[0];
            
            initializeScanner();
            try {
                const decodedText = await html5QrCode.scanFile(file, true);
                document.getElementById('result').value = decodedText;
                document.getElementById('format').value = 'File Upload';
                document.getElementById('stat-length').innerText = decodedText.length;
                totalScans++;
                document.getElementById('stat-total').innerText = totalScans;
                
                document.getElementById('stat-status').innerText = 'Scanned from File';
                document.getElementById('stat-status').className = 'pill';
            } catch (err) {
                document.getElementById('result').value = '';
                document.getElementById('format').value = '';
                document.getElementById('stat-status').innerText = 'No Barcode Found';
                document.getElementById('stat-status').className = 'pill secondary';
                alert("No barcode found in image.");
            }
            // Clear input so same file can be selected again
            event.target.value = '';
        }

        function copyResult() {
            const text = document.getElementById('result').value;
            if (text) {
                navigator.clipboard.writeText(text);
                const originalStatus = document.getElementById('stat-status').innerText;
                document.getElementById('stat-status').innerText = 'Copied!';
                setTimeout(() => {
                    document.getElementById('stat-status').innerText = originalStatus;
                }, 2000);
            }
        }
    </script>
</div></div></div></div></body>
</html>
