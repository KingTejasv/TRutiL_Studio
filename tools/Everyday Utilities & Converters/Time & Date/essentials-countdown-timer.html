<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Countdown Timer</title>
<link href="../../../style.css?v=3" rel="stylesheet"/>

<link href="../../../custom-tools.css?v=3" rel="stylesheet"/>
    <script src="../../../theme.js?v=3"></script>
</head>
<body><div class="app-layout" id="app-layout"><div class="main-content"><div class="page-content"><div id="tool-essentials-countdown-timer">
<div class="tool-layout-container">
<header>
<h1>⏱️ Countdown Timer</h1>
<p>Set a timer and never miss a beat.</p>
</header>
<div class="card">
<div class="inputs-row" id="setup-view">
<div class="input-group">
<label>Hours</label>
<input class="form-input" id="input-h" max="99" min="0" type="number" value="0"/>
</div>
<div style="font-size: 2rem; color: var(--text-muted); align-self: flex-end; margin-bottom: 0.5rem;">:</div>
<div class="input-group">
<label>Minutes</label>
<input class="form-input" id="input-m" max="59" min="0" type="number" value="5"/>
</div>
<div style="font-size: 2rem; color: var(--text-muted); align-self: flex-end; margin-bottom: 0.5rem;">:</div>
<div class="input-group">
<label>Seconds</label>
<input class="form-input" id="input-s" max="59" min="0" type="number" value="0"/>
</div>
</div>
<div class="hidden" id="timer-view">
<div class="timer-display">
<div class="timer-segment">
<span id="disp-h">00</span>
<span class="timer-label">Hours</span>
</div>
<span>:</span>
<div class="timer-segment">
<span id="disp-m">05</span>
<span class="timer-label">Minutes</span>
</div>
<span>:</span>
<div class="timer-segment">
<span id="disp-s">00</span>
<span class="timer-label">Seconds</span>
</div>
</div>
</div>
<div class="progress-bar hidden" id="progress-container">
<div class="progress-fill" id="progress-fill"></div>
</div>
<div class="controls">
<button class="btn btn-primary" id="btn-start" onclick="startTimer()">▶️ Start</button>
<button class="btn btn-secondary hidden" id="btn-pause" onclick="pauseTimer()">⏸️ Pause</button>
<button class="btn btn-danger hidden" id="btn-reset" onclick="resetTimer()">🔄 Reset</button>
</div>
</div>
</div>
<script>
        let totalSeconds = 0;
        let remainingSeconds = 0;
        let timerInterval = null;
        let isRunning = false;

        const elSetup = document.getElementById('setup-view');
        const elTimer = document.getElementById('timer-view');
        const elProgress = document.getElementById('progress-container');
        const elProgressFill = document.getElementById('progress-fill');
        
        const btnStart = document.getElementById('btn-start');
        const btnPause = document.getElementById('btn-pause');
        const btnReset = document.getElementById('btn-reset');

        const inH = document.getElementById('input-h');
        const inM = document.getElementById('input-m');
        const inS = document.getElementById('input-s');
        
        const dispH = document.getElementById('disp-h');
        const dispM = document.getElementById('disp-m');
        const dispS = document.getElementById('disp-s');

        function formatTime(sec) {
            const h = Math.floor(sec / 3600);
            const m = Math.floor((sec % 3600) / 60);
            const s = sec % 60;
            return {
                h: String(h).padStart(2, '0'),
                m: String(m).padStart(2, '0'),
                s: String(s).padStart(2, '0')
            };
        }

        function updateDisplay() {
            const time = formatTime(remainingSeconds);
            dispH.innerText = time.h;
            dispM.innerText = time.m;
            dispS.innerText = time.s;
            
            if (totalSeconds > 0) {
                const percentage = (remainingSeconds / totalSeconds) * 100;
                elProgressFill.style.width = `${percentage}%`;
                
                // Color change when < 10%
                if (percentage < 10) {
                    elProgressFill.style.background = '#EF4444';
                    dispH.parentElement.parentElement.style.color = '#EF4444';
                } else {
                    elProgressFill.style.background = 'var(--accent)';
                    dispH.parentElement.parentElement.style.color = 'var(--accent)';
                }
            }
        }

        function startTimer() {
            if (!isRunning) {
                if (remainingSeconds === 0) {
                    const h = parseInt(inH.value) || 0;
                    const m = parseInt(inM.value) || 0;
                    const s = parseInt(inS.value) || 0;
                    totalSeconds = (h * 3600) + (m * 60) + s;
                    remainingSeconds = totalSeconds;
                }
                
                if (remainingSeconds === 0) return; // Nothing to start

                elSetup.classList.add('hidden');
                elTimer.classList.remove('hidden');
                elProgress.classList.remove('hidden');
                
                btnStart.classList.add('hidden');
                btnPause.classList.remove('hidden');
                btnReset.classList.remove('hidden');

                isRunning = true;
                updateDisplay();
                
                timerInterval = setInterval(() => {
                    remainingSeconds--;
                    updateDisplay();
                    
                    if (remainingSeconds <= 0) {
                        clearInterval(timerInterval);
                        isRunning = false;
                        btnPause.classList.add('hidden');
                        btnStart.classList.add('hidden');
                        // Play sound or alert here if needed
                        document.title = "Time's up!";
                    }
                }, 1000);
            }
        }

        function pauseTimer() {
            if (isRunning) {
                clearInterval(timerInterval);
                isRunning = false;
                btnPause.classList.add('hidden');
                btnStart.classList.remove('hidden');
                btnStart.innerText = '▶️ Resume';
            }
        }

        function resetTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            remainingSeconds = 0;
            totalSeconds = 0;
            
            elSetup.classList.remove('hidden');
            elTimer.classList.add('hidden');
            elProgress.classList.add('hidden');
            
            btnStart.classList.remove('hidden');
            btnStart.innerText = '▶️ Start';
            btnPause.classList.add('hidden');
            btnReset.classList.add('hidden');
            
            elProgressFill.style.background = 'var(--accent)';
            dispH.parentElement.parentElement.style.color = 'var(--accent)';
            document.title = "Countdown Timer";
        }
    </script>
</div></div></div></div></body>
</html>
