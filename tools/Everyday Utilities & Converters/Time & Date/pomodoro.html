<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Pomodoro Timer – Totil Studio</title>
<link href="../../../style.css" rel="stylesheet"/>

<link href="../../../custom-tools.css" rel="stylesheet"/>
    <script src="../../../theme.js"></script>
</head>
<body>
<div class="app-layout" id="app-layout">
<div class="main-content">
<div class="page-content"><div id="tool-pomodoro">
<div class="pomo-page">
<!-- Title -->
<div class="pomo-title">
<h1>🍅 Pomodoro Timer</h1>
<p>Stay focused, take breaks, get things done.</p>
</div>
<!-- Mode tabs -->
<div aria-label="Timer mode" class="mode-tabs" role="tablist">
<button class="mode-tab work active btn btn-primary" id="tab-work" onclick="setMode('work')" role="tab">Work</button>
<button class="mode-tab short btn btn-primary" id="tab-short" onclick="setMode('short')" role="tab">Short Break</button>
<button class="mode-tab long btn btn-primary" id="tab-long" onclick="setMode('long')" role="tab">Long Break</button>
</div>
<!-- Timer card -->
<div class="timer-card mode-work" id="timer-card">
<!-- SVG Ring -->
<div class="ring-wrap">
<svg class="ring-svg" viewbox="0 0 260 260" xmlns="http://www.w3.org/2000/svg">
<defs>
<!-- Gradients -->
<lineargradient id="grad-work" x1="0%" x2="100%" y1="0%" y2="100%">
<stop offset="0%" stop-color="#a78bfa"></stop>
<stop offset="100%" stop-color="#7c3aed"></stop>
</lineargradient>
<lineargradient id="grad-short" x1="0%" x2="100%" y1="0%" y2="100%">
<stop offset="0%" stop-color="#6ee7b7"></stop>
<stop offset="100%" stop-color="#059669"></stop>
</lineargradient>
<lineargradient id="grad-long" x1="0%" x2="100%" y1="0%" y2="100%">
<stop offset="0%" stop-color="#93c5fd"></stop>
<stop offset="100%" stop-color="#1d4ed8"></stop>
</lineargradient>
<!-- Glow filters -->
<filter height="140%" id="glow-work" width="140%" x="-20%" y="-20%">
<fegaussianblur result="blur" stddeviation="6"></fegaussianblur>
<fecomposite in="SourceGraphic" in2="blur" operator="over"></fecomposite>
<fecolormatrix type="matrix" values="1 0 0 0 .5  0 0 0 0 .1  0 0 1 0 1  0 0 0 1.2 0"></fecolormatrix>
</filter>
<filter height="140%" id="glow-short" width="140%" x="-20%" y="-20%">
<fegaussianblur result="blur" stddeviation="6"></fegaussianblur>
<fecomposite in="SourceGraphic" in2="blur" operator="over"></fecomposite>
<fecolormatrix type="matrix" values="0 0 0 0 .1  0 1 0 0 .5  0 0 0 0 .3  0 0 0 1.2 0"></fecolormatrix>
</filter>
<filter height="140%" id="glow-long" width="140%" x="-20%" y="-20%">
<fegaussianblur result="blur" stddeviation="6"></fegaussianblur>
<fecomposite in="SourceGraphic" in2="blur" operator="over"></fecomposite>
<fecolormatrix type="matrix" values="0 0 0 0 .2  0 0 0 0 .3  0 0 1 0 .9  0 0 0 1.2 0"></fecolormatrix>
</filter>
</defs>
<!-- Track -->
<circle class="ring-track" cx="130" cy="130" r="110"></circle>
<!-- Progress ring -->
<circle class="ring-progress ring-glow" cx="130" cy="130" id="ring-progress" r="110" stroke-dasharray="691.15" stroke-dashoffset="0"></circle>
</svg>
<!-- Text overlay -->
<div class="timer-text-wrap">
<div class="timer-display" id="timer-display">25:00</div>
<div class="mode-label" id="mode-label">Focus</div>
</div>
</div>
<!-- Session dots -->
<div aria-label="Session progress" class="session-dots" id="session-dots"></div>
<!-- Controls -->
<div class="controls">
<button aria-label="Reset timer" class="btn-control btn-icon btn btn-primary" id="btn-reset" onclick="resetTimer()" title="Reset">
              ↺
            </button>
<button aria-label="Start or pause timer" class="btn-control btn-start btn btn-primary" id="btn-start" onclick="toggleTimer()">
              ▶ Start
            </button>
<button aria-label="Skip to next session" class="btn-control btn-icon btn btn-primary" id="btn-skip" onclick="skipSession()" title="Skip">
              ⏭
            </button>
</div>
<!-- Auto-advance -->
<div class="auto-row">
<label class="toggle-switch">
<input checked="" id="auto-advance" type="checkbox"/>
<span class="toggle-track"></span>
</label>
<span>Auto-start next session</span>
</div>
</div>
<!-- Stats -->
<div class="stats-row">
<div class="stat-card">
<div class="stat-label">Today's Sessions</div>
<div class="stat-value" id="stat-sessions">0</div>
<div class="stat-sub">completed pomodoros</div>
</div>
<div class="stat-card">
<div class="stat-label">Focus Time Today</div>
<div class="stat-value" id="stat-focus">0m</div>
<div class="stat-sub">total minutes focused</div>
</div>
<div class="stat-card">
<div class="stat-label">Current Streak</div>
<div class="stat-value" id="stat-streak">0</div>
<div class="stat-sub">sessions in a row</div>
</div>
</div>
<!-- Settings -->
<div class="settings-wrap">
<button aria-expanded="false" class="settings-toggle-btn btn btn-primary" id="settings-btn" onclick="toggleSettings()">
            ⚙ Settings
            <span class="arrow">▾</span>
</button>
<div aria-label="Timer settings" class="settings-panel" id="settings-panel" role="region">
<div class="settings-grid">
<div class="setting-field">
<label for="set-work">Work (minutes)</label>
<input class="form-input" id="set-work" max="90" min="1" type="number" value="25"/>
</div>
<div class="setting-field">
<label for="set-short">Short Break (minutes)</label>
<input class="form-input" id="set-short" max="30" min="1" type="number" value="5"/>
</div>
<div class="setting-field">
<label for="set-long">Long Break (minutes)</label>
<input class="form-input" id="set-long" max="60" min="1" type="number" value="15"/>
</div>
<div class="setting-field">
<label for="set-sessions">Sessions before long break</label>
<input class="form-input" id="set-sessions" max="10" min="1" type="number" value="4"/>
</div>
</div>
<button class="btn-apply btn btn-primary" onclick="applySettings()">Apply Settings</button>
</div>
</div>
</div>
</div></div>
</div>
</div>
<!-- Toast notification -->
<div class="toast" id="toast"></div>
<script>
/* =====================================================================
   State
===================================================================== */
const CIRCUMFERENCE = 2 * Math.PI * 110; // ≈ 691.15

let settings = {
  work:     25,
  short:    5,
  long:     15,
  sessions: 4,
};

let state = {
  mode:          'work',   // 'work' | 'short' | 'long'
  running:       false,
  remaining:     25 * 60, // seconds
  total:         25 * 60,
  currentSession: 1,      // 1-based, within the pomodoro cycle
  todaySessions: 0,
  todayFocusSec: 0,
  streak:        0,
};

let timerId = null;
let audioCtx = null;

/* =====================================================================
   DOM refs
===================================================================== */
const timerCard   = document.getElementById('timer-card');
const timerDisp   = document.getElementById('timer-display');
const modeLabel   = document.getElementById('mode-label');
const ringProg    = document.getElementById('ring-progress');
const btnStart    = document.getElementById('btn-start');
const dotsWrap    = document.getElementById('session-dots');
const statSess    = document.getElementById('stat-sessions');
const statFocus   = document.getElementById('stat-focus');
const statStreak  = document.getElementById('stat-streak');

/* =====================================================================
   Helpers
===================================================================== */
function fmt(sec) {
  const m = Math.floor(sec / 60).toString().padStart(2, '0');
  const s = (sec % 60).toString().padStart(2, '0');
  return `${m}:${s}`;
}

function setRing(remaining, total) {
  const frac = total > 0 ? remaining / total : 0;
  ringProg.style.strokeDashoffset = CIRCUMFERENCE * (1 - frac);
}

function updateDisplay() {
  timerDisp.textContent = fmt(state.remaining);
  setRing(state.remaining, state.total);
  document.title = `${fmt(state.remaining)} – Pomodoro`;
}

function updateStats() {
  statSess.textContent   = state.todaySessions;
  const mins             = Math.floor(state.todayFocusSec / 60);
  statFocus.textContent  = mins + 'm';
  statStreak.textContent = state.streak;
}

function buildDots() {
  dotsWrap.innerHTML = '';
  for (let i = 1; i <= settings.sessions; i++) {
    const d = document.createElement('div');
    d.className = 'session-dot';
    if (i < state.currentSession)  d.classList.add('done');
    if (i === state.currentSession && state.mode === 'work') d.classList.add('current');
    dotsWrap.appendChild(d);
  }
}

function applyModeClasses() {
  timerCard.className = `timer-card mode-${state.mode === 'work' ? 'work' : state.mode === 'short' ? 'short' : 'long'}`;
}

const modeLabels = { work: 'Focus', short: 'Short Break', long: 'Long Break' };

/* =====================================================================
   Mode switching
===================================================================== */
function setMode(mode, auto = false) {
  if (!auto && state.running) pauseTimer();
  state.mode      = mode;
  state.remaining = settings[mode] * 60;
  state.total     = state.remaining;

  document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
  document.getElementById(`tab-${mode}`).classList.add('active');

  applyModeClasses();
  modeLabel.textContent = modeLabels[mode];
  ringProg.classList.remove('running');
  btnStart.textContent = '▶ Start';

  if (!auto) state.running = false;

  updateDisplay();
  buildDots();

  if (auto && document.getElementById('auto-advance').checked) startTimer();
}

/* =====================================================================
   Timer core
===================================================================== */
function startTimer() {
  if (state.running) return;
  state.running = true;
  btnStart.textContent = '⏸ Pause';
  ringProg.classList.add('running');

  timerId = setInterval(() => {
    if (state.remaining <= 0) {
      clearInterval(timerId);
      timerId = null;
      onTimerEnd();
      return;
    }
    state.remaining--;
    if (state.mode === 'work') state.todayFocusSec++;
    updateDisplay();
    updateStats();
  }, 1000);
}

function pauseTimer() {
  if (!state.running) return;
  state.running = false;
  clearInterval(timerId);
  timerId = null;
  btnStart.textContent = '▶ Resume';
  ringProg.classList.remove('running');
}

function toggleTimer() {
  if (state.running) pauseTimer();
  else startTimer();
}

function resetTimer() {
  pauseTimer();
  state.remaining = state.total;
  btnStart.textContent = '▶ Start';
  updateDisplay();
}

function skipSession() {
  pauseTimer();
  onTimerEnd(true);
}

/* =====================================================================
   Timer end logic
===================================================================== */
function onTimerEnd(skipped = false) {
  playBeep();
  state.running = false;
  ringProg.classList.remove('running');

  if (state.mode === 'work') {
    if (!skipped) {
      state.todaySessions++;
      state.streak++;
    }
    updateStats();

    if (state.currentSession >= settings.sessions) {
      state.currentSession = 1;
      showToast('🎉 Long break time! You earned it.');
      setMode('long', true);
    } else {
      state.currentSession++;
      showToast('✅ Work session done! Take a short break.');
      setMode('short', true);
    }
  } else {
    showToast('🍅 Break over! Time to focus.');
    setMode('work', true);
  }

  buildDots();
}

/* =====================================================================
   Settings
===================================================================== */
function toggleSettings() {
  const panel = document.getElementById('settings-panel');
  const btn   = document.getElementById('settings-btn');
  const open  = panel.classList.toggle('open');
  btn.classList.toggle('open', open);
  btn.setAttribute('aria-expanded', open);
}

function applySettings() {
  const w = parseInt(document.getElementById('set-work').value)    || 25;
  const s = parseInt(document.getElementById('set-short').value)   || 5;
  const l = parseInt(document.getElementById('set-long').value)    || 15;
  const n = parseInt(document.getElementById('set-sessions').value)|| 4;

  settings = { work: w, short: s, long: l, sessions: n };

  pauseTimer();
  state.currentSession = 1;
  state.total     = settings[state.mode] * 60;
  state.remaining = state.total;

  btnStart.textContent = '▶ Start';
  updateDisplay();
  buildDots();
  showToast('⚙ Settings applied!');
  toggleSettings();
}

/* =====================================================================
   Sound — AudioContext beep
===================================================================== */
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function playBeep() {
  try {
    const ctx  = getAudioCtx();
    const t    = ctx.currentTime;

    // Three ascending tones
    [[523.25, 0], [659.25, .18], [783.99, .36]].forEach(([freq, delay]) => {
      const osc  = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.type      = 'sine';
      osc.frequency.setValueAtTime(freq, t + delay);

      gain.gain.setValueAtTime(0, t + delay);
      gain.gain.linearRampToValueAtTime(.5,  t + delay + .02);
      gain.gain.exponentialRampToValueAtTime(.001, t + delay + .35);

      osc.start(t + delay);
      osc.stop(t + delay + .4);
    });
  } catch(e) { /* audio blocked, ignore */ }
}

/* =====================================================================
   Toast
===================================================================== */
let toastTimer = null;
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 3500);
}

/* =====================================================================
   Persist stats across page reload (localStorage)
===================================================================== */
function loadStats() {
  const today = new Date().toDateString();
  const saved = JSON.parse(localStorage.getItem('pomo_stats') || '{}');
  if (saved.date === today) {
    state.todaySessions = saved.sessions || 0;
    state.todayFocusSec = saved.focus    || 0;
    state.streak        = saved.streak   || 0;
  }
}

function saveStats() {
  const today = new Date().toDateString();
  localStorage.setItem('pomo_stats', JSON.stringify({
    date:     today,
    sessions: state.todaySessions,
    focus:    state.todayFocusSec,
    streak:   state.streak,
  }));
}

// Save stats periodically
setInterval(saveStats, 10000);
window.addEventListener('beforeunload', saveStats);

/* =====================================================================
   Init
===================================================================== */
(function init() {
  ringProg.style.strokeDasharray  = CIRCUMFERENCE;
  ringProg.style.strokeDashoffset = 0;
  loadStats();
  updateDisplay();
  updateStats();
  buildDots();
})();
</script>
</body>
</html>
