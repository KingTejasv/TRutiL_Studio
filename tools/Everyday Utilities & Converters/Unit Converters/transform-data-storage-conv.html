<body><div class="app-layout" id="app-layout"><div class="main-content"><div class="page-content"><div id="tool-transform-data-storage-conv">
<div class="app-header">
<h1><span>💾</span> Data Storage Converter</h1>
<p>Convert between bits, bytes, kilobytes, megabytes, and more.</p>
</div>
<div class="tool-layout-container">
<div class="converter-grid">
<div class="input-group">
<label for="inputVal">From</label>
<input class="form-input" id="inputVal" placeholder="Enter amount" step="any" type="number" value="1"/>
<select class="form-input" id="inputUnit"></select>
</div>
<button class="swap-btn btn btn-primary" id="swapBtn" title="Swap Units">
<svg viewbox="0 0 24 24">
<path d="M8 7L20 7M20 7L16 3M20 7L16 11M16 17L4 17M4 17L8 21M4 17L8 13"></path>
</svg>
</button>
<div class="input-group">
<label for="outputVal">To</label>
<input class="form-input" id="outputVal" placeholder="Result" readonly="" step="any" type="number"/>
<select class="form-input" id="outputUnit"></select>
</div>
</div>
<div class="stats-bar">
<span id="conversionText"></span>
<span class="formula-pill" id="formulaPill"></span>
</div>
</div>
<script>
    const units = {
        'b': { name: 'Bit (b)', value: 1/8 },
        'B': { name: 'Byte (B)', value: 1 },
        'KB': { name: 'Kilobyte (KB)', value: 1024 },
        'MB': { name: 'Megabyte (MB)', value: 1024**2 },
        'GB': { name: 'Gigabyte (GB)', value: 1024**3 },
        'TB': { name: 'Terabyte (TB)', value: 1024**4 },
        'PB': { name: 'Petabyte (PB)', value: 1024**5 }
    };

    const inputVal = document.getElementById('inputVal');
    const outputVal = document.getElementById('outputVal');
    const inputUnit = document.getElementById('inputUnit');
    const outputUnit = document.getElementById('outputUnit');
    const swapBtn = document.getElementById('swapBtn');
    const conversionText = document.getElementById('conversionText');
    const formulaPill = document.getElementById('formulaPill');

    for (const [key, data] of Object.entries(units)) {
        inputUnit.add(new Option(data.name, key));
        outputUnit.add(new Option(data.name, key));
    }
    
    inputUnit.value = 'GB';
    outputUnit.value = 'MB';

    function formatNumber(num) {
        if (num === 0) return "0";
        if (Math.abs(num) < 1e-10 || Math.abs(num) >= 1e15) {
            return num.toExponential(6).replace(/\.?0+e/, 'e');
        }
        return Number(num.toPrecision(10)).toString();
    }

    function updateConversion() {
        const val = parseFloat(inputVal.value);
        if (isNaN(val)) {
            outputVal.value = '';
            conversionText.textContent = 'Invalid input';
            formulaPill.textContent = '-';
            return;
        }

        const from = units[inputUnit.value];
        const to = units[outputUnit.value];
        
        const baseVal = val * from.value;
        const result = baseVal / to.value;
        
        outputVal.value = formatNumber(result);

        const ratio = from.value / to.value;
        const fromName = from.name.split(' ')[0];
        const toName = to.name.split(' ')[0];
        
        conversionText.textContent = \`1 \${fromName} ≈ \${formatNumber(ratio)} \${toName}(s)\`;
        
        if (ratio > 1) {
            formulaPill.textContent = \`Multiply by \${formatNumber(ratio)}\`;
        } else if (ratio < 1) {
            formulaPill.textContent = \`Divide by \${formatNumber(1/ratio)}\`;
        } else {
            formulaPill.textContent = \`Equal value\`;
        }
    }

    inputVal.addEventListener('input', updateConversion);
    inputUnit.addEventListener('change', updateConversion);
    outputUnit.addEventListener('change', updateConversion);
    
    swapBtn.addEventListener('click', () => {
        const temp = inputUnit.value;
        inputUnit.value = outputUnit.value;
        outputUnit.value = temp;
        updateConversion();
    });

    updateConversion();
</script>
</div></div></div></div>
