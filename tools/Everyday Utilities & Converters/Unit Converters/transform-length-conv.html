<meta charset="utf-8"/>

<link href="../../../style.css?v=3" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Cascadia+Code&amp;display=swap" rel="stylesheet"/>

    <script src="../../../theme.js?v=3"></script>
</head>
<body><div class="app-layout" id="app-layout"><div class="main-content"><div class="page-content"><div id="tool-transform-length-conv">
<div class="app-header">
<h1>📏 Length Converter</h1>
<p>Instantly convert between metric and imperial length units</p>
</div>
<div class="tool-layout-container">
<div class="converter-pane">
<div class="input-group">
<label>From</label>
<input class="form-input" id="from-val" oninput="update(true)" placeholder="0" type="number"/>
</div>
<div class="input-group">
<label>Unit</label>
<select class="form-input" id="from-unit" onchange="update(true)">
<option value="m">Meter (m)</option>
<option value="km">Kilometer (km)</option>
<option value="cm">Centimeter (cm)</option>
<option value="mm">Millimeter (mm)</option>
<option value="um">Micrometer (μm)</option>
<option value="nm">Nanometer (nm)</option>
<option value="mi">Mile (mi)</option>
<option value="yd">Yard (yd)</option>
<option value="ft">Foot (ft)</option>
<option value="in">Inch (in)</option>
<option value="nmi">Nautical Mile (nmi)</option>
</select>
</div>
</div>
<div class="equals">=</div>
<div class="converter-pane">
<div class="input-group">
<label>To</label>
<input class="form-input" id="to-val" oninput="update(false)" placeholder="0" type="number"/>
</div>
<div class="input-group">
<label>Unit</label>
<select class="form-input" id="to-unit" onchange="update(true)">
<option value="m">Meter (m)</option>
<option value="km">Kilometer (km)</option>
<option value="cm">Centimeter (cm)</option>
<option value="mm">Millimeter (mm)</option>
<option value="um">Micrometer (μm)</option>
<option value="nm">Nanometer (nm)</option>
<option value="mi">Mile (mi)</option>
<option value="yd">Yard (yd)</option>
<option selected="" value="ft">Foot (ft)</option>
<option value="in">Inch (in)</option>
<option value="nmi">Nautical Mile (nmi)</option>
</select>
</div>
</div>
</div>
<div class="stats-bar">
<div class="stats-group">
<div class="stat">
<span class="stat-label">Conversion Rate</span>
<span class="stat-value" id="rate-value">1 m = 3.2808399 ft</span>
</div>
</div>
<div class="pill idle" id="status-pill">Ready</div>
</div>
<script>
        const rates = {
            m: 1,
            km: 1000,
            cm: 0.01,
            mm: 0.001,
            um: 1e-6,
            nm: 1e-9,
            mi: 1609.344,
            yd: 0.9144,
            ft: 0.3048,
            in: 0.0254,
            nmi: 1852
        };

        function update(isFrom) {
            const fromVal = document.getElementById('from-val');
            const toVal = document.getElementById('to-val');
            const fromUnit = document.getElementById('from-unit');
            const toUnit = document.getElementById('to-unit');
            
            const fu = fromUnit.value;
            const tu = toUnit.value;

            // Update rate display
            const rateStr = `1 ${fromUnit.options[fromUnit.selectedIndex].text.match(/\(([^)]+)\)/)[1]} = ` + 
                            `${Number((rates[fu] / rates[tu]).toPrecision(8)).toString()} ` +
                            `${toUnit.options[toUnit.selectedIndex].text.match(/\(([^)]+)\)/)[1]}`;
            document.getElementById('rate-value').textContent = rateStr;

            if (isFrom) {
                if (fromVal.value === '') { toVal.value = ''; updatePill(false); return; }
                const valInBase = parseFloat(fromVal.value) * rates[fu];
                toVal.value = Number((valInBase / rates[tu]).toPrecision(10)).toString();
            } else {
                if (toVal.value === '') { fromVal.value = ''; updatePill(false); return; }
                const valInBase = parseFloat(toVal.value) * rates[tu];
                fromVal.value = Number((valInBase / rates[fu]).toPrecision(10)).toString();
            }
            updatePill(true);
        }

        function updatePill(isActive) {
            const pill = document.getElementById('status-pill');
            if(isActive) {
                pill.className = 'pill';
                pill.textContent = 'Converted';
            } else {
                pill.className = 'pill idle';
                pill.textContent = 'Ready';
            }
        }
        
        // Initial setup
        update(true);
    </script>
</div></div></div></div>
