<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Temperature Converter</title>
<link href="../../../style.css?v=3" rel="stylesheet"/>

<link href="../../../custom-tools.css?v=3" rel="stylesheet"/>
    <script src="../../../theme.js?v=3"></script>
</head>
<body><div class="app-layout" id="app-layout"><div class="main-content"><div class="page-content"><div id="tool-transform-temperature-conv">
<div class="tool-layout-container">
<div class="app-header">
<h1>🌡️ Temperature Converter</h1>
<p>Convert seamlessly between multiple temperature units.</p>
</div>
<div class="grid">
<div class="panel">
<div class="input-group">
<label for="input-val">Value</label>
<input class="form-input" id="input-val" step="any" type="number" value="0"/>
</div>
<div class="input-group">
<label for="input-unit">From Unit</label>
<select class="form-input" id="input-unit"></select>
</div>
</div>
<button aria-label="Swap units" class="swap-btn btn btn-primary" id="swap-btn">
<svg viewbox="0 0 24 24">
<path d="M7 16V4M7 4L3 8M7 4L11 8M17 8V20M17 20L21 16M17 20L13 16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
<div class="panel">
<div class="input-group">
<label for="output-val">Converted Value</label>
<input class="form-input" id="output-val" step="any" type="number" value=""/>
</div>
<div class="input-group">
<label for="output-unit">To Unit</label>
<select class="form-input" id="output-unit"></select>
</div>
</div>
</div>
<div class="stats-bar">
<span class="pill" id="formula-pill">Formula: °F = °C × (9/5) + 32</span>
</div>
</div>
<script>
        const inputVal = document.getElementById('input-val');
        const outputVal = document.getElementById('output-val');
        const inputUnit = document.getElementById('input-unit');
        const outputUnit = document.getElementById('output-unit');
        const swapBtn = document.getElementById('swap-btn');
        const formulaPill = document.getElementById('formula-pill');

        const units = {
            c: { name: 'Celsius (°C)', symbol: '°C', toK: c => c + 273.15, fromK: k => k - 273.15 },
            f: { name: 'Fahrenheit (°F)', symbol: '°F', toK: f => (f - 32) * 5/9 + 273.15, fromK: k => (k - 273.15) * 9/5 + 32 },
            k: { name: 'Kelvin (K)', symbol: 'K', toK: k => k, fromK: k => k }
        };

        function populateUnits() {
            for (const [key, val] of Object.entries(units)) {
                inputUnit.add(new Option(val.name, key));
                outputUnit.add(new Option(val.name, key));
            }
            inputUnit.selectedIndex = 0; // C
            outputUnit.selectedIndex = 1; // F
        }

        function convert(fromInput) {
            const from = inputUnit.value;
            const to = outputUnit.value;
            
            if (fromInput) {
                let val = parseFloat(inputVal.value);
                if (isNaN(val)) {
                    outputVal.value = '';
                    return;
                }
                let k = units[from].toK(val);
                let finalVal = units[to].fromK(k);
                outputVal.value = parseFloat(finalVal.toPrecision(10));
            } else {
                let val = parseFloat(outputVal.value);
                if (isNaN(val)) {
                    inputVal.value = '';
                    return;
                }
                let k = units[to].toK(val);
                let finalVal = units[from].fromK(k);
                inputVal.value = parseFloat(finalVal.toPrecision(10));
            }
            updateFormula();
        }

        function updateFormula() {
            const from = inputUnit.value;
            const to = outputUnit.value;
            if (from === to) {
                formulaPill.textContent = `Formula: 1 ${units[from].symbol} = 1 ${units[to].symbol}`;
                return;
            }
            
            let formula = '';
            if (from === 'c' && to === 'f') formula = '°F = °C × (9/5) + 32';
            else if (from === 'f' && to === 'c') formula = '°C = (°F - 32) × 5/9';
            else if (from === 'c' && to === 'k') formula = 'K = °C + 273.15';
            else if (from === 'k' && to === 'c') formula = '°C = K - 273.15';
            else if (from === 'f' && to === 'k') formula = 'K = (°F - 32) × 5/9 + 273.15';
            else if (from === 'k' && to === 'f') formula = '°F = (K - 273.15) × 9/5 + 32';
            
            formulaPill.textContent = `Formula: ${formula}`;
        }

        inputVal.addEventListener('input', () => convert(true));
        outputVal.addEventListener('input', () => convert(false));
        inputUnit.addEventListener('change', () => convert(true));
        outputUnit.addEventListener('change', () => convert(true));

        swapBtn.addEventListener('click', () => {
            const tempUnit = inputUnit.value;
            inputUnit.value = outputUnit.value;
            outputUnit.value = tempUnit;
            convert(true);
        });

        populateUnits();
        convert(true);
    </script>
</div></div></div></div>


</body>
</html>
