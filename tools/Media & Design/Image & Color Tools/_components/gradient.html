<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>CSS Gradient Generator — TRutiL Studio</title>
<link href="../../../../style.css?v=3" rel="stylesheet"/>
<link href="../../../../custom-tools.css?v=3" rel="stylesheet"/>
<script src="../../../../theme.js?v=3"></script>
</head>
<body>
<div class="app-layout" id="app-layout">
<div class="main-content">
<div class="page-content"><div id="tool-gradient">
<div class="app-header">
<div class="app-icon" style="background:linear-gradient(135deg, #ec4899, #e11d48);color:white;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:24px;">⚙️</div>
<div>
<h1>CSS Gradient Generator</h1>
<p>Create and customize beautiful linear and radial CSS gradients.</p>
</div>
</div>
<div class="split-layout">
<!-- Controls -->
<div class="panel">
<div class="form-group">
<label class="form-label" for="gradient-type">Gradient Type</label>
<select class="form-select form-input" id="gradient-type">
<option value="linear">Linear</option>
<option value="radial">Radial</option>
</select>
</div>
<div class="form-group" id="angle-group">
<label class="form-label" for="gradient-angle">Angle <span class="angle-value" id="angle-value">90°</span></label>
<input class="range-input" id="gradient-angle" max="360" min="0" type="range" value="90"/>
</div>
<div class="form-group" style="margin-top: 2rem;">
<label class="form-label">Color Stops <span style="font-size: 11px; color: var(--text-muted); font-weight: normal; margin-left: 8px;">Click track to add, drag down to delete</span></label>
<div class="track-container" id="gradientTrack">
<div class="track-bg" id="gradientTrackBg"></div>
<!-- Handles injected here -->
</div>
</div>
<div class="color-editor" id="colorEditor">
<div class="color-picker-wrapper">
<input id="activeColorPicker" type="color"/>
</div>
<input class="form-input" id="activeColorHex" placeholder="#FFFFFF" style="flex: 1;" type="text"/>
<div id="activeColorPos" style="font-size: 12px; color: var(--text-muted); width: 100%; max-width: 40px; text-align: right">0%</div>
</div>
</div>
<!-- Preview & Output -->
<div class="panel" style="display: flex; flex-direction: column;">
<div class="preview-box" id="preview-box"></div>
<div class="tabs">
<div class="tab active" data-tab="css">CSS</div>
<div class="tab" data-tab="tailwind">Tailwind</div>
</div>
<div class="code-output" id="code-output"></div>
<button class="btn btn-primary" id="copy-btn" style="width: 100%; margin-top: auto;">Copy Code</button>
</div>
</div>
</div></div>
</div>
</div>
<script>
  // DOM Elements
  const typeEl = document.getElementById('gradient-type');
  const angleEl = document.getElementById('gradient-angle');
  const angleValueEl = document.getElementById('angle-value');
  const angleGroupEl = document.getElementById('angle-group');
  
  const track = document.getElementById('gradientTrack');
  const trackBg = document.getElementById('gradientTrackBg');
  const activeColorPicker = document.getElementById('activeColorPicker');
  const activeColorHex = document.getElementById('activeColorHex');
  const activeColorPos = document.getElementById('activeColorPos');
  
  const previewEl = document.getElementById('preview-box');
  const codeOutputEl = document.getElementById('code-output');
  const copyBtn = document.getElementById('copy-btn');
  const tabs = document.querySelectorAll('.tab');
  
  // State
  let stops = [
    { id: 1, color: '#8b5cf6', pos: 0 },
    { id: 2, color: '#00FF25', pos: 100 }
  ];
  let activeStopId = 1;
  let nextId = 3;
  let activeTab = 'css';
  
  // Initialize
  renderStops();
  updateOutput();
  
  // Event Listeners for standard inputs
  typeEl.addEventListener('input', () => {
    angleGroupEl.style.display = typeEl.value === 'linear' ? 'block' : 'none';
    updateOutput();
  });
  
  angleEl.addEventListener('input', () => {
    angleValueEl.textContent = `${angleEl.value}°`;
    updateOutput();
  });
  
  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      tabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      activeTab = tab.dataset.tab;
      updateOutput();
    });
  });
  
  // Real-time Hex Validation and update
  activeColorHex.addEventListener('input', (e) => {
    let val = e.target.value;
    // Auto-prepend #
    if (val.length > 0 && !val.startsWith('#')) {
      val = '#' + val;
      e.target.value = val;
    }
    
    // Live update if valid
    const isValid = /^#([0-9A-Fa-f]{3}|[0-9A-Fa-f]{6})$/i.test(val);
    if (isValid) {
      const activeStop = stops.find(s => s.id === activeStopId);
      if (activeStop) {
        // Normalize to 6 chars for input[type="color"]
        let fullHex = val;
        if (val.length === 4) {
          fullHex = '#' + val[1]+val[1] + val[2]+val[2] + val[3]+val[3];
        }
        activeStop.color = fullHex.toLowerCase();
        activeColorPicker.value = activeStop.color;
        renderStops();
        updateOutput();
      }
    }
  });
  
  activeColorHex.addEventListener('blur', (e) => {
    let val = e.target.value;
    if (val.length > 0 && !val.startsWith('#')) val = '#' + val;
    e.target.value = val.toUpperCase();
  });
  
  activeColorPicker.addEventListener('input', (e) => {
    const activeStop = stops.find(s => s.id === activeStopId);
    if (activeStop) {
      activeStop.color = e.target.value.toLowerCase();
      activeColorHex.value = activeStop.color.toUpperCase();
      renderStops();
      updateOutput();
    }
  });
  
  // Multi-stop Logic
  track.addEventListener('mousedown', (e) => {
    // Only add stop if clicking on the track itself, not a handle
    if (e.target !== track && e.target !== trackBg) return;
    
    const rect = track.getBoundingClientRect();
    let pos = ((e.clientX - rect.left) / rect.width) * 100;
    pos = Math.max(0, Math.min(100, Math.round(pos)));
    
    // Interpolate color or just use gray
    const newId = nextId++;
    stops.push({ id: newId, color: '#9CA3AF', pos });
    activeStopId = newId;
    
    renderStops();
    updateOutput();
  });
  
  function renderStops() {
    // Clear handles
    Array.from(track.children).forEach(child => {
      if (child.id !== 'gradientTrackBg') track.removeChild(child);
    });
    
    // Sort visually for the track background
    const sortedStops = [...stops].sort((a,b) => a.pos - b.pos);
    const gradientStr = sortedStops.map(s => `${s.color} ${s.pos}%`).join(', ');
    trackBg.style.background = `linear-gradient(90deg, ${gradientStr})`;
    
    // Create handles
    stops.forEach(s => {
      const handle = document.createElement('div');
      handle.className = `track-handle ${s.id === activeStopId ? 'active' : ''}`;
      handle.style.left = `${s.pos}%`;
      handle.style.backgroundColor = s.color;
      
      handle.onmousedown = (e) => {
        e.stopPropagation();
        activeStopId = s.id;
        renderStops();
        
        let isDragging = true;
        let isDeleted = false;
        
        const onMove = (me) => {
          if (!isDragging) return;
          const rect = track.getBoundingClientRect();
          let newPos = ((me.clientX - rect.left) / rect.width) * 100;
          newPos = Math.max(0, Math.min(100, Math.round(newPos)));
          
          // Delete if dragged down > 40px
          const distY = me.clientY - (rect.top + rect.height/2);
          if (distY > 40 && stops.length > 2) {
            handle.style.opacity = '0.3';
            handle.style.transform = `translate(-50%, ${distY - 20}px)`;
            isDeleted = true;
          } else {
            handle.style.opacity = '1';
            handle.style.transform = s.id === activeStopId ? 'translate(-50%, -50%) scale(1.2)' : 'translate(-50%, -50%)';
            s.pos = newPos;
            handle.style.left = `${s.pos}%`;
            isDeleted = false;
            
            // update UI live
            const activeStop = stops.find(x => x.id === activeStopId);
            if (activeStop) activeColorPos.textContent = `${activeStop.pos}%`;
          }
          
          // update background live (ignore deleted)
          const liveStops = isDeleted ? stops.filter(x => x.id !== s.id) : stops;
          const sorted = [...liveStops].sort((a,b) => a.pos - b.pos);
          trackBg.style.background = `linear-gradient(90deg, ${sorted.map(st => `${st.color} ${st.pos}%`).join(', ')})`;
          
          if (!isDeleted) updateOutput();
        };
        
        const onUp = (me) => {
          isDragging = false;
          window.removeEventListener('mousemove', onMove);
          window.removeEventListener('mouseup', onUp);
          
          if (isDeleted) {
            stops = stops.filter(x => x.id !== s.id);
            if (activeStopId === s.id) activeStopId = stops[0].id;
          }
          
          renderStops();
          updateOutput();
        };
        
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onUp);
      };
      
      track.appendChild(handle);
    });
    
    // Update Editor panel
    const activeStop = stops.find(s => s.id === activeStopId);
    if (activeStop) {
      activeColorPicker.value = activeStop.color;
      if (document.activeElement !== activeColorHex) {
        activeColorHex.value = activeStop.color.toUpperCase();
      }
      activeColorPos.textContent = `${activeStop.pos}%`;
    }
  }
  
  function updateOutput() {
    const type = typeEl.value;
    const angle = angleEl.value;
    
    const sortedStops = [...stops].sort((a,b) => a.pos - b.pos);
    const colorsStr = sortedStops.map(s => `${s.color} ${s.pos}%`).join(', ');
    
    let cssValue = '';
    if (type === 'linear') {
      cssValue = `linear-gradient(${angle}deg, ${colorsStr})`;
    } else {
      cssValue = `radial-gradient(circle, ${colorsStr})`;
    }
    
    // Update Preview
    previewEl.style.background = cssValue;
    
    // Generate Code
    if (activeTab === 'css') {
      codeOutputEl.textContent = `background: ${cssValue};`;
    } else if (activeTab === 'tailwind') {
      // For Tailwind, an arbitrary value is perfectly robust and matches the CSS exactly
      // Especially useful for multiple stops where standard utilities get messy.
      let twClass = `bg-[${cssValue.replace(/ /g, '_')}]`;
      
      // If simple 2 or 3 stops and standard angle, we can try to use idiomatic classes
      // but arbitrary value is 100% correct in TW JIT (Tailwind v3+)
      codeOutputEl.textContent = twClass;
    }
  }
  
  copyBtn.addEventListener('click', () => {
    navigator.clipboard.writeText(codeOutputEl.textContent).then(() => {
      const originalText = copyBtn.textContent;
      copyBtn.textContent = 'Copied!';
      setTimeout(() => copyBtn.textContent = originalText, 2000);
    }).catch(() => {
      alert('Failed to copy. Please manually copy the text.');
    });
  });
</script>



</body>
</html>
