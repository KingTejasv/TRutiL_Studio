<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Background Remover — TRutiL Studio</title>
<link href="../../../../style.css?v=3" rel="stylesheet"/>
<link href="../../../../custom-tools.css?v=3" rel="stylesheet"/>
<script src="../../../../theme.js?v=3"></script>
</head>
<body>
<div class="app-layout" id="app-layout">
<div class="main-content">
<div class="page-content"><div id="tool-mediaworks-background-remover">
<div class="app-header">
<div class="app-icon" style="background:linear-gradient(135deg, #3b82f6, #1d4ed8);color:white;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:24px;">⚙️</div>
<div>
<h1>Background Remover</h1>
<p>Erase backgrounds manually with Magic Wand/Eraser, or automatically via Remove.bg API.</p>
</div>
</div>
<div class="tool-page-grid">
<!-- Sidebar Controls -->
<div class="tool-sidebar">
<div class="drop-zone" id="uploadArea">
<div style="font-size: 2rem; margin-bottom: 0.5rem;">🖼️</div>
<p style="color: var(--text-muted); margin-bottom: 1rem; font-size: 0.95rem;">Drag &amp; drop an image, or click to select</p>
<button class="btn btn-primary" onclick="document.getElementById('fileInput').click()">Select Image</button>
<input accept="image/*" id="fileInput" style="display:none;" type="file"/>
</div>
<div class="panel hidden" id="toolsPanel">
<div class="panel-title">🪄 Tools</div>
<div class="tool-grid">
<button class="tool-btn active btn btn-primary" id="toolWand">
<i>✨</i>
<span>Magic Wand</span>
</button>
<button class="tool-btn btn btn-primary" id="toolEraser">
<i>🧹</i>
<span>Eraser</span>
</button>
</div>
<div id="wandSettings">
<div class="settings-row">
<label for="toleranceSlider">Tolerance: <span id="tolVal">30</span></label>
<input id="toleranceSlider" max="100" min="0" type="range" value="30"/>
</div>
</div>
<div class="hidden" id="eraserSettings">
<div class="settings-row">
<label for="sizeSlider">Eraser Size: <span id="sizeVal">20</span>px</label>
<input id="sizeSlider" max="100" min="5" type="range" value="20"/>
</div>
</div>
<div class="settings-row" style="margin-top: 1rem;">
<button class="btn btn-outline btn-sm btn-primary" disabled="" id="undoBtn">↩ Undo</button>
<button class="btn btn-outline btn-sm btn-primary" disabled="" id="resetBtn">🔄 Reset Image</button>
</div>
<div class="api-key-box">
<div class="panel-title">🤖 AI Auto-Remove</div>
<p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.75rem;">
                Use the <a href="https://www.remove.bg/api" style="color: var(--accent);" target="_blank">Remove.bg API</a> for perfect automatic removal. 
              </p>
<input class="form-input" id="apiKeyInput" placeholder="Paste Remove.bg API Key here" style="margin-bottom: 0.5rem;" type="password"/>
<button class="btn btn-primary" id="autoRemoveBtn" style="width: 100%;">Auto Remove</button>
</div>
</div>
</div>
<!-- Main Workspace -->
<div class="tool-workspace">
<div class="canvas-container hidden" id="canvasContainer">
<canvas id="mainCanvas"></canvas>
</div>
<div class="action-bar hidden" id="actionBar">
<div style="font-size: 0.85rem; color: var(--text-muted);">
              Use tools on the left to erase the background.
            </div>
<button class="btn btn-primary" id="downloadBtn">Download PNG</button>
</div>
</div>
</div>
</div></div>
</div>
</div>
<div class="toast" id="toast"></div>
<script>
  // DOM Elements
  const uploadArea = document.getElementById('uploadArea');
  const fileInput = document.getElementById('fileInput');
  const toolsPanel = document.getElementById('toolsPanel');
  const canvasContainer = document.getElementById('canvasContainer');
  const actionBar = document.getElementById('actionBar');
  const canvas = document.getElementById('mainCanvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  
  const toolWand = document.getElementById('toolWand');
  const toolEraser = document.getElementById('toolEraser');
  const wandSettings = document.getElementById('wandSettings');
  const eraserSettings = document.getElementById('eraserSettings');
  const toleranceSlider = document.getElementById('toleranceSlider');
  const sizeSlider = document.getElementById('sizeSlider');
  const tolVal = document.getElementById('tolVal');
  const sizeVal = document.getElementById('sizeVal');
  
  const undoBtn = document.getElementById('undoBtn');
  const resetBtn = document.getElementById('resetBtn');
  const downloadBtn = document.getElementById('downloadBtn');
  
  const apiKeyInput = document.getElementById('apiKeyInput');
  const autoRemoveBtn = document.getElementById('autoRemoveBtn');
  const toast = document.getElementById('toast');

  // State
  let activeTool = 'wand'; // 'wand' or 'eraser'
  let isDrawing = false;
  let originalImage = null;
  let imgWidth = 0;
  let imgHeight = 0;
  let history = []; // array of ImageData
  const maxHistory = 10;
  
  let currentFile = null;

  // Utilities
  function showToast(msg, duration = 3000) {
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), duration);
  }

  function saveHistory() {
    if (history.length >= maxHistory) history.shift();
    history.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
    undoBtn.disabled = history.length <= 1;
    resetBtn.disabled = false;
  }

  function performUndo() {
    if (history.length > 1) {
      history.pop(); // remove current state
      const prev = history[history.length - 1];
      ctx.putImageData(prev, 0, 0);
      undoBtn.disabled = history.length <= 1;
    }
  }

  // File Handling
  fileInput.addEventListener('change', (e) => {
    if (e.target.files.length) loadImage(e.target.files[0]);
  });
  uploadArea.addEventListener('dragover', e => { e.preventDefault(); uploadArea.classList.add('dragover'); });
  uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'));
  uploadArea.addEventListener('drop', e => {
    e.preventDefault();
    uploadArea.classList.remove('dragover');
    if (e.dataTransfer.files.length) loadImage(e.dataTransfer.files[0]);
  });

  function loadImage(file) {
    if (!file.type.startsWith('image/')) return showToast("Please select an image file.");
    currentFile = file;
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      originalImage = img;
      imgWidth = img.width;
      imgHeight = img.height;
      
      // Scale down if too large to prevent freezing
      const MAX_DIM = 2000;
      if (imgWidth > MAX_DIM || imgHeight > MAX_DIM) {
        const ratio = Math.min(MAX_DIM / imgWidth, MAX_DIM / imgHeight);
        imgWidth = Math.floor(imgWidth * ratio);
        imgHeight = Math.floor(imgHeight * ratio);
      }
      
      canvas.width = imgWidth;
      canvas.height = imgHeight;
      ctx.drawImage(img, 0, 0, imgWidth, imgHeight);
      
      history = [];
      saveHistory();
      
      toolsPanel.classList.remove('hidden');
      canvasContainer.classList.remove('hidden');
      actionBar.classList.remove('hidden');
      uploadArea.style.display = 'none';
      
      URL.revokeObjectURL(url);
    };
    img.src = url;
  }

  // Tool Switching
  toolWand.addEventListener('click', () => {
    activeTool = 'wand';
    toolWand.classList.add('active');
    toolEraser.classList.remove('active');
    wandSettings.classList.remove('hidden');
    eraserSettings.classList.add('hidden');
    canvasContainer.style.cursor = 'crosshair';
  });
  toolEraser.addEventListener('click', () => {
    activeTool = 'eraser';
    toolEraser.classList.add('active');
    toolWand.classList.remove('active');
    eraserSettings.classList.remove('hidden');
    wandSettings.classList.add('hidden');
    canvasContainer.style.cursor = `url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='%23ffffff' stroke-width='2'><circle cx='12' cy='12' r='10'/></svg>") 12 12, auto`;
  });

  // Settings
  toleranceSlider.addEventListener('input', e => tolVal.textContent = e.target.value);
  sizeSlider.addEventListener('input', e => sizeVal.textContent = e.target.value);

  // Undo/Reset
  undoBtn.addEventListener('click', performUndo);
  resetBtn.addEventListener('click', () => {
    if (!originalImage) return;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(originalImage, 0, 0, imgWidth, imgHeight);
    history = [];
    saveHistory();
    showToast("Image reset to original.");
  });

  // Canvas Interactions
  function getEventPos(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    return {
      x: Math.floor((e.clientX - rect.left) * scaleX),
      y: Math.floor((e.clientY - rect.top) * scaleY)
    };
  }

  canvas.addEventListener('mousedown', e => {
    const pos = getEventPos(e);
    if (activeTool === 'wand') {
      magicWand(pos.x, pos.y);
      saveHistory();
    } else if (activeTool === 'eraser') {
      isDrawing = true;
      eraseAt(pos.x, pos.y);
    }
  });

  canvas.addEventListener('mousemove', e => {
    if (!isDrawing || activeTool !== 'eraser') return;
    const pos = getEventPos(e);
    eraseAt(pos.x, pos.y);
  });

  canvas.addEventListener('mouseup', () => {
    if (isDrawing) {
      isDrawing = false;
      saveHistory();
    }
  });
  canvas.addEventListener('mouseleave', () => {
    if (isDrawing) {
      isDrawing = false;
      saveHistory();
    }
  });

  // Eraser Logic
  function eraseAt(x, y) {
    const size = parseInt(sizeSlider.value, 10);
    ctx.globalCompositeOperation = 'destination-out';
    ctx.beginPath();
    ctx.arc(x, y, size, 0, Math.PI * 2, false);
    ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
  }

  // Magic Wand (Flood Fill Eraser)
  function magicWand(startX, startY) {
    if (startX < 0 || startX >= canvas.width || startY < 0 || startY >= canvas.height) return;
    
    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const data = imgData.data;
    const width = canvas.width;
    const height = canvas.height;
    const tol = parseInt(toleranceSlider.value, 10) * 2.55; // scale 0-100 to 0-255

    const startIndex = (startY * width + startX) * 4;
    const startR = data[startIndex];
    const startG = data[startIndex + 1];
    const startB = data[startIndex + 2];
    const startA = data[startIndex + 3];

    // If already transparent, do nothing
    if (startA === 0) return;

    function colorMatch(i) {
      const r = data[i], g = data[i+1], b = data[i+2], a = data[i+3];
      if (a === 0) return false;
      const dr = Math.abs(r - startR);
      const dg = Math.abs(g - startG);
      const db = Math.abs(b - startB);
      // const da = Math.abs(a - startA);
      // simple euclidian distance could be used, but max diff is faster and decent for simple wand
      return Math.max(dr, dg, db) <= tol;
    }

    // Stack-based flood fill
    const stack = [[startX, startY]];
    const visited = new Uint8Array(width * height);
    
    while (stack.length > 0) {
      const [cx, cy] = stack.pop();
      const idx = cy * width + cx;
      if (visited[idx]) continue;
      
      let x = cx;
      let y = cy;
      let currentIdx = (y * width + x) * 4;
      
      // Move up as far as colors match
      while (y >= 0 && colorMatch(currentIdx)) {
        y--;
        currentIdx -= width * 4;
      }
      y++;
      currentIdx += width * 4;
      
      let reachLeft = false;
      let reachRight = false;
      
      while (y < height && colorMatch(currentIdx)) {
        visited[y * width + x] = 1;
        // Erase (set alpha to 0)
        data[currentIdx + 3] = 0;
        
        if (x > 0) {
          const leftIdx = currentIdx - 4;
          if (colorMatch(leftIdx)) {
            if (!reachLeft && !visited[y * width + (x - 1)]) {
              stack.push([x - 1, y]);
              reachLeft = true;
            }
          } else if (reachLeft) {
            reachLeft = false;
          }
        }
        
        if (x < width - 1) {
          const rightIdx = currentIdx + 4;
          if (colorMatch(rightIdx)) {
            if (!reachRight && !visited[y * width + (x + 1)]) {
              stack.push([x + 1, y]);
              reachRight = true;
            }
          } else if (reachRight) {
            reachRight = false;
          }
        }
        
        y++;
        currentIdx += width * 4;
      }
    }
    
    ctx.putImageData(imgData, 0, 0);
  }

  // Remove.bg API Integration
  autoRemoveBtn.addEventListener('click', async () => {
    const key = apiKeyInput.value.trim();
    if (!key) {
      showToast("Please enter a valid Remove.bg API Key.");
      apiKeyInput.focus();
      return;
    }
    if (!currentFile) return;

    autoRemoveBtn.disabled = true;
    autoRemoveBtn.textContent = "Processing...";

    const formData = new FormData();
    formData.append('image_file', currentFile);
    formData.append('size', 'auto');

    try {
      const response = await fetch('https://api.remove.bg/v1.0/removebg', {
        method: 'POST',
        headers: {
          'X-Api-Key': key
        },
        body: formData
      });

      if (!response.ok) {
        const err = await response.text();
        throw new Error(err || response.statusText);
      }

      const blob = await response.blob();
      const url = URL.createObjectURL(blob);
      const img = new Image();
      img.onload = () => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        saveHistory();
        URL.revokeObjectURL(url);
        showToast("Background removed successfully!");
        autoRemoveBtn.disabled = false;
        autoRemoveBtn.textContent = "Auto Remove";
      };
      img.src = url;

    } catch (err) {
      console.error(err);
      showToast("API Error: " + (err.message.includes('403') ? "Invalid API Key." : err.message));
      autoRemoveBtn.disabled = false;
      autoRemoveBtn.textContent = "Auto Remove";
    }
  });

  // Download
  downloadBtn.addEventListener('click', () => {
    const a = document.createElement('a');
    const name = currentFile ? currentFile.name.split('.')[0] : 'image';
    a.download = name + '-bg-removed.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
  });

</script>
</body>
</html>
