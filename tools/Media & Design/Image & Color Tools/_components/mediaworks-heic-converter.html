<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>HEIC Converter - MediaWorks</title>
<link href="../../../../style.css?v=3" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
<link href="../../../../custom-tools.css?v=3" rel="stylesheet"/>
<script src="../../../../theme.js?v=3"></script>
</head>
<body><div class="app-layout" id="app-layout"><div class="main-content"><div class="page-content"><div id="tool-mediaworks-heic-converter">
<div class="app-header">
<div class="app-icon" style="background:linear-gradient(135deg, #3b82f6, #1d4ed8);color:white;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:24px;">🍏</div>
<div>
<h1>HEIC Converter</h1>
<p>Convert Apple HEIC photos to standard JPG or PNG seamlessly</p>
</div>
</div>
<div class="tool-layout-container">
<!-- Input Panel -->
<div class="panel">
<div class="panel-title">
<svg fill="none" height="20" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24" width="20"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" x2="12" y1="3" y2="15"></line></svg>
                1. Upload HEIC File
            </div>
<div class="drop-zone" id="dropZone">
<svg fill="none" height="48" stroke="var(--accent)" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" style="margin-bottom: 1rem;" viewbox="0 0 24 24" width="48"><rect height="18" rx="2" ry="2" width="18" x="3" y="3"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
<div id="dropText" style="font-weight: 600; margin-bottom: 0.5rem;">Click or drag HEIC here</div>
<div style="color: var(--text-muted); font-size: 0.875rem;">Supports .heic, .heif</div>
<input accept=".heic, .heif" id="fileInput" type="file"/>
</div>
<div class="controls">
<select class="form-input" id="formatSelect">
<option value="image/jpeg">Convert to JPG</option>
<option value="image/png">Convert to PNG</option>
</select>
<button class="btn btn-primary" disabled="" id="processBtn">
<svg fill="none" height="18" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24" width="18"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
                    Convert Format
                </button>
</div>
</div>
<!-- Output Panel -->
<div class="panel">
<div class="panel-title">
<svg fill="none" height="20" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24" width="20"><rect height="18" rx="2" ry="2" width="18" x="3" y="3"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                2. Preview &amp; Download
            </div>
<div class="preview-area" id="previewArea">
<div id="previewPlaceholder" style="color: var(--text-muted); text-align: center;">
                    Converted image will appear here
                </div>
<img id="outputImage" style="display: none;"/>
</div>
<div class="controls">
<button class="btn btn-primary" disabled="" id="downloadBtn">
<svg fill="none" height="18" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24" width="18"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" x2="12" y1="15" y2="3"></line></svg>
                    Download Image
                </button>
</div>
</div>
</div>
<script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const processBtn = document.getElementById('processBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const outputImage = document.getElementById('outputImage');
        const previewPlaceholder = document.getElementById('previewPlaceholder');
        const dropText = document.getElementById('dropText');
        
        let currentFile = null;
        let downloadBlob = null;
        
        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length) {
                fileInput.files = e.dataTransfer.files;
                handleFileSelection();
            }
        });
        fileInput.addEventListener('change', handleFileSelection);
        
        function handleFileSelection() {
            if (fileInput.files.length > 0) {
                currentFile = fileInput.files[0];
                dropText.textContent = currentFile.name;
                processBtn.disabled = false;
                
                outputImage.style.display = 'none';
                previewPlaceholder.style.display = 'block';
                previewPlaceholder.textContent = 'Ready to convert.';
                downloadBtn.disabled = true;
                downloadBlob = null;
            }
        }
        
        processBtn.addEventListener('click', async () => {
            if (!currentFile) return;
            
            processBtn.disabled = true;
            processBtn.textContent = 'Converting...';
            previewPlaceholder.textContent = 'Converting HEIC... This may take a moment.';
            
            try {
                let format = document.getElementById('formatSelect').value;
                let outputResult = await heic2any({
                    blob: currentFile,
                    toType: format,
                    quality: 0.92
                });
                
                if (Array.isArray(outputResult)) outputResult = outputResult[0];
                
                downloadBlob = outputResult;
                let url = URL.createObjectURL(downloadBlob);
                
                outputImage.src = url;
                outputImage.style.display = 'block';
                previewPlaceholder.style.display = 'none';
                downloadBtn.disabled = false;
                
            } catch(err) {
                previewPlaceholder.textContent = "Error converting HEIC: " + err.message;
            } finally {
                processBtn.disabled = false;
                processBtn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg> Convert Format';
            }
        });
        
        downloadBtn.addEventListener('click', () => {
            if(!downloadBlob) return;
            const a = document.createElement('a');
            a.href = URL.createObjectURL(downloadBlob);
            let ext = document.getElementById('formatSelect').value === 'image/jpeg' ? '.jpg' : '.png';
            a.download = "converted" + ext;
            a.click();
            URL.revokeObjectURL(a.href);
        });
    </script>
</div></div></div></div>
