<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Universal Image Converter – TRutiL Studio</title>
    <meta content="Convert images between all popular formats locally." name="description"/>
    <link href="../../../../style.css?v=3" rel="stylesheet"/>
    <script src="../../../../theme.js?v=3"></script>

    <style>
        .drop-zone {
            border: 2px dashed var(--border);
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            background: var(--bg-elevated);
            color: var(--text-muted);
            transition: all 0.3s ease;
            cursor: pointer;
            margin-bottom: 20px;
        }
        .drop-zone.dragover {
            border-color: var(--accent);
            background: rgba(59, 130, 246, 0.1);
            color: var(--text-primary);
        }
        .progress-bar {
            height: 8px;
            background: var(--border);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 15px;
            display: none;
        }
        .progress-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.2s;
        }
    </style>
</head>
<body>
    <div class="app-layout" id="app-layout">
        <div class="main-content">
            <div class="page-content">
                <div class="app-header">
                    <div class="app-icon" style="background:linear-gradient(135deg, #f59e0b, #d97706);color:white;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:24px;">🖼️</div>
                    <div>
                        <h1>Universal Image Converter</h1>
                        <p>Convert images to any format (JPG, PNG, WebP, GIF, BMP, TIFF, ICO) entirely offline using WebAssembly FFmpeg.</p>
                    </div>
                </div>
                <div class="tool-workspace">
                    <div class="panel" style="max-width: 800px; margin: 0 auto;">
                        <div class="panel-title">Upload & Convert</div>
                        
                        <div class="drop-zone" id="drop-zone">
                            <div style="font-size: 32px; margin-bottom: 10px;">📸</div>
                            <div style="font-weight: 600; margin-bottom: 5px;">Drag & Drop image file here</div>
                            <div style="font-size: 13px;">or click to browse</div>
                            <input type="file" id="file-input" accept="image/*" style="display: none;" />
                        </div>
                        
                        <div id="file-info" style="margin-bottom: 20px; font-weight: 500; text-align: center; color: var(--accent);"></div>

                        <div class="form-group">
                            <label class="form-label">Target Output Format</label>
                            <select id="format-select" class="form-input">
                                <option value="jpg">JPG</option>
                                <option value="png">PNG</option>
                                <option value="webp">WebP</option>
                                <option value="gif">GIF</option>
                                <option value="bmp">BMP</option>
                                <option value="tiff">TIFF</option>
                                <option value="ico">ICO</option>
                            </select>
                        </div>
                        
                        <div id="status-text" style="font-size: 14px; font-weight: 500; text-align: center; margin-top: 15px;"></div>
                        <div class="progress-bar" id="progress-bar">
                            <div class="progress-fill" id="progress-fill"></div>
                        </div>
                        
                        <div style="margin-top: 25px; display: flex; gap: 10px;">
                            <button class="btn btn-primary" id="convert-btn" disabled style="flex:1;">Convert Image</button>
                            <a class="btn btn-primary" id="download-btn" style="flex:1; display:none; background: var(--accent-green);">Download File</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const dropZone = document.getElementById('drop-zone');
            const fileInput = document.getElementById('file-input');
            const fileInfo = document.getElementById('file-info');
            const convertBtn = document.getElementById('convert-btn');
            const downloadBtn = document.getElementById('download-btn');
            const statusText = document.getElementById('status-text');
            const progressBar = document.getElementById('progress-bar');
            const progressFill = document.getElementById('progress-fill');
            const formatSelect = document.getElementById('format-select');
            
            let selectedFile = null;
            let ffmpegPath = '';
            let ffmpeg = null;
            let fs = null;
            let path = null;
            let os = null;

            try {
                fs = require('fs');
                path = require('path');
                os = require('os');
                ffmpeg = require('fluent-ffmpeg');
                const ffmpegStatic = require('ffmpeg-static');
                
                ffmpegPath = ffmpegStatic;
                if (ffmpegPath.includes('app.asar')) {
                    ffmpegPath = ffmpegPath.replace('app.asar', 'app.asar.unpacked');
                }
                ffmpeg.setFfmpegPath(ffmpegPath);
                
                statusText.textContent = "Native FFmpeg engine loaded successfully.";
                setTimeout(() => { if (!selectedFile) statusText.textContent = ""; }, 2000);
            } catch (err) {
                console.error("Native FFmpeg Error:", err);
                statusText.innerHTML = `<span style='color:red;'>Failed to load native FFmpeg: ${err.message}</span>`;
            }

            dropZone.addEventListener('click', () => fileInput.click());
            dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
            dropZone.addEventListener('dragleave', () => { dropZone.classList.remove('dragover'); });
            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropZone.classList.remove('dragover');
                if (e.dataTransfer.files.length > 0) setFile(e.dataTransfer.files[0]);
            });
            fileInput.addEventListener('change', (e) => {
                if (e.target.files.length > 0) setFile(e.target.files[0]);
            });

            function setFile(file) {
                selectedFile = file;
                fileInfo.textContent = `Selected: ${file.name} (${(file.size / 1024 / 1024).toFixed(2)} MB)`;
                
                if (ffmpeg) convertBtn.disabled = false;
                downloadBtn.style.display = 'none';
                convertBtn.style.display = 'block';
                progressBar.style.display = 'none';
                progressFill.style.width = '0%';
                statusText.textContent = "";
            }

            convertBtn.addEventListener('click', async () => {
                if (!selectedFile || !ffmpeg) return;
                
                convertBtn.disabled = true;
                progressBar.style.display = 'block';
                statusText.textContent = "Starting conversion...";
                
                const format = formatSelect.value;
                const { webUtils } = require('electron');
                const inputPath = webUtils.getPathForFile(selectedFile);
                
                if (!inputPath) {
                    statusText.innerHTML = `<span style='color:red;'>Cannot read file path. Try dragging again.</span>`;
                    convertBtn.disabled = false;
                    return;
                }

                const outputFileName = `converted_${Date.now()}.${format}`;
                const outputPath = path.join(os.tmpdir(), outputFileName);
                
                ffmpeg(inputPath)
                    // Ensure image conversion uses image2 muxer (or rely on fluent-ffmpeg's auto detection based on extension)
                    .outputOptions(format === 'ico' ? ['-vf', 'scale=256:256'] : []) // Prevent ICO from failing on large images
                    .on('progress', (progress) => {
                        if (progress.percent) {
                            progressFill.style.width = `${progress.percent}%`;
                            statusText.textContent = `Converting: ${Math.round(progress.percent)}%`;
                        } else {
                            statusText.textContent = `Converting: processing...`;
                            progressFill.style.width = `50%`;
                        }
                    })
                    .on('error', (err) => {
                        console.error("Conversion Error:", err);
                        statusText.innerHTML = `<span style='color:var(--accent-red);'>Conversion failed: ${err.message}</span>`;
                        convertBtn.disabled = false;
                        progressBar.style.display = 'none';
                    })
                    .on('end', () => {
                        progressFill.style.width = `100%`;
                        
                        try {
                            const fileBuffer = fs.readFileSync(outputPath);
                            const blob = new Blob([fileBuffer], { type: `image/${format}` });
                            const url = URL.createObjectURL(blob);
                            
                            downloadBtn.href = url;
                            const originalName = selectedFile.name.substring(0, selectedFile.name.lastIndexOf('.'));
                            downloadBtn.download = `${originalName}.${format}`;
                            
                            statusText.innerHTML = "<span style='color:var(--accent-green);'>Conversion complete!</span>";
                            convertBtn.style.display = 'none';
                            downloadBtn.style.display = 'block';
                            
                            setTimeout(() => fs.unlinkSync(outputPath), 10000);
                        } catch (ioErr) {
                            console.error(ioErr);
                            statusText.innerHTML = `<span style='color:var(--accent-red);'>Failed to prepare download.</span>`;
                            convertBtn.disabled = false;
                        }
                    })
                    .save(outputPath);
            });
        });
    </script>

    <!-- Desktop Engine Guard -->
    <script>
        if (typeof require === 'undefined' || !window.process || !window.process.versions || !window.process.versions.electron) {
            const appLayout = document.getElementById('app-layout');
            if (appLayout) {
                appLayout.style.filter = 'blur(8px)';
                appLayout.style.pointerEvents = 'none';
                appLayout.style.userSelect = 'none';
            }
            const overlay = document.createElement('div');
            overlay.style.position = 'fixed';
            overlay.style.top = '0';
            overlay.style.left = '0';
            overlay.style.width = '100vw';
            overlay.style.height = '100vh';
            overlay.style.backgroundColor = 'rgba(15, 23, 42, 0.85)';
            overlay.style.backdropFilter = 'blur(4px)';
            overlay.style.zIndex = '999999';
            overlay.style.display = 'flex';
            overlay.style.flexDirection = 'column';
            overlay.style.alignItems = 'center';
            overlay.style.justifyContent = 'center';
            overlay.style.color = 'white';
            overlay.style.fontFamily = 'Inter, sans-serif';
            overlay.style.textAlign = 'center';
            overlay.style.padding = '20px';
            
            overlay.innerHTML = `
                <div style="background: var(--bg-card, #1e293b); padding: 40px; border-radius: 20px; border: 1px solid var(--border, #334155); max-width: 500px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);">
                    <div style="font-size: 48px; margin-bottom: 20px;">⚡</div>
                    <h2 style="font-size: 24px; font-weight: 700; margin: 0 0 15px 0;">Desktop Engine Required</h2>
                    <p style="font-size: 16px; color: #94a3b8; line-height: 1.6; margin: 0 0 25px 0;">This advanced feature requires a local engine. It is available exclusively on the TRutiL Studio Desktop App <strong style="color: white;">FOR FREE</strong>.</p>
                    <button style="font-size: 16px; padding: 12px 24px; cursor: pointer; background: #3b82f6; color: white; border: none; border-radius: 8px; font-weight: 600;" onclick="window.history.back();">Return</button>
                </div>
            `;
            document.body.appendChild(overlay);
        }
    </script>
</body>
</html>
