<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Color Palette Generator — TRutiL Studio</title>
<link href="../../../../style.css" rel="stylesheet"/>
<link href="../../../../custom-tools.css" rel="stylesheet"/>
<script src="../../../../theme.js"></script>
</head>
<body>
<div class="app-layout" id="app-layout">
<div class="main-content">
<div class="page-content"><div id="tool-palette">
<div class="app-header">
<div class="app-icon" style="background:linear-gradient(135deg, #ec4899, #e11d48);color:white;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:24px;">⚙️</div>
<div>
<h1>Color Palette Generator</h1>
<p>Generate harmonious color palettes, copy HEX values, and lock your favorites.</p>
</div>
</div>
<div class="palette-container" id="palette">
<!-- Colors dynamically injected -->
</div>
<div class="controls" style="flex-wrap: wrap; gap: 15px;">
<select class="form-input" id="rule-select" style="padding: 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-card); color: var(--text-primary);">
<option value="random">Random</option>
<option value="monochromatic">Monochromatic</option>
<option value="analogous">Analogous</option>
<option value="complementary">Complementary</option>
<option value="triadic">Triadic</option>
<option value="tetradic">Tetradic</option>
</select>
<button class="btn btn-primary" id="generate-btn">Generate Colors</button>
<select class="form-input" id="export-select" style="padding: 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-card); color: var(--text-primary);">
<option value="">Export As...</option>
<option value="json">JSON</option>
<option value="css">CSS Variables</option>
<option value="scss">SCSS Map</option>
</select>
<p style="margin: 0; display: flex; align-items: center;">Press <strong>Spacebar</strong> to generate.</p>
</div>
</div></div>
</div>
</div>
<div class="toast" id="toast">Color copied!</div>
<script>
const colorsData = [
  { hex: '', locked: false },
  { hex: '', locked: false },
  { hex: '', locked: false },
  { hex: '', locked: false },
  { hex: '', locked: false }
];

function hslToHex(h, s, l) {
  l /= 100;
  const a = s * Math.min(l, 1 - l) / 100;
  const f = n => {
    const k = (n + h / 30) % 12;
    const color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
    return Math.round(255 * color).toString(16).padStart(2, '0');
  };
  return `#${f(0)}${f(8)}${f(4)}`.toUpperCase();
}

function hexToHsl(hex) {
  hex = hex.replace(/^#/, '');
  let r = parseInt(hex.substring(0, 2), 16) / 255;
  let g = parseInt(hex.substring(2, 4), 16) / 255;
  let b = parseInt(hex.substring(4, 6), 16) / 255;

  let max = Math.max(r, g, b), min = Math.min(r, g, b);
  let h, s, l = (max + min) / 2;

  if (max === min) {
    h = s = 0; 
  } else {
    let d = max - min;
    s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
    switch (max) {
      case r: h = (g - b) / d + (g < b ? 6 : 0); break;
      case g: h = (b - r) / d + 2; break;
      case b: h = (r - g) / d + 4; break;
    }
    h /= 6;
  }
  return { h: h * 360, s: s * 100, l: l * 100 };
}

function getLuminance(r, g, b) {
  const a = [r, g, b].map(function (v) {
    v /= 255;
    return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
  });
  return a[0] * 0.2126 + a[1] * 0.7152 + a[2] * 0.0722;
}

function getContrastColor(hex) {
  hex = hex.replace('#', '');
  const r = parseInt(hex.substring(0, 2), 16);
  const g = parseInt(hex.substring(2, 4), 16);
  const b = parseInt(hex.substring(4, 6), 16);
  return getLuminance(r, g, b) > 0.179 ? '#000000' : '#FFFFFF';
}

function generatePalette() {
  const rule = document.getElementById('rule-select').value;
  const lockedColors = colorsData.filter(c => c.locked);
  let baseHue, baseS, baseL;

  if (lockedColors.length > 0) {
    const hsl = hexToHsl(lockedColors[0].hex);
    baseHue = hsl.h;
    baseS = hsl.s;
    baseL = hsl.l;
  } else {
    baseHue = Math.floor(Math.random() * 360);
    baseS = 60 + Math.random() * 30; // 60-90
    baseL = 40 + Math.random() * 30; // 40-70
  }

  const hues = [];
  
  for(let i = 0; i < 5; i++) {
    if (rule === 'monochromatic') {
      hues.push(baseHue);
    } else if (rule === 'analogous') {
      hues.push((baseHue + (i - 2) * 20 + 360) % 360);
    } else if (rule === 'complementary') {
      hues.push(i % 2 === 0 ? baseHue : (baseHue + 180) % 360);
    } else if (rule === 'triadic') {
      hues.push((baseHue + (i % 3) * 120) % 360);
    } else if (rule === 'tetradic') {
      const offsets = [0, 90, 180, 270, 0];
      hues.push((baseHue + offsets[i]) % 360);
    } else {
      const paletteType = Math.random();
      if (paletteType < 0.4) hues.push((baseHue + (i - 2) * 20 + 360) % 360);
      else if (paletteType < 0.7) hues.push((baseHue + i * (360 / 3) + Math.random() * 20) % 360);
      else hues.push(Math.floor(Math.random() * 360));
    }
  }
  
  if (rule === 'random') hues.sort(() => Math.random() - 0.5);

  let hIndex = 0;
  colorsData.forEach((col) => {
    if (!col.locked) {
      const h = hues[hIndex++];
      // Vary Saturation and Lightness slightly for depth
      const s = Math.max(20, Math.min(100, baseS - 15 + Math.random() * 30));
      const l = Math.max(20, Math.min(90, baseL - 15 + Math.random() * 30));
      col.hex = hslToHex(h, s, l);
    }
  });
  
  renderPalette();
}

function renderPalette() {
  const container = document.getElementById('palette');
  container.innerHTML = '';
  
  colorsData.forEach((col) => {
    const colDiv = document.createElement('div');
    colDiv.className = 'color-col';
    colDiv.style.backgroundColor = col.hex;
    
    colDiv.onclick = (e) => {
      // Don't copy if clicking the lock button
      if(e.target.closest('.lock-btn')) return; 
      copyToClipboard(col.hex);
    };

    const contrastColor = getContrastColor(col.hex);

    const infoDiv = document.createElement('div');
    infoDiv.className = 'color-info';
    infoDiv.textContent = col.hex;
    infoDiv.style.color = contrastColor;
    infoDiv.style.background = 'transparent';
    infoDiv.style.boxShadow = 'none';
    infoDiv.style.backdropFilter = 'none';
    infoDiv.style.webkitBackdropFilter = 'none';
    
    const lockBtn = document.createElement('button');
    lockBtn.className = 'lock-btn';
    lockBtn.style.color = contrastColor;
    lockBtn.style.background = contrastColor === '#000000' ? 'rgba(0,0,0,0.1)' : 'rgba(255,255,255,0.2)';
    lockBtn.style.boxShadow = 'none';
    lockBtn.style.backdropFilter = 'none';
    lockBtn.style.webkitBackdropFilter = 'none';
    
    const lockIcon = `<svg class="icon" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM9 6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9V6zm9 14H6V10h12v10zm-6-3c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2z"/></svg>`;
    const unlockIcon = `<svg class="icon" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6h2c0-1.66 1.34-3 3-3s3 1.34 3 3v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm0 12H6V10h12v10zm-6-3c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2z"/></svg>`;
    
    lockBtn.innerHTML = col.locked ? `${lockIcon} Locked` : `${unlockIcon} Unlocked`;
    lockBtn.onclick = () => {
      col.locked = !col.locked;
      renderPalette();
    };

    colDiv.appendChild(infoDiv);
    colDiv.appendChild(lockBtn);
    container.appendChild(colDiv);
  });
}

function copyToClipboard(text) {
  navigator.clipboard.writeText(text).then(() => {
    showToast(`Copied ${text}!`);
  }).catch(err => {
    const textArea = document.createElement("textarea");
    textArea.value = text;
    document.body.appendChild(textArea);
    textArea.select();
    try {
      document.execCommand('copy');
      showToast(`Copied ${text}!`);
    } catch (ex) {}
    document.body.removeChild(textArea);
  });
}

let toastTimeout;
function showToast(message) {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.classList.add('show');
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => {
    toast.classList.remove('show');
  }, 2000);
}

document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA' && e.target.tagName !== 'SELECT') {
    e.preventDefault();
    generatePalette();
  }
});

document.getElementById('generate-btn').addEventListener('click', generatePalette);

document.getElementById('export-select').addEventListener('change', (e) => {
  const format = e.target.value;
  if (!format) return;
  e.target.value = '';
  
  const hexes = colorsData.map(c => c.hex);
  let content = '';
  let filename = '';
  let mime = 'text/plain';

  if (format === 'json') {
    content = JSON.stringify(hexes, null, 2);
    filename = 'palette.json';
    mime = 'application/json';
  } else if (format === 'css') {
    content = ':root {\n' + hexes.map((hex, i) => `  --color-${i+1}: ${hex};`).join('\n') + '\n}';
    filename = 'palette.css';
    mime = 'text/css';
  } else if (format === 'scss') {
    content = '$palette: (\n' + hexes.map((hex, i) => `  "color-${i+1}": ${hex}`).join(',\n') + '\n);';
    filename = 'palette.scss';
  }

  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
});

// Initial Generation
generatePalette();
</script>
</body>
</html>
