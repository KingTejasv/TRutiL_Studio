<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>PDF OCR Converter – TRutiL Studio</title>
    <meta content="Extract text from scanned PDFs and images using Optical Character Recognition (OCR)." name="description"/>
    <link href="../../../style.css" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <script src="../../../theme.js"></script>
</head>
<body>
    <div class="app-layout" id="app-layout">
        <div class="main-content">
            <div class="page-content">
                <div class="app-header">
                    <div class="app-icon">🚀</div>
                    <div>
                        <h1>PDF OCR Converter</h1>
                        <p>Extract text from scanned PDFs and images using Optical Character Recognition (OCR).</p>
                    </div>
                </div>

                <div class="tool-workspace">
                    <div class="panel">
                        <div class="panel-title">PDF OCR Converter Interface</div>
                        
                        <div class="form-group">
                            <label class="form-label">Input Data</label>
                            <textarea class="form-textarea" id="tool-input" placeholder="Enter your data, configure your settings, or upload a file..."></textarea>
                        </div>
                        
                        <div style="margin-top: 15px; margin-bottom: 25px;">
                            <button class="btn btn-primary" id="action-btn">Process / Execute Tool</button>
                            <button class="btn btn-ghost" id="clear-btn">Clear</button>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Result Output</label>
                            <div class="result-card" id="tool-output" style="min-height: 120px; background: var(--bg-elevated); color: var(--text-primary); border: 1px solid var(--border);">
                                <span style="color: var(--text-muted); font-size: 14px;">Results will appear here...</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>

document.addEventListener('DOMContentLoaded', () => {
    // Add Tesseract JS dynamically
    const script = document.createElement('script');
    script.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
    document.head.appendChild(script);

    const actionBtn = document.getElementById('action-btn');
    const inputData = document.getElementById('tool-input');
    const outputData = document.getElementById('tool-output');

    actionBtn.addEventListener('click', async () => {
        if(!inputData.value) {
            outputData.innerHTML = `<span style="color: var(--accent-red); font-size: 14px;">Please enter an image URL to OCR. (PDF OCR requires server, Image OCR works in browser)</span>`;
            return;
        }
        
        outputData.innerHTML = '<span style="color: var(--tv-primary); font-size: 14px;">Loading Tesseract.js OCR Engine... This may take a moment.</span>';
        
        try {
            const worker = await Tesseract.createWorker('eng');
            outputData.innerHTML = '<span style="color: var(--tv-primary); font-size: 14px;">Recognizing text...</span>';
            const ret = await worker.recognize(inputData.value);
            outputData.innerHTML = `
                <div style="display:flex; flex-direction:column; gap: 10px;">
                    <span style="color: #00FF25; font-size: 16px; font-weight: bold;">✓ OCR Complete!</span>
                    <textarea class="form-textarea" style="min-height: 150px;">${ret.data.text}</textarea>
                </div>
            `;
            await worker.terminate();
        } catch(e) {
            outputData.innerHTML = `<span style="color: var(--accent-red); font-size: 14px;">Error: ${e.message}</span>`;
        }
    });
});

</script>
</body>
</html>
