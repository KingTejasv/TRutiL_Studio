<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>PDF Signer – TRutiL Studio</title>
    <meta content="Draw or upload your signature to digitally sign PDF documents." name="description"/>
    <link href="../../../style.css?v=3" rel="stylesheet"/>

    <script src="../../../theme.js?v=3"></script>
</head>
<body>
    <div class="app-layout" id="app-layout">
        <div class="main-content">
            <div class="page-content">
                <div class="app-header">
                    <div class="app-icon">🚀</div>
                    <div>
                        <h1>PDF Signer</h1>
                        <p>Draw or upload your signature to digitally sign PDF documents.</p>
                    </div>
                </div>

                <div class="tool-workspace">
                    <div class="panel">
                        <div class="panel-title">PDF Signer Interface</div>
                        
                        <div class="drop-zone" id="drop-zone" style="border: 2px dashed var(--border); border-radius: 12px; padding: 40px; text-align: center; background: var(--bg-elevated); cursor: pointer; transition: all 0.3s ease;">
                            <div style="font-size: 32px; margin-bottom: 10px;">📄</div>
                            <div style="font-weight: 600; margin-bottom: 5px;">Drag & Drop PDF here</div>
                            <input type="file" id="file-input" accept=".pdf" style="display: none;" />
                        </div>
                        <div id="file-info" style="margin-bottom: 20px; margin-top: 15px; font-weight: 500; text-align: center; color: var(--accent);"></div>

                        <div class="form-group" style="margin-top:20px;">
                            <label class="form-label">Draw Your Signature</label>
                            <div style="border: 1px solid var(--border); border-radius: 8px; background: #fff; overflow: hidden; position: relative;">
                                <canvas id="sig-canvas" width="600" height="200" style="width: 100%; height: 200px; display: block; cursor: crosshair; touch-action: none;"></canvas>
                            </div>
                            <div style="text-align: right; margin-top: 10px;">
                                <button class="btn btn-ghost" id="clear-sig-btn">Clear Signature</button>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">Signature Placement Page (default: last page)</label>
                            <input type="number" id="page-input" class="form-input" placeholder="e.g. 1" min="1" />
                        </div>

                        <div id="status-text" style="font-size: 14px; font-weight: 500; text-align: center; margin-top: 15px;"></div>
                        
                        <div style="margin-top: 15px; margin-bottom: 25px;">
                            <button class="btn btn-primary" id="action-btn" disabled style="width:100%;">Sign & Export PDF</button>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Result Output</label>
                            <div class="result-card" id="tool-output" style="min-height: 120px; background: var(--bg-elevated); color: var(--text-primary); border: 1px solid var(--border);">
                                <span style="color: var(--text-muted); font-size: 14px;">Results will appear here...</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
document.addEventListener('DOMContentLoaded', () => {
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const fileInfo = document.getElementById('file-info');
    const actionBtn = document.getElementById('action-btn');
    const outputData = document.getElementById('tool-output');
    const statusText = document.getElementById('status-text');
    const clearSigBtn = document.getElementById('clear-sig-btn');
    const sigCanvas = document.getElementById('sig-canvas');
    const pageInput = document.getElementById('page-input');
    
    let selectedFile = null;
    let fs = null;
    let PDFLib = null;
    let { webUtils } = require('electron');

    try {
        fs = require('fs');
        PDFLib = require('pdf-lib');
    } catch(err) {
        console.error(err);
        statusText.innerHTML = `<span style='color:red;'>Engine Init Error: ${err.message}</span>`;
    }

    // Signature Pad Logic
    const ctx = sigCanvas.getContext('2d');
    ctx.strokeStyle = '#000000';
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    
    let drawing = false;
    let hasSignature = false;

    function getPos(e) {
        const rect = sigCanvas.getBoundingClientRect();
        const scaleX = sigCanvas.width / rect.width;
        const scaleY = sigCanvas.height / rect.height;
        let clientX = e.clientX;
        let clientY = e.clientY;
        if (e.touches && e.touches.length > 0) {
            clientX = e.touches[0].clientX;
            clientY = e.touches[0].clientY;
        }
        return {
            x: (clientX - rect.left) * scaleX,
            y: (clientY - rect.top) * scaleY
        };
    }

    function startDraw(e) {
        drawing = true;
        hasSignature = true;
        const pos = getPos(e);
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
    }
    function draw(e) {
        if (!drawing) return;
        e.preventDefault();
        const pos = getPos(e);
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
    }
    function endDraw() {
        drawing = false;
    }

    sigCanvas.addEventListener('mousedown', startDraw);
    sigCanvas.addEventListener('mousemove', draw);
    sigCanvas.addEventListener('mouseup', endDraw);
    sigCanvas.addEventListener('mouseout', endDraw);
    sigCanvas.addEventListener('touchstart', startDraw, {passive: false});
    sigCanvas.addEventListener('touchmove', draw, {passive: false});
    sigCanvas.addEventListener('touchend', endDraw);

    clearSigBtn.addEventListener('click', () => {
        ctx.clearRect(0, 0, sigCanvas.width, sigCanvas.height);
        hasSignature = false;
    });

    // File Drag and Drop Logic
    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.style.borderColor = 'var(--accent)'; });
    dropZone.addEventListener('dragleave', () => { dropZone.style.borderColor = 'var(--border)'; });
    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.style.borderColor = 'var(--border)';
        if (e.dataTransfer.files.length > 0) setFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) setFile(e.target.files[0]);
    });

    function setFile(file) {
        if (!file.name.toLowerCase().endsWith('.pdf')) {
            alert('Please select a PDF file.');
            return;
        }
        selectedFile = file;
        fileInfo.textContent = `Selected: ${file.name} (${(file.size / 1024 / 1024).toFixed(2)} MB)`;
        actionBtn.disabled = false;
        outputData.innerHTML = `<span style="color: var(--text-muted); font-size: 14px;">Results will appear here...</span>`;
    }

    actionBtn.addEventListener('click', async () => {
        if (!selectedFile) return;
        if (!hasSignature) {
            alert('Please draw your signature first.');
            return;
        }
        
        const filePath = webUtils.getPathForFile(selectedFile);
        if (!filePath) {
            statusText.innerHTML = `<span style='color:red;'>Cannot read file path. Please drag again.</span>`;
            return;
        }

        actionBtn.disabled = true;
        statusText.textContent = "Signing PDF...";
        outputData.innerHTML = '';
        
        try {
            const fileBuffer = fs.readFileSync(filePath);
            const pdfDoc = await PDFLib.PDFDocument.load(fileBuffer);
            
            // Get signature image
            const sigDataUrl = sigCanvas.toDataURL('image/png');
            const sigImageBytes = await fetch(sigDataUrl).then(res => res.arrayBuffer());
            const pngImage = await pdfDoc.embedPng(sigImageBytes);
            
            const pngDims = pngImage.scale(0.35); // scale down
            
            const pages = pdfDoc.getPages();
            const targetPageNum = pageInput.value ? parseInt(pageInput.value) : pages.length;
            const validPageNum = Math.max(1, Math.min(targetPageNum, pages.length));
            const page = pages[validPageNum - 1];
            
            // Stamp at bottom right
            const { width, height } = page.getSize();
            page.drawImage(pngImage, {
                x: width - pngDims.width - 50,
                y: 50,
                width: pngDims.width,
                height: pngDims.height,
            });
            
            const pdfBytes = await pdfDoc.save();
            const blob = new Blob([pdfBytes], { type: 'application/pdf' });
            const url = URL.createObjectURL(blob);
            
            statusText.textContent = "";
            outputData.innerHTML = `
                <div style="display:flex; flex-direction:column; gap: 10px; align-items:center;">
                    <span style="color: #00FF25; font-size: 16px; font-weight: bold;">✓ PDF Signed Successfully!</span>
                    <p style="font-size: 13px; color: var(--text-muted);">Stamped on page ${validPageNum}</p>
                    <a href="${url}" download="signed_${selectedFile.name}" class="btn btn-primary" style="text-align:center; text-decoration:none; width: 80%;">Download Signed PDF</a>
                </div>
            `;
        } catch(e) {
            console.error(e);
            statusText.innerHTML = `<span style="color: var(--accent-red); font-size: 14px;">Error: ${e.message}</span>`;
        }
        
        actionBtn.disabled = false;
    });
});
</script>

    <!-- Desktop Engine Guard -->
    <script>
        if (typeof require === 'undefined' || !window.process || !window.process.versions || !window.process.versions.electron) {
            const appLayout = document.getElementById('app-layout');
            if (appLayout) {
                appLayout.style.filter = 'blur(8px)';
                appLayout.style.pointerEvents = 'none';
                appLayout.style.userSelect = 'none';
            }
            const overlay = document.createElement('div');
            overlay.style.position = 'fixed';
            overlay.style.top = '0';
            overlay.style.left = '0';
            overlay.style.width = '100vw';
            overlay.style.height = '100vh';
            overlay.style.backgroundColor = 'rgba(15, 23, 42, 0.85)';
            overlay.style.backdropFilter = 'blur(4px)';
            overlay.style.zIndex = '999999';
            overlay.style.display = 'flex';
            overlay.style.flexDirection = 'column';
            overlay.style.alignItems = 'center';
            overlay.style.justifyContent = 'center';
            overlay.style.color = 'white';
            overlay.style.fontFamily = 'Inter, sans-serif';
            overlay.style.textAlign = 'center';
            overlay.style.padding = '20px';
            
            overlay.innerHTML = `
                <div style="background: var(--bg-card, #1e293b); padding: 40px; border-radius: 20px; border: 1px solid var(--border, #334155); max-width: 500px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);">
                    <div style="font-size: 48px; margin-bottom: 20px;">⚡</div>
                    <h2 style="font-size: 24px; font-weight: 700; margin: 0 0 15px 0;">Desktop Engine Required</h2>
                    <p style="font-size: 16px; color: #94a3b8; line-height: 1.6; margin: 0 0 25px 0;">This advanced feature requires a local engine. It is available exclusively on the TRutiL Studio Desktop App <strong style="color: white;">FOR FREE</strong>.</p>
                    <button style="font-size: 16px; padding: 12px 24px; cursor: pointer; background: #3b82f6; color: white; border: none; border-radius: 8px; font-weight: 600;" onclick="window.history.back();">Return</button>
                </div>
            `;
            document.body.appendChild(overlay);
        }
    </script>
</body>
</html>
