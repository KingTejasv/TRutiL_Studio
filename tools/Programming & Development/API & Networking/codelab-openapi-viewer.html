<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>OpenAPI Viewer – TRutiL Studio</title>
    <meta content="View and interact with OpenAPI/Swagger specifications." name="description"/>
    <link href="../../../style.css?v=3" rel="stylesheet"/>
    <link href="../../../node_modules/swagger-ui-dist/swagger-ui.css" rel="stylesheet"/>
    <script src="../../../node_modules/swagger-ui-dist/swagger-ui-bundle.js"></script>

    <script src="../../../theme.js?v=3"></script>
</head>
<body>
    <div class="app-layout" id="app-layout">
        <div class="main-content">
            <div class="page-content">
                <div class="app-header">
                    <div class="app-icon">🚀</div>
                    <div>
                        <h1>OpenAPI Viewer</h1>
                        <p>View and interact with OpenAPI/Swagger specifications.</p>
                    </div>
                </div>

                <div class="tool-workspace">
                    <div class="panel">
                        <div class="panel-title">OpenAPI Viewer Interface</div>
                        
                        <div class="form-group">
                            <label class="form-label">Paste OpenAPI Specification (JSON or YAML)</label>
                            <textarea class="form-textarea" id="tool-input" placeholder="openapi: 3.0.0&#10;info:&#10;  title: Sample API&#10;  version: 1.0.0..." style="min-height: 250px; font-family: monospace;"></textarea>
                        </div>
                        
                        <div style="margin-top: 15px; margin-bottom: 25px;">
                            <button class="btn btn-primary" id="action-btn" style="width: 100%;">Render Documentation UI</button>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Interactive Documentation</label>
                            <div class="result-card" id="tool-output" style="min-height: 120px; background: white; border-radius: 8px; padding: 15px; border: 1px solid var(--border);">
                                <span style="color: var(--text-muted); font-size: 14px;">Swagger UI will render here...</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
document.addEventListener('DOMContentLoaded', () => {
    const actionBtn = document.getElementById('action-btn');
    const inputData = document.getElementById('tool-input');
    const outputData = document.getElementById('tool-output');
    
    let yaml = null;
    try {
        yaml = require('js-yaml');
    } catch(err) {
        console.error("js-yaml not found", err);
    }

    actionBtn.addEventListener('click', () => {
        if(!inputData.value.trim()) {
            outputData.innerHTML = `<span style="color: var(--accent-red); font-size: 14px;">Please paste an OpenAPI JSON or YAML spec.</span>`;
            return;
        }
        
        outputData.innerHTML = `<div id="swagger-ui"></div>`;
        
        try {
            let specObj;
            const content = inputData.value.trim();
            
            // Try parsing as JSON first
            if (content.startsWith('{')) {
                specObj = JSON.parse(content);
            } else if (yaml) {
                // Parse as YAML
                specObj = yaml.load(content);
            } else {
                throw new Error("Content appears to be YAML but js-yaml parser is missing.");
            }
            
            SwaggerUIBundle({
                spec: specObj,
                dom_id: '#swagger-ui',
                presets: [
                    SwaggerUIBundle.presets.apis,
                    SwaggerUIBundle.SwaggerUIStandalonePreset
                ],
                layout: "BaseLayout"
            });
            
        } catch(e) {
            outputData.innerHTML = `<span style="color: var(--accent-red); font-size: 14px;">Error parsing specification: ${e.message}</span>`;
        }
    });
});
</script>
</body>
</html>
