<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>.gitignore Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Fira+Code:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="../../../style.css?v=3" rel="stylesheet"/>

<link href="../../../custom-tools.css?v=3" rel="stylesheet"/>
    <script src="../../../theme.js?v=3"></script>
</head>
<body><div class="app-layout" id="app-layout"><div class="main-content"><div class="page-content"><div id="tool-codelab-git-ignore-gen">
<div class="tool-layout-container">
<div class="app-header">
<h1>🙈 .gitignore Generator</h1>
<p>Instantly generate .gitignore files for your project stack</p>
</div>
<div class="split-pane">
<div class="panel">
<div class="pane-header">
<div class="pane-title">Select Templates</div>
</div>
<div class="checkbox-grid" id="checkbox-grid">
<!-- Dynamically generated checkboxes -->
</div>
</div>
<div class="panel">
<div class="pane-header">
<div class="pane-title">Generated .gitignore</div>
<div class="pane-actions">
<button class="btn" onclick="copyOutput()">⚡ Copy Code</button>
</div>
</div>
<textarea class="code-area form-input" id="output" readonly=""></textarea>
</div>
</div>
<div class="stats-bar">
<div class="stat-group">
<div class="stat-item">
<span class="stat-label">Selected Templates</span>
<span class="stat-num" id="stat-selected">0</span>
</div>
<div class="stat-item">
<span class="stat-label">Lines Generated</span>
<span class="stat-num" id="stat-lines">0</span>
</div>
</div>
<div class="pill">Clean Repo ✨</div>
</div>
</div>
<script>
const templates = {
  Node: "node_modules/\nlogs\n*.log\nnpm-debug.log*\nyarn-debug.log*\nyarn-error.log*\n.env\n.DS_Store\ndist/\nbuild/\n",
  Python: "__pycache__/\n*.py[cod]\n*$py.class\n*.so\n.Python\nbuild/\ndevelop-eggs/\ndist/\ndownloads/\neggs/\n.eggs/\nlib/\nlib64/\nparts/\nsdist/\nvar/\nwheels/\n*.egg-info/\n.installed.cfg\n*.egg\nvenv/\nENV/\n.env\n.venv\n",
  MacOS: ".DS_Store\n.AppleDouble\n.LSOverride\nIcon\n._*\n.DocumentRevisions-V100\n.fseventsd\n.Spotlight-V100\n.TemporaryItems\n.Trashes\n.VolumeIcon.icns\n.com.apple.timemachine.donotpresent\n",
  Windows: "Thumbs.db\nThumbs.db:encryptable\nehthumbs.db\nehthumbs_vista.db\n*.stackdump\n[Dd]esktop.ini\n$RECYCLE.BIN/\n*.cab\n*.msi\n*.msix\n*.msm\n*.msp\n*.lnk\n",
  VSCode: ".vscode/*\n!.vscode/settings.json\n!.vscode/tasks.json\n!.vscode/launch.json\n!.vscode/extensions.json\n*.code-workspace\n",
  IntelliJ: ".idea/\n*.iml\n*.iws\nout/\n",
  Go: "bin/\npkg/\n*.exe\n*.exe~hint\n*.dll\n*.so\n*.dylib\n*.test\n*.out\n",
  Java: "*.class\n*.log\n*.ctxt\n.mtj.tmp/\n*.jar\n*.war\n*.nar\n*.ear\n*.zip\n*.tar.gz\n*.rar\nhs_err_pid*\n",
  Ruby: "*.gem\n*.rbc\n/.config\n/coverage/\n/pkg/\n/spec/reports/\n/tmp/\ndoc/\n.ruby-version\n.bundle/\nGemfile.lock\n.env\n",
  PHP: ".phpunit.result.cache\n/vendor/\n.env\n.php-cs-fixer.cache\n",
  React: "node_modules/\nbuild/\n.env\n.DS_Store\ncoverage/\n",
  Linux: "*~\n.fuse_hidden*\n.directory\n.Trash-*\n.nfs*\n"
};

function generateGitignore() {
  const checkboxes = document.querySelectorAll('.checkbox-input:checked');
  let output = "# Generated by Codelab .gitignore Generator\n\n";
  let count = 0;
  
  checkboxes.forEach(cb => {
    const key = cb.value;
    if (templates[key]) {
      output += `### ${key} ###\n`;
      output += templates[key] + "\n";
      count++;
    }
  });

  if (count === 0) {
    output = "# Select templates on the left to generate .gitignore\n";
  }

  document.getElementById('output').value = output;
  document.getElementById('stat-selected').innerText = count;
  document.getElementById('stat-lines').innerText = output.split('\n').length;
}

function copyOutput() {
  const output = document.getElementById('output');
  output.select();
  document.execCommand('copy');
  const btn = document.querySelector('.pane-actions .btn');
  const originalText = btn.innerHTML;
  btn.innerHTML = '✅ Copied!';
  setTimeout(() => btn.innerHTML = originalText, 2000);
}

window.onload = () => {
  const grid = document.getElementById('checkbox-grid');
  Object.keys(templates).forEach(key => {
    const label = document.createElement('label');
    label.className = 'checkbox-label';
    label.innerHTML = `<input type="checkbox" class="checkbox-input" value="${key}" onchange="generateGitignore()"> <span class="checkbox-text">${key}</span>`;
    grid.appendChild(label);
  });
  generateGitignore();
};
</script>
</div></div></div></div>


</body>
</html>
