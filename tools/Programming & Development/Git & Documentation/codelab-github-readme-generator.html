<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>GitHub README Generator – TRutiL Studio</title>
    <meta content="Generate professional GitHub README.md files easily." name="description"/>
    <link href="../../../style.css?v=3" rel="stylesheet"/>
    <script src="../../../theme.js?v=3"></script>
    <script src="marked.min.js"></script>
    <style>
        .split-pane {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            height: calc(100vh - 200px);
            min-height: 600px;
        }
        @media (max-width: 900px) {
            .split-pane { grid-template-columns: 1fr; height: auto; }
        }
        .scrollable-panel {
            overflow-y: auto;
            padding-right: 10px;
        }
        .markdown-output {
            font-family: monospace;
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 15px;
            border-radius: 8px;
            height: 100%;
            width: 100%;
            border: 1px solid var(--border);
            resize: none;
            white-space: pre;
            overflow: auto;
        }
        .preview-html {
            background: #fff;
            color: #333;
            padding: 20px;
            border-radius: 8px;
            height: 100%;
            overflow-y: auto;
            border: 1px solid var(--border);
        }
        .preview-html h1, .preview-html h2 { border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .preview-html pre { background: #f6f8fa; padding: 16px; border-radius: 6px; }
        .preview-html code { background: #f6f8fa; padding: 2px 4px; border-radius: 4px; font-family: monospace; }
        
        .tab-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 8px 16px;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            font-weight: 600;
        }
        .tab-btn.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }
    </style>
</head>
<body>
    <div class="app-layout" id="app-layout">
        <div class="main-content">
            <div class="page-content">
                <div class="app-header">
                    <div class="app-icon" style="background:linear-gradient(135deg, #18181b, #3f3f46);color:white;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:24px;">📝</div>
                    <div>
                        <h1>GitHub README Generator</h1>
                        <p>Generate a professional `README.md` for your open-source projects.</p>
                    </div>
                </div>
                <div class="tool-workspace">
                    
                    <div class="split-pane">
                        <div class="panel scrollable-panel">
                            <div class="panel-title">Project Details</div>
                            
                            <div class="form-group">
                                <label class="form-label">Project Title</label>
                                <input type="text" class="form-input" id="inp-title" value="My Awesome Project" />
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label">Description</label>
                                <textarea class="form-textarea" id="inp-desc" rows="3">A brief description of what this project does and who it's for.</textarea>
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label">Installation</label>
                                <textarea class="form-textarea" id="inp-install" rows="4">```bash&#10;npm install my-project&#10;```</textarea>
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label">Usage/Examples</label>
                                <textarea class="form-textarea" id="inp-usage" rows="4">```javascript&#10;import Component from 'my-project'&#10;&#10;function App() {&#10;  return <Component />&#10;}&#10;```</textarea>
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label">Features (One per line)</label>
                                <textarea class="form-textarea" id="inp-features" rows="4">Light/dark mode toggle&#10;Live previews&#10;Cross platform</textarea>
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label">License</label>
                                <select class="form-input" id="inp-license">
                                    <option value="MIT">MIT</option>
                                    <option value="Apache-2.0">Apache-2.0</option>
                                    <option value="GPL-3.0">GPL-3.0</option>
                                </select>
                            </div>
                        </div>
                        
                        <div class="panel" style="display: flex; flex-direction: column;">
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                                <div>
                                    <button class="tab-btn active" id="tab-raw">Raw Markdown</button>
                                    <button class="tab-btn" id="tab-preview">Preview</button>
                                </div>
                                <div style="display: flex; gap: 10px;">
                                    <button class="btn btn-ghost" id="copy-btn">Copy</button>
                                    <button class="btn btn-primary" id="download-btn">Download</button>
                                </div>
                            </div>
                            
                            <textarea id="output-raw" class="markdown-output" readonly></textarea>
                            <div id="output-preview" class="preview-html" style="display: none;"></div>
                        </div>
                    </div>
                    
                </div>
            </div>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const inputs = ['inp-title', 'inp-desc', 'inp-install', 'inp-usage', 'inp-features', 'inp-license'].map(id => document.getElementById(id));
            const outputRaw = document.getElementById('output-raw');
            const outputPreview = document.getElementById('output-preview');
            const tabRaw = document.getElementById('tab-raw');
            const tabPreview = document.getElementById('tab-preview');
            const copyBtn = document.getElementById('copy-btn');
            const downloadBtn = document.getElementById('download-btn');
            
            function generateMarkdown() {
                const title = document.getElementById('inp-title').value.trim();
                const desc = document.getElementById('inp-desc').value.trim();
                const install = document.getElementById('inp-install').value.trim();
                const usage = document.getElementById('inp-usage').value.trim();
                const features = document.getElementById('inp-features').value.trim().split('\n').filter(l => l.trim()).map(l => `- ${l.trim()}`).join('\n');
                const license = document.getElementById('inp-license').value;
                
                let md = `# ${title}\n\n`;
                if (desc) md += `${desc}\n\n`;
                
                md += `![License: ${license}](https://img.shields.io/badge/License-${license.replace('-', '_')}-blue.svg)\n\n`;
                
                if (features) {
                    md += `## Features\n\n${features}\n\n`;
                }
                
                if (install) {
                    md += `## Installation\n\n${install}\n\n`;
                }
                
                if (usage) {
                    md += `## Usage/Examples\n\n${usage}\n\n`;
                }
                
                md += `## License\n\n[${license}](https://choosealicense.com/licenses/${license.toLowerCase()}/)`;
                
                return md;
            }

            function updateOutput() {
                const md = generateMarkdown();
                outputRaw.value = md;
                if (typeof marked !== 'undefined') {
                    outputPreview.innerHTML = marked.parse(md);
                } else {
                    outputPreview.innerHTML = '<p style="color:red">Markdown parser failed to load.</p>';
                }
            }

            inputs.forEach(el => el.addEventListener('input', updateOutput));
            updateOutput();
            
            tabRaw.addEventListener('click', () => {
                tabRaw.classList.add('active');
                tabPreview.classList.remove('active');
                outputRaw.style.display = 'block';
                outputPreview.style.display = 'none';
            });
            
            tabPreview.addEventListener('click', () => {
                tabPreview.classList.add('active');
                tabRaw.classList.remove('active');
                outputPreview.style.display = 'block';
                outputRaw.style.display = 'none';
            });
            
            copyBtn.addEventListener('click', () => {
                navigator.clipboard.writeText(outputRaw.value).then(() => {
                    const origText = copyBtn.textContent;
                    copyBtn.textContent = 'Copied!';
                    setTimeout(() => copyBtn.textContent = origText, 2000);
                });
            });
            
            downloadBtn.addEventListener('click', () => {
                const blob = new Blob([outputRaw.value], { type: 'text/markdown' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'README.md';
                a.click();
                URL.revokeObjectURL(url);
            });
        });
    </script>
</body>
</html>
