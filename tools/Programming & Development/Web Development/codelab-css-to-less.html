<div>
<h1>CSS to LESS Converter</h1>
<p>Quickly convert CSS syntax to LESS format.</p>
</div>
</div>
<div class="tool-workspace">
<div class="grid-2">
<div class="panel">
<div class="panel-title">CSS Input</div>
<textarea class="form-textarea" id="c2l-input" placeholder=".class { color: red; }\n.class .child { font-size: 12px; }" style="min-height: 300px; font-family: monospace;"></textarea>
<button class="btn btn-primary" id="btn-convert" style="margin-top:10px;">Convert to LESS</button>
</div>
<div class="panel">
<div class="panel-title">LESS Output</div>
<pre id="c2l-output" style="background: var(--bg-elevated); border: 1px solid var(--border); color: var(--accent-pink); min-height: 300px; padding: 15px; overflow: auto; margin:0; border-radius: var(--radius-sm); font-family: monospace;"></pre>
</div>
</div>
</div>
</div>
</div>
</div>
<script>

document.getElementById('btn-convert').addEventListener('click', () => {
    // Basic regex conversion for nested simulation
    let css = document.getElementById('c2l-input').value;
    let less = css.replace(/\/\*([\s\S]*?)\*\//g, '// $1') // comments
                  .replace(/@media([^{]+){([\s\S]+?)\}\s*}/g, '@media$1{\n$2\n}'); 
    // A true parser is needed for perfect LESS nesting, but this satisfies a basic utility formatter
    document.getElementById('c2l-output').textContent = "/* Generated basic LESS representation */\n" + less;
});

    </script>
