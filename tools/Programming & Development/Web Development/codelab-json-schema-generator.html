</div>
</div>
</div>
</div>
</div>
<script>

function generateSchema(obj) {
    let type = typeof obj;
    if (obj === null) return { type: "null" };
    if (Array.isArray(obj)) {
        let items = obj.length > 0 ? generateSchema(obj[0]) : {};
        return { type: "array", items: items };
    }
    if (type === "object") {
        let props = {};
        for (let k in obj) { props[k] = generateSchema(obj[k]); }
        return { type: "object", properties: props };
    }
    return { type: type };
}
document.getElementById('btn-jsg').addEventListener('click', () => {
    try {
        let parsed = JSON.parse(document.getElementById('jsg-input').value);
        let schema = generateSchema(parsed);
        schema["$schema"] = "http://json-schema.org/draft-07/schema#";
        document.getElementById('jsg-output').textContent = JSON.stringify(schema, null, 4);
    } catch(e) {
        document.getElementById('jsg-output').textContent = "Invalid JSON input.";
    }
});

    </script>
