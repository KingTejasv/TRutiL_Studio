<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>User Agent Parser</title>
<link href="../../../style.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Cascadia+Code&amp;display=swap" rel="stylesheet"/>
<link href="../../../custom-tools.css" rel="stylesheet"/>
<script src="../../../theme.js"></script>
</head>
<body><div class="app-layout" id="app-layout"><div class="main-content"><div class="page-content"><div id="tool-codelab-user-agent-parser">
<div class="app-header">
<div class="app-icon" style="background:linear-gradient(135deg, #3b82f6, #1d4ed8);color:white;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:24px;">🕵</div>
<div>
<h1>️ User Agent Parser</h1>
<p>Extract browser, operating system, and device information from a user agent string.</p>
</div>
</div>
<div class="tool-layout-container">
<div class="input-group">
<label for="uaInput">User Agent String</label>
<textarea class="form-input" id="uaInput" rows="3"></textarea>
</div>
<div class="toolbar">
<button class="btn btn-primary" onclick="parseUA()">⚡ Parse</button>
<button class="btn btn-primary" onclick="loadCurrent()" style="border-color: var(--text-muted); color: var(--text-muted); background: transparent;">🔄 Use My Browser's UA</button>
</div>
<div class="output-card" id="outputCard" style="display: none;">
<div class="info-group">
<div class="icon" id="browserIcon">🌐</div>
<div class="details">
<span class="label">Browser</span>
<span class="value" id="out-browser">-</span>
</div>
</div>
<div class="info-group">
<div class="icon" id="osIcon">💻</div>
<div class="details">
<span class="label">Operating System</span>
<span class="value" id="out-os">-</span>
</div>
</div>
<div class="info-group">
<div class="icon" id="deviceIcon">📱</div>
<div class="details">
<span class="label">Device Type</span>
<span class="value" id="out-device">-</span>
</div>
</div>
<div class="info-group">
<div class="icon">⚙️</div>
<div class="details">
<span class="label">Engine</span>
<span class="value" id="out-engine">-</span>
</div>
</div>
</div>
</div>
<script>
        function loadCurrent() {
            document.getElementById('uaInput').value = navigator.userAgent;
            parseUA();
        }

        function parseUA() {
            const ua = document.getElementById('uaInput').value.trim();
            if (!ua) return;

            let browser = "Unknown Browser";
            let browserVersion = "";
            let os = "Unknown OS";
            let osVersion = "";
            let device = "Desktop";
            let engine = "Unknown Engine";

            // Device
            if (/Mobi|Android|iPhone|iPad|iPod|Windows Phone/i.test(ua)) {
                device = "Mobile / Tablet";
                document.getElementById('deviceIcon').textContent = "📱";
            } else {
                device = "Desktop";
                document.getElementById('deviceIcon').textContent = "💻";
            }

            // OS
            if (/Windows NT 10.0/i.test(ua)) { os = "Windows 10/11"; document.getElementById('osIcon').textContent = "🪟"; }
            else if (/Windows NT 6.3/i.test(ua)) { os = "Windows 8.1"; document.getElementById('osIcon').textContent = "🪟"; }
            else if (/Windows NT 6.2/i.test(ua)) { os = "Windows 8"; document.getElementById('osIcon').textContent = "🪟"; }
            else if (/Windows NT 6.1/i.test(ua)) { os = "Windows 7"; document.getElementById('osIcon').textContent = "🪟"; }
            else if (/Mac OS X (\d+[._]\d+)/i.test(ua)) { 
                const match = ua.match(/Mac OS X (\d+[._]\d+[._]?\d*)/i);
                os = "macOS " + (match ? match[1].replace(/_/g, '.') : "");
                document.getElementById('osIcon').textContent = "🍎";
            }
            else if (/Android (\d+(\.\d+)?)/i.test(ua)) {
                const match = ua.match(/Android (\d+(\.\d+)?)/i);
                os = "Android " + (match ? match[1] : "");
                document.getElementById('osIcon').textContent = "🤖";
            }
            else if (/iPhone OS (\d+_\d+)/i.test(ua)) {
                const match = ua.match(/iPhone OS (\d+_\d+)/i);
                os = "iOS " + (match ? match[1].replace(/_/g, '.') : "");
                document.getElementById('osIcon').textContent = "🍎";
            }
            else if (/Linux/i.test(ua)) { os = "Linux"; document.getElementById('osIcon').textContent = "🐧"; }

            // Engine
            if (/Gecko\/\d+/i.test(ua) && !/like Gecko/i.test(ua)) engine = "Gecko";
            else if (/AppleWebKit/i.test(ua)) engine = "WebKit";
            else if (/Presto/i.test(ua)) engine = "Presto";
            else if (/Trident/i.test(ua)) engine = "Trident";

            // Browser
            if (/Edg\//i.test(ua)) {
                const match = ua.match(/Edg\/(\d+\.\d+)/i);
                browser = "Microsoft Edge";
                browserVersion = match ? match[1] : "";
            } else if (/Chrome\//i.test(ua)) {
                const match = ua.match(/Chrome\/(\d+\.\d+)/i);
                browser = "Chrome";
                browserVersion = match ? match[1] : "";
            } else if (/Firefox\//i.test(ua)) {
                const match = ua.match(/Firefox\/(\d+\.\d+)/i);
                browser = "Firefox";
                browserVersion = match ? match[1] : "";
            } else if (/Safari\//i.test(ua) && !/Chrome/i.test(ua)) {
                const match = ua.match(/Version\/(\d+\.\d+)/i);
                browser = "Safari";
                browserVersion = match ? match[1] : "";
            } else if (/MSIE |Trident\//i.test(ua)) {
                browser = "Internet Explorer";
            }

            document.getElementById('out-browser').textContent = browser + (browserVersion ? ` ${browserVersion}` : "");
            document.getElementById('out-os').textContent = os;
            document.getElementById('out-device').textContent = device;
            document.getElementById('out-engine').textContent = engine;

            document.getElementById('outputCard').style.display = 'grid';
        }

        // Initialize with current browser's UA
        loadCurrent();
    </script>
</div></div></div></div></body>
</html>
