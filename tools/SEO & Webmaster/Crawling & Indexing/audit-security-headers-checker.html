<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Security Headers Checker – TRutiL Studio</title>
    <meta content="Analyze HTTP response headers for missing security configurations." name="description"/>
    <link href="../../../style.css?v=3" rel="stylesheet"/>
    

    <script src="../../../theme.js?v=3"></script>
</head>
<body>
    <div class="app-layout" id="app-layout">
        <div class="main-content">
            <div class="page-content">
                <div class="app-header">
                    <div class="app-icon">🚀</div>
                    <div>
                        <h1>Security Headers Checker</h1>
                        <p>Analyze HTTP response headers for missing security configurations.</p>
                    </div>
                </div>

                <div class="tool-workspace">
                    <div class="panel">
                        <div class="panel-title">Security Headers Checker Interface</div>
                        
                        <div class="form-group">
                            <label class="form-label">Target Website URL</label>
                            <input type="url" id="tool-input" class="form-input" placeholder="https://example.com" />
                        </div>
                        
                        <div style="margin-top: 15px; margin-bottom: 25px;">
                            <button class="btn btn-primary" id="action-btn" style="width: 100%;">Audit Security Headers</button>
                        </div>

                        <div id="status-text" style="font-size: 14px; font-weight: 500; text-align: center; margin-bottom: 15px; color: var(--accent);"></div>

                        <div class="form-group">
                            <label class="form-label">Audit Results</label>
                            <div class="result-card" id="tool-output" style="min-height: 120px; background: var(--bg-elevated); color: var(--text-primary); border: 1px solid var(--border); overflow: auto;">
                                <span style="color: var(--text-muted); font-size: 14px;">Results will appear here...</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
document.addEventListener('DOMContentLoaded', () => {
    const actionBtn = document.getElementById('action-btn');
    const inputData = document.getElementById('tool-input');
    const outputData = document.getElementById('tool-output');
    const statusText = document.getElementById('status-text');

    let http, https, URLModule;
    try {
        http = require('http');
        https = require('https');
        URLModule = require('url').URL;
    } catch(err) {
        console.error(err);
        statusText.innerHTML = `<span style='color:red;'>Node Integration Error: ${err.message}</span>`;
    }

    const criticalHeaders = [
        { key: 'strict-transport-security', name: 'Strict-Transport-Security (HSTS)', desc: 'Enforces secure (HTTP over SSL/TLS) connections to the server' },
        { key: 'content-security-policy', name: 'Content-Security-Policy (CSP)', desc: 'Prevents XSS and other cross-site injections' },
        { key: 'x-frame-options', name: 'X-Frame-Options', desc: 'Protects against clickjacking attacks' },
        { key: 'x-content-type-options', name: 'X-Content-Type-Options', desc: 'Prevents MIME-sniffing' },
        { key: 'referrer-policy', name: 'Referrer-Policy', desc: 'Controls how much referrer information is included with requests' },
        { key: 'permissions-policy', name: 'Permissions-Policy', desc: 'Controls which browser features and APIs can be used' }
    ];

    actionBtn.addEventListener('click', async () => {
        let targetUrl = inputData.value.trim();
        if(!targetUrl) {
            statusText.innerHTML = `<span style="color: var(--accent-red);">Please enter a URL.</span>`;
            return;
        }
        if (!/^https?:\/\//i.test(targetUrl)) {
            targetUrl = 'https://' + targetUrl;
            inputData.value = targetUrl;
        }
        
        actionBtn.disabled = true;
        outputData.innerHTML = '';
        statusText.innerHTML = `<span style="color: var(--tv-primary);">Fetching headers from ${targetUrl}...</span>`;
        
        try {
            const parsedUrl = new URLModule(targetUrl);
            const client = parsedUrl.protocol === 'https:' ? https : http;
            const options = {
                method: 'HEAD',
                headers: { 'User-Agent': 'TRutiL-Security-Auditor/1.0' },
                timeout: 8000
            };
            
            const req = client.request(targetUrl, options, (res) => {
                const headers = res.headers;
                let score = 0;
                
                let html = `
                    <div style="margin-bottom: 20px; font-weight: bold; font-size: 16px;">
                        Server: <span style="font-weight: normal; color: var(--accent);">${headers.server || 'Unknown'}</span>
                    </div>
                    <table style="width: 100%; border-collapse: collapse; text-align: left; font-size: 13px;">
                        <thead>
                            <tr style="border-bottom: 1px solid var(--border);">
                                <th style="padding: 8px;">Security Header</th>
                                <th style="padding: 8px;">Status</th>
                                <th style="padding: 8px; width: 45%;">Value</th>
                            </tr>
                        </thead>
                        <tbody>
                `;
                
                criticalHeaders.forEach(ch => {
                    const val = headers[ch.key];
                    if (val) {
                        score++;
                        html += `
                            <tr style="border-bottom: 1px solid var(--border);">
                                <td style="padding: 8px;"><strong>${ch.name}</strong><br/><span style="font-size: 11px; color: var(--text-muted);">${ch.desc}</span></td>
                                <td style="padding: 8px;"><span style="color:#00FF25; font-weight: bold;">Present</span></td>
                                <td style="padding: 8px; word-break: break-all; color: var(--text-muted);">${val}</td>
                            </tr>
                        `;
                    } else {
                        html += `
                            <tr style="border-bottom: 1px solid var(--border); background: rgba(239, 68, 68, 0.05);">
                                <td style="padding: 8px;"><strong>${ch.name}</strong><br/><span style="font-size: 11px; color: var(--text-muted);">${ch.desc}</span></td>
                                <td style="padding: 8px;"><span style="color:#ef4444; font-weight: bold;">Missing</span></td>
                                <td style="padding: 8px; color: var(--text-muted);">-</td>
                            </tr>
                        `;
                    }
                });
                
                html += `</tbody></table>`;
                
                const grade = score === 6 ? 'A+' : score >= 4 ? 'B' : score >= 2 ? 'C' : 'F';
                let gradeColor = score >= 4 ? '#00FF25' : score >= 2 ? '#f59e0b' : '#ef4444';
                
                statusText.innerHTML = `<span style="color: var(--accent-green);">Audit Complete</span>`;
                outputData.innerHTML = `
                    <div style="display:flex; flex-direction:column; gap: 10px;">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                            <span style="font-size: 18px; font-weight: bold;">Security Posture</span>
                            <div style="background: ${gradeColor}20; border: 1px solid ${gradeColor}; color: ${gradeColor}; padding: 5px 15px; border-radius: 20px; font-weight: bold; font-size: 18px;">
                                Grade: ${grade}
                            </div>
                        </div>
                        ${html}
                    </div>
                `;
                actionBtn.disabled = false;
            });
            
            req.on('error', (err) => {
                statusText.innerHTML = `<span style="color: var(--accent-red);">Error: ${err.message}</span>`;
                actionBtn.disabled = false;
            });
            req.on('timeout', () => { 
                req.abort(); 
                statusText.innerHTML = `<span style="color: var(--accent-red);">Connection timed out.</span>`;
                actionBtn.disabled = false;
            });
            req.end();
            
        } catch(e) {
            statusText.innerHTML = `<span style="color: var(--accent-red);">Error: ${e.message}</span>`;
            actionBtn.disabled = false;
        }
    });
});
</script>

    <!-- Desktop Engine Guard -->
    <script>
        if (typeof require === 'undefined' || !window.process || !window.process.versions || !window.process.versions.electron) {
            const appLayout = document.getElementById('app-layout');
            if (appLayout) {
                appLayout.style.filter = 'blur(8px)';
                appLayout.style.pointerEvents = 'none';
                appLayout.style.userSelect = 'none';
            }
            const overlay = document.createElement('div');
            overlay.style.position = 'fixed';
            overlay.style.top = '0';
            overlay.style.left = '0';
            overlay.style.width = '100vw';
            overlay.style.height = '100vh';
            overlay.style.backgroundColor = 'rgba(15, 23, 42, 0.85)';
            overlay.style.backdropFilter = 'blur(4px)';
            overlay.style.zIndex = '999999';
            overlay.style.display = 'flex';
            overlay.style.flexDirection = 'column';
            overlay.style.alignItems = 'center';
            overlay.style.justifyContent = 'center';
            overlay.style.color = 'white';
            overlay.style.fontFamily = 'Inter, sans-serif';
            overlay.style.textAlign = 'center';
            overlay.style.padding = '20px';
            
            overlay.innerHTML = `
                <div style="background: var(--bg-card, #1e293b); padding: 40px; border-radius: 20px; border: 1px solid var(--border, #334155); max-width: 500px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);">
                    <div style="font-size: 48px; margin-bottom: 20px;">⚡</div>
                    <h2 style="font-size: 24px; font-weight: 700; margin: 0 0 15px 0;">Desktop Engine Required</h2>
                    <p style="font-size: 16px; color: #94a3b8; line-height: 1.6; margin: 0 0 25px 0;">This advanced feature requires a local engine. It is available exclusively on the TRutiL Studio Desktop App <strong style="color: white;">FOR FREE</strong>.</p>
                    <button style="font-size: 16px; padding: 12px 24px; cursor: pointer; background: #3b82f6; color: white; border: none; border-radius: 8px; font-weight: 600;" onclick="window.history.back();">Return</button>
                </div>
            `;
            document.body.appendChild(overlay);
        }
    </script>
</body>
</html>
