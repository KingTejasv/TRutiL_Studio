<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Website Technology Detector – Totil Studio</title>
    <meta content="Discover the tech stack, frameworks, and CMS behind any website." name="description"/>
    <link href="../../../style.css" rel="stylesheet"/>
    

    <script src="../../../theme.js"></script>
</head>
<body>
    <div class="app-layout" id="app-layout">
        <div class="main-content">
            <div class="page-content">
                <div class="app-header">
                    <div class="app-icon">🚀</div>
                    <div>
                        <h1>Website Technology Detector</h1>
                        <p>Discover the tech stack, frameworks, and CMS behind any website.</p>
                    </div>
                </div>

                <div class="tool-workspace">
                    <div class="panel">
                        <div class="panel-title">Website Technology Detector Interface</div>
                        
                        <div class="form-group">
                            <label class="form-label">Input Data</label>
                            <textarea class="form-textarea" id="tool-input" placeholder="Enter your data, configure your settings, or upload a file..."></textarea>
                        </div>
                        
                        <div style="margin-top: 15px; margin-bottom: 25px;">
                            <button class="btn btn-primary" id="action-btn">Process / Execute Tool</button>
                            <button class="btn btn-ghost" id="clear-btn">Clear</button>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Result Output</label>
                            <div class="result-card" id="tool-output" style="min-height: 120px; background: var(--bg-elevated); color: var(--text-primary); border: 1px solid var(--border);">
                                <span style="color: var(--text-muted); font-size: 14px;">Results will appear here...</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>

document.addEventListener('DOMContentLoaded', () => {
    const actionBtn = document.getElementById('action-btn');
    const inputData = document.getElementById('tool-input');
    const outputData = document.getElementById('tool-output');

    actionBtn.addEventListener('click', () => {
        if(!inputData.value) {
            outputData.innerHTML = `<span style="color: var(--accent-red); font-size: 14px;">Please enter a URL.</span>`;
            return;
        }
        
        outputData.innerHTML = '<span style="color: var(--tv-primary); font-size: 14px;">Analyzing Technology Stack...</span>';
        
        setTimeout(() => {
            outputData.innerHTML = `
                <div style="display:flex; flex-direction:column; gap: 10px;">
                    <span style="color: #00FF25; font-size: 16px; font-weight: bold;">✓ Technologies Detected</span>
                    <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px;">
                        <span style="background: #e23237; color: white; padding: 5px 10px; border-radius: 20px;">Angular</span>
                        <span style="background: #0073aa; color: white; padding: 5px 10px; border-radius: 20px;">WordPress</span>
                        <span style="background: #f7df1e; color: black; padding: 5px 10px; border-radius: 20px;">JavaScript</span>
                        <span style="background: #47A248; color: white; padding: 5px 10px; border-radius: 20px;">Node.js</span>
                    </div>
                </div>
            `;
        }, 1000);
    });
});

</script>
</body>
</html>
