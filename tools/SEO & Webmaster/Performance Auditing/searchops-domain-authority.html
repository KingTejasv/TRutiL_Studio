<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Domain Authority Checker | SearchOps</title>

<link href="../../../style.css?v=3" rel="stylesheet"/><link href="../../../custom-tools.css?v=3" rel="stylesheet"/>
    <script src="../../../theme.js?v=3"></script>
</head>
<body><div class="app-layout" id="app-layout"><div class="main-content"><div class="page-content"><div id="tool-searchops-domain-authority">
<div class="tool-layout-container">
<div class="app-header">
<h1>📈 Domain Authority Checker</h1>
<p>Bulk check Domain Authority (DA), Page Authority (PA), and Spam Score.</p>
</div>
<div class="grid">
<div class="card">
<label for="domainsInput">Domains to Check (One per line)</label>
<textarea class="form-input" id="domainsInput" placeholder="example.com
google.com">apple.com
microsoft.com
unknown-spam-site.xyz
github.com</textarea>
<button class="btn btn-primary" id="actionBtn">
<svg fill="none" height="20" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24" width="20"><path d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                    Check Authority
                </button>
</div>
<div class="card" id="resultsCard">
<div class="empty-state">
<svg fill="none" stroke="currentColor" stroke-width="1.5" viewbox="0 0 24 24"><path d="M3 13h2.25v8.25h3.75v-8.25h3.75v8.25h3.75v-8.25h3.75v8.25H21V13M3 13V5.25A2.25 2.25 0 015.25 3h13.5A2.25 2.25 0 0121 5.25V13" stroke-linecap="round" stroke-linejoin="round"></path></svg>
<p>Enter domains and click check to view authority metrics.</p>
</div>
</div>
</div>
</div>
<script>
        function getScoreClass(score, isSpam = false) {
            if (isSpam) {
                if (score > 30) return 'low'; // Red
                if (score > 10) return 'medium'; // Yellow
                return 'high'; // Green
            } else {
                if (score >= 60) return 'high';
                if (score >= 30) return 'medium';
                return 'low';
            }
        }

        document.getElementById('actionBtn').addEventListener('click', function() {
            const domainsText = document.getElementById('domainsInput').value;
            const domains = domainsText.split('\n').map(d => d.trim().replace(/^https?:\/\//, '').split('/')[0]).filter(d => d);
            if(domains.length === 0) return;

            const btn = this;
            const resultsCard = document.getElementById('resultsCard');
            
            btn.innerHTML = '<svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" class="animate-spin"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg> Analyzing...';
            btn.disabled = true;

            setTimeout(() => {
                btn.innerHTML = '<svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path></svg> Check Authority';
                btn.disabled = false;

                let tableRows = '';
                domains.forEach(domain => {
                    // Generate pseudo-deterministic metrics
                    const seed = domain.length + domain.charCodeAt(0) + domain.charCodeAt(domain.length-1);
                    
                    let da, pa, spam;
                    if (domain.includes('xyz') || domain.includes('spam')) {
                        da = Math.max(1, seed % 15);
                        pa = Math.max(1, seed % 20);
                        spam = Math.min(100, 40 + (seed % 60));
                    } else if (domain.includes('apple') || domain.includes('google') || domain.includes('microsoft')) {
                        da = Math.min(99, 90 + (seed % 10));
                        pa = Math.min(99, 85 + (seed % 15));
                        spam = Math.max(1, seed % 5);
                    } else {
                        da = Math.max(10, seed % 80);
                        pa = Math.max(10, (seed + 10) % 80);
                        spam = Math.max(1, seed % 15);
                    }

                    tableRows += `
                        <tr>
                            <td style="font-weight: 500;">${domain}</td>
                            <td>
                                ${da} 
                                <div class="score-bar"><div class="score-fill ${getScoreClass(da)}" style="width: ${da}%"></div></div>
                            </td>
                            <td>
                                ${pa}
                                <div class="score-bar"><div class="score-fill ${getScoreClass(pa)}" style="width: ${pa}%"></div></div>
                            </td>
                            <td>
                                <span style="color: ${spam > 30 ? '#EF4444' : (spam > 10 ? '#F59E0B' : '#10B981')}">${spam}%</span>
                            </td>
                        </tr>
                    `;
                });

                resultsCard.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                        <h3 style="margin: 0;">Metrics Overview</h3>
                        <span style="font-size: 0.8rem; color: var(--text-muted);">Simulated Data</span>
                    </div>
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>Domain</th>
                                    <th>Domain Authority (DA)</th>
                                    <th>Page Authority (PA)</th>
                                    <th>Spam Score</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${tableRows}
                            </tbody>
                        </table>
                    </div>
                `;
            }, 1200);
        });
    </script>
</div></div></div></div></body>
</html>
