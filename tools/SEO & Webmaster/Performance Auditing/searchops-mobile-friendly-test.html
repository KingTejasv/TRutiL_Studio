<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Mobile Friendly Test - SearchOps</title>

<link href="../../../style.css" rel="stylesheet"/><link href="../../../custom-tools.css" rel="stylesheet"/>
    <script src="../../../theme.js"></script>
</head>
<body><div class="app-layout" id="app-layout"><div class="main-content"><div class="page-content"><div id="tool-searchops-mobile-friendly-test">
<div class="tool-layout-container">
<div class="app-header">
<h1>📱 Mobile Friendly Test</h1>
<p>Preview and test website responsiveness on mobile devices</p>
</div>
<div class="grid">
<div class="card">
<div class="input-group">
<label>Website URL</label>
<input class="form-input" id="url" placeholder="https://example.com" type="url"/>
</div>
<button class="btn btn-primary" id="btn" onclick="testMobile()">📱 Run Mobile Test</button>
<div class="result-card" id="result-card">
<h3 style="margin-top:0; color:var(--success);">✅ Mobile Friendly</h3>
<p>This page appears to be optimized for mobile devices.</p>
<ul style="color:var(--text-muted); line-height:1.6;">
<li>Viewport is configured</li>
<li>Content fits the screen</li>
<li>Text is readable</li>
<li>Interactive elements are accessible</li>
</ul>
</div>
</div>
<div style="display:flex; justify-content:center; align-items:center;">
<div class="phone-frame">
<div class="phone-notch"></div>
<iframe id="frame"></iframe>
<div id="loader" style="display:none; position:absolute; top:0;left:0;right:0;bottom:0; background:var(--bg-base); display:flex; align-items:center; justify-content:center; color:var(--accent); font-weight:bold;">
                    Rendering...
                </div>
</div>
</div>
</div>
</div>
<script>
document.getElementById('loader').style.display = 'none';
function testMobile() {
    let url = document.getElementById('url').value;
    if(!url) return;
    if(!url.startsWith('http')) url = 'https://' + url;
    
    document.getElementById('loader').style.display = 'flex';
    document.getElementById('result-card').style.display = 'none';
    
    setTimeout(() => {
        document.getElementById('frame').src = url;
        document.getElementById('loader').style.display = 'none';
        document.getElementById('result-card').style.display = 'block';
    }, 1200);
}
</script>
</div></div></div></div></body>
</html>
