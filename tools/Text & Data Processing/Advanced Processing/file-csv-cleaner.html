<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>CSV Cleaner & Optimizer – TRutiL Studio</title>
    <meta content="Clean, optimize, and format your CSV data offline." name="description"/>
    <link href="../../../style.css?v=3" rel="stylesheet"/>
    <script src="../../../theme.js?v=3"></script>
    <style>
        .split-pane {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 20px;
        }
        @media (max-width: 768px) {
            .split-pane { grid-template-columns: 1fr; }
        }
        .file-upload-box {
            border: 2px dashed var(--border);
            padding: 30px 20px;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 20px;
            background: var(--bg-card);
            transition: all 0.2s;
        }
        .file-upload-box:hover {
            border-color: var(--accent);
            background: rgba(59, 130, 246, 0.05);
        }
        .stats-box {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }
        .stat-item {
            background: var(--bg-elevated);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid var(--border);
        }
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: var(--accent);
        }
        .stat-label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
        }
        .data-table-container {
            overflow: auto;
            max-height: 500px;
            border: 1px solid var(--border);
            border-radius: 8px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        th, td {
            padding: 8px 12px;
            border: 1px solid var(--border);
            text-align: left;
            white-space: nowrap;
        }
        th {
            background: var(--bg-elevated);
            position: sticky;
            top: 0;
            z-index: 10;
        }
        tr:nth-child(even) {
            background: rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div class="app-layout" id="app-layout">
        <div class="main-content">
            <div class="page-content">
                <div class="app-header">
                    <div class="app-icon" style="background:linear-gradient(135deg, #10b981, #047857);color:white;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:24px;">📊</div>
                    <div>
                        <h1>CSV Cleaner & Optimizer</h1>
                        <p>Automatically remove empty rows, trim whitespace, and clean up your CSV data completely offline.</p>
                    </div>
                </div>
                <div class="tool-workspace">
                    
                    <div class="split-pane">
                        <div class="panel">
                            <div class="panel-title">Configuration</div>
                            
                            <div class="file-upload-box" id="upload-box">
                                <div style="font-size: 24px; margin-bottom: 10px;">📁</div>
                                <div>Click or drag CSV here</div>
                                <input type="file" id="file-input" accept=".csv" style="display: none;" />
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label" style="display:flex; align-items:center; gap:8px;">
                                    <input type="checkbox" id="opt-empty-rows" checked /> Remove Empty Rows
                                </label>
                                <label class="form-label" style="display:flex; align-items:center; gap:8px;">
                                    <input type="checkbox" id="opt-duplicates" checked /> Remove Duplicate Rows
                                </label>
                                <label class="form-label" style="display:flex; align-items:center; gap:8px;">
                                    <input type="checkbox" id="opt-trim" checked /> Trim Whitespace
                                </label>
                            </div>
                            
                            <button class="btn btn-primary" id="clean-btn" style="width: 100%;" disabled>Clean CSV</button>
                            <button class="btn btn-ghost" id="download-btn" style="width: 100%; margin-top: 10px; display: none;">Download Cleaned CSV</button>
                        </div>
                        
                        <div class="panel">
                            <div class="panel-title">Preview & Stats</div>
                            
                            <div class="stats-box">
                                <div class="stat-item">
                                    <div class="stat-value" id="stat-original">0</div>
                                    <div class="stat-label">Original Rows</div>
                                </div>
                                <div class="stat-item">
                                    <div class="stat-value" id="stat-cleaned" style="color:var(--accent-green)">0</div>
                                    <div class="stat-label">Cleaned Rows</div>
                                </div>
                            </div>
                            
                            <div class="data-table-container">
                                <table id="preview-table">
                                    <thead><tr id="table-head"><th>Upload a file to see preview</th></tr></thead>
                                    <tbody id="table-body"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                    
                </div>
            </div>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const uploadBox = document.getElementById('upload-box');
            const fileInput = document.getElementById('file-input');
            const cleanBtn = document.getElementById('clean-btn');
            const downloadBtn = document.getElementById('download-btn');
            const statOriginal = document.getElementById('stat-original');
            const statCleaned = document.getElementById('stat-cleaned');
            const tableHead = document.getElementById('table-head');
            const tableBody = document.getElementById('table-body');
            
            const optEmptyRows = document.getElementById('opt-empty-rows');
            const optDuplicates = document.getElementById('opt-duplicates');
            const optTrim = document.getElementById('opt-trim');
            
            let originalData = [];
            let cleanedData = [];
            let fileName = 'cleaned.csv';
            
            uploadBox.addEventListener('click', () => fileInput.click());
            
            uploadBox.addEventListener('dragover', (e) => { e.preventDefault(); uploadBox.style.borderColor = 'var(--accent)'; });
            uploadBox.addEventListener('dragleave', () => { uploadBox.style.borderColor = 'var(--border)'; });
            uploadBox.addEventListener('drop', (e) => {
                e.preventDefault();
                uploadBox.style.borderColor = 'var(--border)';
                if (e.dataTransfer.files.length) {
                    processFile(e.dataTransfer.files[0]);
                }
            });
            
            fileInput.addEventListener('change', (e) => {
                if (e.target.files.length) {
                    processFile(e.target.files[0]);
                }
            });
            
            function processFile(file) {
                fileName = file.name;
                const reader = new FileReader();
                reader.onload = (e) => {
                    const text = e.target.result;
                    parseCSV(text);
                };
                reader.readAsText(file);
            }
            
            function parseCSV(text) {
                // Basic CSV parser
                const lines = text.split(/\r?\n/);
                originalData = [];
                for(let line of lines) {
                    // Split by comma ignoring commas inside double quotes
                    const cols = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    if (cols.length > 0) {
                        originalData.push(cols);
                    }
                }
                statOriginal.textContent = originalData.length;
                statCleaned.textContent = '-';
                cleanBtn.disabled = false;
                downloadBtn.style.display = 'none';
                renderTable(originalData, 50); // Preview up to 50 rows
            }
            
            cleanBtn.addEventListener('click', () => {
                let data = [...originalData];
                
                // 1. Remove Empty Rows
                if (optEmptyRows.checked) {
                    data = data.filter(row => {
                        const joined = row.join('').trim();
                        return joined.length > 0 && joined !== '""';
                    });
                }
                
                // 2. Trim Whitespace
                if (optTrim.checked) {
                    data = data.map(row => row.map(col => {
                        if (col.startsWith('"') && col.endsWith('"')) {
                            return '"' + col.substring(1, col.length - 1).trim() + '"';
                        }
                        return col.trim();
                    }));
                }
                
                // 3. Remove Duplicates
                if (optDuplicates.checked) {
                    const seen = new Set();
                    data = data.filter(row => {
                        const str = JSON.stringify(row);
                        if (seen.has(str)) return false;
                        seen.add(str);
                        return true;
                    });
                }
                
                cleanedData = data;
                statCleaned.textContent = cleanedData.length;
                downloadBtn.style.display = 'block';
                renderTable(cleanedData, 50);
            });
            
            function renderTable(data, limit) {
                tableHead.innerHTML = '';
                tableBody.innerHTML = '';
                
                if (data.length === 0) return;
                
                const headers = data[0];
                headers.forEach(h => {
                    const th = document.createElement('th');
                    th.textContent = h.replace(/(^"|"$)/g, ''); // strip quotes for display
                    tableHead.appendChild(th);
                });
                
                const rowsToShow = Math.min(data.length - 1, limit);
                for (let i = 1; i <= rowsToShow; i++) {
                    const tr = document.createElement('tr');
                    data[i].forEach(col => {
                        const td = document.createElement('td');
                        td.textContent = col.replace(/(^"|"$)/g, '');
                        tr.appendChild(td);
                    });
                    tableBody.appendChild(tr);
                }
            }
            
            downloadBtn.addEventListener('click', () => {
                if (!cleanedData || cleanedData.length === 0) return;
                
                const csvString = cleanedData.map(row => row.join(',')).join('\n');
                const blob = new Blob([csvString], { type: 'text/csv' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'cleaned_' + fileName;
                a.click();
                URL.revokeObjectURL(url);
            });
        });
    </script>
</body>
</html>
