<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Diff Checker Pro</title>
<link href="../../../style.css?v=3" rel="stylesheet"/>

<link href="../../../custom-tools.css?v=3" rel="stylesheet"/>
    <script src="../../../theme.js?v=3"></script>
</head>
<body><div class="app-layout" id="app-layout"><div class="main-content"><div class="page-content"><div id="tool-protools-diff-checker-pro">
<div class="tool-layout-container">
<div class="app-header">
<h1>⚖️ Diff Checker Pro</h1>
<p>Compare text differences easily.</p>
</div>
<div class="card" style="margin-bottom: 1rem;">
<div class="toolbar">
<button class="btn btn-primary" id="compare-btn">⚡ Compare Texts</button>
<button class="btn btn-primary" id="clear-btn" style="background: transparent; border-color: var(--text-muted); color: var(--text-muted);">Clear</button>
</div>
</div>
<div class="grid-split">
<div class="card">
<label for="text1">Original Text</label>
<textarea class="form-input" id="text1" placeholder="Paste original text here..."></textarea>
</div>
<div class="card">
<label for="text2">Modified Text</label>
<textarea class="form-input" id="text2" placeholder="Paste modified text here..."></textarea>
</div>
</div>
<div class="card" style="margin-top: 1.5rem;">
<label>Diff Result</label>
<div class="result-panel" id="diff-result" style="font-family: 'Cascadia Code', monospace; white-space: pre-wrap; word-break: break-all;">
<div style="color: var(--text-muted); text-align: center; padding: 2rem;">Click compare to see differences</div>
</div>
<div class="stats-bar">
<span id="diff-stats">Waiting for input...</span>
<span class="pill" id="changes-pill" style="display:none;"></span>
</div>
</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/diff_match_patch/20121119/diff_match_patch.js"></script>
<script>
    const dmp = new diff_match_patch();
    const btn = document.getElementById('compare-btn');
    const clearBtn = document.getElementById('clear-btn');
    const text1 = document.getElementById('text1');
    const text2 = document.getElementById('text2');
    const result = document.getElementById('diff-result');
    const stats = document.getElementById('diff-stats');
    const pill = document.getElementById('changes-pill');

    btn.addEventListener('click', () => {
        const t1 = text1.value;
        const t2 = text2.value;
        
        if (!t1 && !t2) return;
        
        const diffs = dmp.diff_main(t1, t2);
        dmp.diff_cleanupSemantic(diffs);
        
        let html = '';
        let additions = 0;
        let deletions = 0;
        
        diffs.forEach(part => {
            const op = part[0]; // -1, 0, 1
            const text = part[1].replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
            
            if (op === 1) {
                html += `<ins style="background: rgba(16, 185, 129, 0.2); color: #10B981; text-decoration: none;">${text}</ins>`;
                additions++;
            } else if (op === -1) {
                html += `<del style="background: rgba(239, 68, 68, 0.2); color: #EF4444; text-decoration: none;">${text}</del>`;
                deletions++;
            } else {
                html += `<span style="color: var(--text-muted);">${text}</span>`;
            }
        });
        
        result.innerHTML = html || '<div style="color: var(--text-muted); text-align: center; padding: 2rem;">No differences found.</div>';
        stats.textContent = `Original: ${t1.length} chars | Modified: ${t2.length} chars`;
        
        pill.style.display = 'inline-block';
        if(additions === 0 && deletions === 0) {
             pill.textContent = 'Identical';
             pill.className = 'pill';
             pill.style.color = '#F59E0B';
             pill.style.background = 'rgba(245, 158, 11, 0.15)';
        } else {
             pill.textContent = `+${additions} additions, -${deletions} deletions`;
             pill.className = 'pill';
             pill.style.color = '#10B981';
             pill.style.background = 'rgba(16, 185, 129, 0.15)';
        }
    });

    clearBtn.addEventListener('click', () => {
        text1.value = '';
        text2.value = '';
        result.innerHTML = '<div style="color: var(--text-muted); text-align: center; padding: 2rem;">Click compare to see differences</div>';
        stats.textContent = 'Waiting for input...';
        pill.style.display = 'none';
    });
</script>
</div></div></div></div></body>
</html>
