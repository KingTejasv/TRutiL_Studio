<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Universal Text Encoder / Decoder — TRutiL Studio</title>
<link href="../../../style.css?v=3" rel="stylesheet"/>
<link href="../../../custom-tools.css?v=3" rel="stylesheet"/>
<script src="../../../theme.js?v=3"></script>
<style>
    .panel-container { display: flex; gap: 20px; flex-wrap: wrap; }
    .panel { flex: 1; min-width: 300px; display: flex; flex-direction: column; gap: 10px; }
    textarea { width: 100%; height: 250px; resize: vertical; padding: 10px; }
    .controls { display: flex; flex-wrap: wrap; gap: 10px; margin: 15px 0; }
</style>
</head>
<body>
<div class="app-layout" id="app-layout">
<div class="main-content">
<div class="page-content">
    <div class="app-header">
        <div class="app-icon" style="background:linear-gradient(135deg,#3B82F6,#2563EB);color:white;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:24px;">🔐</div>
        <div>
            <h1>Universal Text Encoder / Decoder</h1>
            <p>Encode and decode text using Base64, URL, HTML, Binary, Hex, and ROT13.</p>
        </div>
    </div>
    
    <div class="panel-container">
        <div class="panel">
            <h3>Input Text</h3>
            <textarea class="form-input" id="input-text" placeholder="Type or paste your text here..."></textarea>
            <div id="stats" style="font-size: 0.85rem; color: var(--text-muted);">Words: 0 | Characters: 0 | Lines: 0</div>
        </div>
        <div class="panel">
            <h3>Output Text</h3>
            <textarea class="form-input" id="output-text" readonly placeholder="Result will appear here..."></textarea>
            <button class="btn btn-secondary" onclick="document.getElementById('output-text').select(); document.execCommand('copy'); alert('Copied!')">Copy Output</button>
        </div>
    </div>
    
    <div class="controls">
        
<button class="btn btn-primary" onclick="convert('b64enc')">Base64 Encode</button>
<button class="btn btn-primary" onclick="convert('b64dec')">Base64 Decode</button>
<button class="btn btn-primary" onclick="convert('urlenc')">URL Encode</button>
<button class="btn btn-primary" onclick="convert('urldec')">URL Decode</button>
<button class="btn btn-primary" onclick="convert('htmlenc')">HTML Encode</button>
<button class="btn btn-primary" onclick="convert('htmldec')">HTML Decode</button>
<button class="btn btn-secondary" onclick="convert('binenc')">Text to Binary</button>
<button class="btn btn-secondary" onclick="convert('bindec')">Binary to Text</button>
<button class="btn btn-secondary" onclick="convert('hexenc')">Text to Hex</button>
<button class="btn btn-secondary" onclick="convert('hexdec')">Hex to Text</button>
<button class="btn btn-secondary" onclick="convert('rot13')">ROT13 Cipher</button>

    </div>
</div>
</div>
</div>
<script>
    const input = document.getElementById('input-text');
    const output = document.getElementById('output-text');
    const stats = document.getElementById('stats');
    
    input.addEventListener('input', () => {
        const text = input.value;
        const words = text.trim() ? text.trim().split(/\s+/).length : 0;
        const lines = text.length === 0 ? 0 : text.split('\n').length;
        stats.textContent = `Words: ${words} | Characters: ${text.length} | Lines: ${lines}`;
    });

    
    function textToBinary(text) { return text.split('').map(c => c.charCodeAt(0).toString(2).padStart(8,'0')).join(' '); }
    function binaryToText(binary) { return binary.split(' ').map(b => String.fromCharCode(parseInt(b, 2))).join(''); }
    function textToHex(text) { return text.split('').map(c => c.charCodeAt(0).toString(16).padStart(2,'0')).join(' '); }
    function hexToText(hex) { return hex.split(' ').map(h => String.fromCharCode(parseInt(h, 16))).join(''); }
    function rot13(str) { return str.replace(/[a-zA-Z]/g, c => String.fromCharCode((c <= 'Z' ? 90 : 122) >= (c = c.charCodeAt(0) + 13) ? c : c - 26)); }

    function convert(type) {
        let txt = input.value;
        if(!txt) return;
        try {
            switch(type) {
                case 'b64enc': txt = btoa(unescape(encodeURIComponent(txt))); break;
                case 'b64dec': txt = decodeURIComponent(escape(atob(txt))); break;
                case 'urlenc': txt = encodeURIComponent(txt); break;
                case 'urldec': txt = decodeURIComponent(txt); break;
                case 'htmlenc': 
                    const div = document.createElement('div');
                    div.innerText = txt;
                    txt = div.innerHTML;
                    break;
                case 'htmldec':
                    const doc = new DOMParser().parseFromString(txt, 'text/html');
                    txt = doc.documentElement.textContent;
                    break;
                case 'binenc': txt = textToBinary(txt); break;
                case 'bindec': txt = binaryToText(txt); break;
                case 'hexenc': txt = textToHex(txt); break;
                case 'hexdec': txt = hexToText(txt); break;
                case 'rot13': txt = rot13(txt); break;
            }
            output.value = txt;
        } catch(e) {
            alert("Error converting: " + e.message);
        }
    }

</script>
</body>
</html>
