<div>
<h1>ASCII Table Reference</h1>
<p>Quickly lookup ASCII character codes in HEX, DEC, and OCT.</p>
</div>
</div>
<div class="tool-workspace">
<div class="panel" style="overflow-x: auto;">
<table style="width:100%; border-collapse: collapse; font-family: monospace; text-align: left;">
<thead>
<tr style="border-bottom: 2px solid var(--border);">
<th style="padding: 10px;">DEC</th><th style="padding: 10px;">HEX</th><th style="padding: 10px;">OCT</th><th style="padding: 10px;">CHAR</th>
<th style="padding: 10px;">DEC</th><th style="padding: 10px;">HEX</th><th style="padding: 10px;">OCT</th><th style="padding: 10px;">CHAR</th>
</tr>
</thead>
<tbody id="ascii-body"></tbody>
</table>
</div>
</div>
</div>
</div>
</div>
<script>

const body = document.getElementById('ascii-body');
let html = '';
for(let i = 32; i < 78; i++) {
    let c1 = String.fromCharCode(i);
    let i2 = i + 47;
    let c2 = i2 < 127 ? String.fromCharCode(i2) : (i2 === 127 ? 'DEL' : '');
    
    html += `<tr style="border-bottom: 1px solid var(--border);">
        <td style="padding: 6px 10px;">${i}</td><td style="padding: 6px 10px;">${i.toString(16).toUpperCase()}</td><td style="padding: 6px 10px;">${i.toString(8)}</td><td style="padding: 6px 10px; font-weight:bold; color:var(--accent);">${c1}</td>
        <td style="padding: 6px 10px;">${i2}</td><td style="padding: 6px 10px;">${i2.toString(16).toUpperCase()}</td><td style="padding: 6px 10px;">${i2.toString(8)}</td><td style="padding: 6px 10px; font-weight:bold; color:var(--accent);">${c2}</td>
    </tr>`;
}
body.innerHTML = html;

    </script>
